"Cyclotron frequency f = (q × B) / (2 × π × m). Substituting values: f = (1.6 × 10⁻¹⁹ C × 0.80 T) / (2 × π × 1.67 × 10⁻²⁷ kg) = 1.2816×10⁻¹⁹ / 1.0493×10⁻²⁶ = 1.22 × 10⁷ Hz (12.2 MHz)."}, {"n": 37, "section": "CH 6 · MAGNETISM", "q": "A cyclotron has maximum Dee radius of 0.50 m and magnetic field 1.50 T. Calculate maximum kinetic energy of a proton (1.67 × 10⁻²⁷ kg, 1.6 × 10⁻¹⁹ C) extracted from the accelerator.", "opts": ["4.32 × 10⁻¹² J", "8.64 × 10⁻¹² J", "2.16 × 10⁻¹² J", "4.32 × 10⁻¹⁵ J"], "ans": "A", "exp": "Maximum velocity v_max = q B R / m. Maximum kinetic energy K = 0.5 m v_max² = (q² B² R²) / (2 m) = (1.6 × 10⁻¹⁹ C² × 1.50² × 0.50²) / (2 × 1.67 × 10⁻²⁷ kg) = 4.32 × 10⁻¹² J."}, {"n": 38, "section": "CH 6 · MAGNETISM", "q": "Why can standard classical cyclotrons with fixed RF frequency not accelerate electrons to ultra-high relativistic speeds?", "opts": ["Electrons carry positive charge that repels Dee accelerating electrodes", "Relativistic mass increase causes electrons to lose phase synchronization with fixed RF accelerating voltage", "Magnetic fields exert zero magnetic force on light charged particles", "High-voltage electric fields cause immediate dielectric vacuum breakdown"], "ans": "B", "exp": "As electron speed approaches speed of light c, relativistic effects cause mass to increase significantly (m = gamma m0). This lowers cyclotron frequency (f = qB / 2pi m), causing electrons to fall out of step with fixed RF accelerating voltage."}, {"n": 39, "section": "CH 6 · MAGNETISM", "q": "A rectangular coil of 100 turns and dimensions 10 cm × 5 cm carries a current of 2.0 A in a uniform magnetic field of 0.40 T. Calculate maximum torque experienced by the coil.", "opts": ["4 × 10⁻³ N·m", "0.8 N·m", "0.4 N·m", "0.2 N·m"], "ans": "C", "exp": "Maximum torque occurs when plane of coil is parallel to B field (θ = 90°). Formula τ = N × I × A × B = 100 × 2.0 A × (0.10 m × 0.05 m) × 0.40 T = 0.4 N·m."}, {"n": 40, "section": "CH 6 · MAGNETISM", "q": "A circular coil of 50 turns and radius 8.0 cm carries a current of 3.0 A. Calculate the magnetic dipole moment of the coil.", "opts": ["0.06 A·m²", "37.7 A·m²", "1.51 A·m²", "3.02 A·m²"], "ans": "D", "exp": "Magnetic dipole moment μ = N × I × A. Coil area A = π × r² = π × (0.08 m)² = 0.02011 m². Thus μ = 50 × 3.0 A × 0.02011 m² = 3.02 A·m²."}, {"n": 41, "section": "CH 6 · MAGNETISM", "q": "A magnetic dipole with magnetic moment 0.50 A·m² is oriented at an angle of 180° (anti-parallel) to a uniform magnetic field of 0.60 T. Calculate potential energy of the dipole.", "opts": ["0.3 J", "-0.3 J", "0 J", "0.6 J"], "ans": "A", "exp": "Potential energy of a magnetic dipole U = -μ · B = -μ B cos(θ). For θ = 180°, cos 180° = -1, giving U = -(0.50) × (0.60) × (-1) = +0.3 J (unstable equilibrium)."}, {"n": 42, "section": "CH 6 · MAGNETISM", "q": "Why are the magnetic pole pieces in a moving coil galvanometer shaped with concave cylindrical pole faces?", "opts": ["To shield internal copper windings from external electrostatic interference", "To produce a radial magnetic field so restoring torque scale remains strictly linear", "To minimize electrical coil resistance during high-voltage operations", "To reduce mechanical inertia of rotating armature coil"], "ans": "B", "exp": "Concave pole pieces with a soft iron core create a radial magnetic field where field lines are always parallel to plane of coil regardless of rotation angle (θ = 90°), making torque τ = NIAB constant and scale linear."}, {"n": 43, "section": "CH 6 · MAGNETISM", "q": "What key function does the split-ring commutator perform in a direct current (DC) electric motor?", "opts": ["Converts mechanical rotational power into high-voltage alternating current", "Varies internal field coil resistance to prevent motor overspeeding", "Reverses direction of current in armature coil every half rotation to maintain continuous unidirectional torque", "Suppresses high-voltage spark discharges across carbon brush contacts"], "ans": "C", "exp": "As armature coil rotates past vertical plane, split-ring commutator switches brush contacts, reversing current direction in coil sides every 180° so magnetic torque continues driving rotation in same direction."}, {"n": 44, "section": "CH 6 · MAGNETISM", "q": "At a geographical location, Earth's total magnetic field is 5 × 10⁻⁵ T and angle of dip (inclination) is 60°. Calculate horizontal component B_H of Earth's field.", "opts": ["4.33 × 10⁻⁵ T", "5 × 10⁻⁵ T", "1.25 × 10⁻⁵ T", "2.5 × 10⁻⁵ T"], "ans": "D", "exp": "Horizontal component of Earth's magnetic field B_H = B_total × cos(dip angle). Substituting values: B_H = (5 × 10⁻⁵ T) × cos(60°) = 5.0×10⁻⁵ × 0.5 = 2.5 × 10⁻⁵ T."}, {"n": 45, "section": "CH 6 · MAGNETISM", "q": "At a location, Earth's magnetic field horizontal component is 3 × 10⁻⁵ T and vertical component is 4 × 10⁻⁵ T. Calculate total magnetic field B and angle of dip.", "opts": ["B = 5 × 10⁻⁵ T, dip = 53.1°", "B = 7 × 10⁻⁵ T, dip = 36.9°", "B = 5 × 10⁻⁵ T, dip = 36.9°", "B = 1 × 10⁻⁵ T, dip = 45.0°"], "ans": "A", "exp": "Total field B = sqrt(B_H² + B_V²) = sqrt((3.0×10⁻⁵)² + (4.0×10⁻⁵)²) = 5 × 10⁻⁵ T. Angle of dip tan(dip) = B_V / B_H = 4.0 / 3.0 = 1.333, giving dip = 53.1°."}, {"n": 46, "section": "CH 6 · MAGNETISM", "q": "What is the difference between magnetic declination and magnetic inclination (dip)?", "opts": ["Declination is angle of field relative to vertical; inclination is angle relative to geographic equator", "Declination is horizontal angle between geographic North and magnetic North; inclination is vertical angle field makes with horizontal", "Declination describes field magnitude variations; inclination describes solar wind disturbances", "Declination applies only at magnetic poles; inclination applies only at magnetic equator"], "ans": "B", "exp": "Magnetic declination is horizontal angle between geographic true north and magnetic compass north. Magnetic inclination (dip) is vertical angle between local Earth magnetic field vector and horizontal ground plane."}, {"n": 47, "section": "CH 6 · MAGNETISM", "q": "A bar magnet is placed horizontally in Earth's magnetic field with its North pole pointing toward geographic North. Where are neutral points (where net magnetic field is zero) located?", "opts": ["On the axial line (end-on position) of the bar magnet", "At the exact physical center of the bar magnet", "On the broadside-on position (equatorial line) of the bar magnet", "At both North and South pole tips of the bar magnet"], "ans": "C", "exp": "When magnet North points geographic North, magnet's equatorial field points South, opposing Earth's northward horizontal field B_H. Neutral points occur on equatorial line where magnet field cancels Earth field."}, {"n": 48, "section": "CH 6 · MAGNETISM", "q": "Which category of magnetic materials possesses small negative magnetic susceptibility and is weakly repelled by strong magnetic field poles?", "opts": ["Paramagnetic materials", "Ferromagnetic materials", "Ferrimagnetic materials", "Diamagnetic materials"], "ans": "D", "exp": "Diamagnetic materials have negative magnetic susceptibility (chi &lt; 0) independent of temperature. When placed in an external magnetic field, they develop weak induced magnetization in opposite direction and are repelled."}, {"n": 49, "section": "CH 6 · MAGNETISM", "q": "Two electrons move parallel to each other at speed 2 × 10⁶ m/s separated by distance 1 × 10⁻³ m. Calculate magnetic attraction force between them.", "opts": ["1.03 × 10⁻²⁶ N", "2.05 × 10⁻²⁶ N", "1.03 × 10⁻²³ N", "5.13 × 10⁻²⁷ N"], "ans": "A", "exp": "Magnetic force between parallel moving charges F = (μ₀ / 4pi) × (q1 q2 v1 v2 / r²). Substituting values: F = (10⁻⁷) × (1.6 × 10⁻¹⁹ C² × (2 × 10⁶ m/s)²) / (1 × 10⁻³ m)² = 1.03 × 10⁻²⁶ N."}, {"n": 50, "section": "CH 6 · MAGNETISM", "q": "A flat circular coil of radius 0.10 m is placed in a uniform magnetic field of 0.50 T. The plane of coil makes an angle of 30° with magnetic field lines. Calculate magnetic flux through coil.", "opts": ["0.014 Wb", "7.85 × 10⁻³ Wb", "0.016 Wb", "3.93 × 10⁻³ Wb"], "ans": "B", "exp": "Angle between field and coil normal vector θ = 90° - 30° = 60°. Magnetic flux Phi = B × A × cos(θ) = 0.50 T × (π × 0.10²) × cos(60°) = 0.50 × 0.03142 × 0.5 = 7.85 × 10⁻³ Wb."}]},
 p7:{title:"Sources of Magnetic Fields",desc:"Biot-Savart, solenoids, toroids, Ampere's law, parallel wires",color:"#14B8A6",icon:"&#127744;",data:[{"n": 51, "section": "CH 7 · SOURCES OF MAGNETIC FIELDS", "q": "According to the Biot-Savart law, how does the magnitude of magnetic field dB created by a current element I dL vary with distance r to the field point?", "opts": ["Inversely proportional to distance (1/r)", "Directly proportional to distance (r)", "Inversely proportional to the square of the distance (1/r²)", "Independent of distance r"], "ans": "C", "exp": "The Biot-Savart law states dB = (μ₀ / 4pi) × (I dL sin(θ) / r²). The magnetic field magnitude is inversely proportional to the square of the distance from current element to measurement point."}, {"n": 52, "section": "CH 7 · SOURCES OF MAGNETIC FIELDS", "q": "A circular coil of 20 turns and radius 5.0 cm carries a current of 3.0 A. Calculate magnetic field strength B at center of the coil.", "opts": ["3.77 × 10⁻⁴ T", "2.37 × 10⁻³ T", "1.51 × 10⁻³ T", "7.54 × 10⁻⁴ T"], "ans": "D", "exp": "Magnetic field at center of N-turn circular loop B = (μ₀ × N × I) / (2 R). Substituting values: B = (4pi×10⁻⁷ × 20 × 3.0) / (2 × 0.05) = 7.5398×10⁻⁴ / 0.10 = 7.54 × 10⁻⁴ T."}, {"n": 53, "section": "CH 7 · SOURCES OF MAGNETIC FIELDS", "q": "A single circular loop of radius 0.10 m carries a current of 5.0 A. Calculate magnetic field magnitude at center of the loop.", "opts": ["3.14 × 10⁻⁵ T", "6.28 × 10⁻⁵ T", "1 × 10⁻⁵ T", "3.14 × 10⁻⁴ T"], "ans": "A", "exp": "For a single circular turn (N = 1), B = (μ₀ × I) / (2 R). Substituting values: B = (4pi×10⁻⁷ × 5.0) / (2 × 0.10) = 3.14 × 10⁻⁵ T."}, {"n": 54, "section": "CH 7 · SOURCES OF MAGNETIC FIELDS", "q": "A long straight power transmission line carries a direct current of 100.0 A. Calculate magnetic field B produced at distance r = 2.0 m from the wire.", "opts": ["3.14 × 10⁻⁵ T", "1 × 10⁻⁵ T", "2 × 10⁻⁵ T", "5 × 10⁻⁶ T"], "ans": "B", "exp": "Magnetic field near a long straight current wire B = (μ₀ × I) / (2 π r). Substituting values: B = (4pi×10⁻⁷ × 100.0) / (2 π × 2.0) = 2×10⁻⁷ × 100 / 2.0 = 1 × 10⁻⁵ T."}, {"n": 55, "section": "CH 7 · SOURCES OF MAGNETIC FIELDS", "q": "At distance 0.04 m from a long straight wire, magnetic field is 5 × 10⁻⁴ T. What is magnetic field magnitude at distance 0.10 m from the wire?", "opts": ["1.25 × 10⁻³ T", "8 × 10⁻⁵ T", "2 × 10⁻⁴ T", "3.16 × 10⁻⁴ T"], "ans": "C", "exp": "For a long straight wire, magnetic field varies inversely with distance (B2 / B1 = r1 / r2). Rearranging: B2 = B1 × (r1 / r2) = 5 × 10⁻⁴ T × (0.04 / 0.10) = 2 × 10⁻⁴ T."}, {"n": 56, "section": "CH 7 · SOURCES OF MAGNETIC FIELDS", "q": "A circular loop of radius R = 0.10 m carries current I = 4.0 A. Find magnetic field strength on loop axis at distance z = 0.10 m from center.", "opts": ["2.51 × 10⁻⁵ T", "1.78 × 10⁻⁵ T", "4.44 × 10⁻⁶ T", "8.89 × 10⁻⁶ T"], "ans": "D", "exp": "Magnetic field on axis of circular loop B = (μ₀ I R²) / [2 (R² + z²)^(3/2)]. Substituting values: B = (4pi×10⁻⁷ × 4.0 × 0.10²) / [2 × (0.10² + 0.10²)^(1.5)] = 5.0265×10⁻⁸ / 0.0056569 = 8.89 × 10⁻⁶ T."}, {"n": 57, "section": "CH 7 · SOURCES OF MAGNETIC FIELDS", "q": "At large axial distances z &gt;&gt; R away from a circular current loop of magnetic dipole moment μ, how does axial magnetic field magnitude B scale with distance z?", "opts": ["Decreases inversely as the cube of distance (1/z³)", "Decreases inversely as square of distance (1/z²)", "Decreases linearly with distance (1/z)", "Remains constant regardless of distance z"], "ans": "A", "exp": "For z &gt;&gt; R, axial magnetic field formula simplifies to B = (μ₀ μ) / (2 π z³). The magnetic field of a current loop at large distance behaves as a magnetic dipole, decaying as 1/z³."}, {"n": 58, "section": "CH 7 · SOURCES OF MAGNETIC FIELDS", "q": "A long air-core solenoid of length 0.50 m contains 1000 tightly wound turns and carries current 2.5 A. Calculate magnetic field inside solenoid near center.", "opts": ["3.14 × 10⁻³ T", "6.28 × 10⁻³ T", "0.013 T", "6.28 × 10⁻⁶ T"], "ans": "B", "exp": "Turn density n = N / L = 1000 / 0.50 = 2000 turns/m. Magnetic field inside solenoid B = μ₀ × n × I = 4pi×10⁻⁷ × 2000 × 2.5 = 6.28 × 10⁻³ T."}, {"n": 59, "section": "CH 7 · SOURCES OF MAGNETIC FIELDS", "q": "For the solenoid in Question 58 (n = 2000 turns/m, I = 2.5 A), what is magnetic field strength at one of its open ends along the axial line?", "opts": ["6.28 × 10⁻³ T", "1.57 × 10⁻³ T", "3.14 × 10⁻³ T", "0.013 T"], "ans": "C", "exp": "At open end of a long solenoid, magnetic field magnitude is exactly half of central interior field: B_end = 0.5 × B_center = 0.5 × 6.28 × 10⁻³ T = 3.14 × 10⁻³ T."}, {"n": 60, "section": "CH 7 · SOURCES OF MAGNETIC FIELDS", "q": "A solenoid with 1500 turns/m carries current 2.0 A and is filled with an iron core of relative permeability μᵣ = 600. Calculate magnetic field B inside the core.", "opts": ["3.77 × 10⁻³ T", "1.13 T", "4.52 T", "2.26 T"], "ans": "D", "exp": "Magnetic field with magnetic core B = μᵣ × μ₀ × n × I = 600 × (4pi×10⁻⁷ × 1500 × 2.0) = 600 × 3.7699×10⁻³ = 2.26 T."}, {"n": 61, "section": "CH 7 · SOURCES OF MAGNETIC FIELDS", "q": "A toroid has mean radius r = 0.20 m and 800 turns. Calculate magnetic field inside central core when current I = 3.0 A flows through winding.", "opts": ["2.4 × 10⁻³ T", "4.8 × 10⁻³ T", "1.2 × 10⁻³ T", "7.54 × 10⁻³ T"], "ans": "A", "exp": "Magnetic field inside core of toroid B = (μ₀ × N × I) / (2 π r). Substituting values: B = (4pi×10⁻⁷ × 800 × 3.0) / (2 π × 0.20) = 2×10⁻⁷ × 2400 / 0.20 = 2.4 × 10⁻³ T."}, {"n": 62, "section": "CH 7 · SOURCES OF MAGNETIC FIELDS", "q": "What is the magnitude of magnetic field in central empty region (r &lt; r_inner) and outside outer radius (r &gt; r_outer) of an ideal toroidal solenoid?", "opts": ["Uniform throughout central space and zero outside", "Zero in both central empty space and exterior surrounding space", "Maximum in central empty space and zero inside core", "Decreases inversely with square of distance outside toroid"], "ans": "B", "exp": "Applying Ampere's law to circular loops in region r &lt; r_inner or r &gt; r_outer yields net enclosed current I_enc = 0. Therefore magnetic field is strictly zero outside toroid core."}, {"n": 63, "section": "CH 7 · SOURCES OF MAGNETIC FIELDS", "q": "Two long straight parallel conductors separated by 0.10 m carry currents I1 = 5.0 A and I2 = 10.0 A in same direction. Calculate magnetic force per unit length.", "opts": ["1 × 10⁻⁴ N/m (repulsive)", "3.14 × 10⁻⁴ N/m (attractive)", "1 × 10⁻⁴ N/m (attractive)", "5 × 10⁻⁵ N/m (attractive)"], "ans": "C", "exp": "Force per unit length F/L = (μ₀ I1 I2) / (2 π d) = (4pi×10⁻⁷ × 5.0 × 10.0) / (2 π × 0.10) = 2×10⁻⁷ × 50 / 0.10 = 1 × 10⁻⁴ N/m. Currents in same direction attract."}, {"n": 64, "section": "CH 7 · SOURCES OF MAGNETIC FIELDS", "q": "When two long parallel conductors carry electric currents in opposite directions, what is nature of mutual force between them?", "opts": ["Attractive force pulling conductors together", "Zero net force between conductors", "Rotational torque twisting conductors around each other", "Repulsive force pushing conductors apart"], "ans": "D", "exp": "Parallel currents flowing in opposite directions create magnetic field vectors that result in mutually repulsive forces pushing conductors apart (by right-hand force rule F = I L × B)."}, {"n": 65, "section": "CH 7 · SOURCES OF MAGNETIC FIELDS", "q": "The standard SI unit of electric current (Ampere) is defined based on magnetic force between parallel conductors. What force per meter exists between two long wires 1 m apart carrying 1 A each?", "opts": ["2 × 10⁻⁷ N/m", "1 × 10⁻⁷ N/m", "4π × 10⁻⁷ N/m", "1.602 × 10⁻¹⁹ N/m"], "ans": "A", "exp": "Substituting I1 = 1 A, I2 = 1 A, d = 1 m into force formula F/L = (μ₀ I1 I2) / (2 π d) = (4pi×10⁻⁷ × 1 × 1) / (2 π × 1) gives exactly 2 × 10⁻⁷ N/m."}, {"n": 66, "section": "CH 7 · SOURCES OF MAGNETIC FIELDS", "q": "In Ampere's circuital law ∮ B · ds = μ₀ I_enc, what does symbol I_enc represent?", "opts": ["Total current flowing in entire power distribution circuit", "Net electric current passing through surface bounded by closed integration path (Amperean loop)", "Electric current flowing parallel to integration displacement vector", "Displacement current density inside dielectric capacitor"], "ans": "B", "exp": "I_enc represents net algebraic sum of electric currents passing through any open surface enclosed by chosen closed Amperean loop path."}, {"n": 67, "section": "CH 7 · SOURCES OF MAGNETIC FIELDS", "q": "A long solid cylindrical wire of radius R = 0.02 m carries current 10.0 A uniformly distributed across cross-section. Find magnetic field at distance r = 0.01 m from axis.", "opts": ["1 × 10⁻⁴ T", "2.5 × 10⁻⁵ T", "5 × 10⁻⁵ T", "2 × 10⁻⁴ T"], "ans": "C", "exp": "Inside solid wire (r &lt; R), enclosed current I_enc = I × (r² / R²). Ampere's law gives B = (μ₀ I r) / (2 π R²). Substituting values: B = (4pi×10⁻⁷ × 10 × 0.01) / (2 π × 0.0004) = 5 × 10⁻⁵ T."}, {"n": 68, "section": "CH 7 · SOURCES OF MAGNETIC FIELDS", "q": "Two long parallel wires separated by 0.20 m carry equal currents of 6.0 A in OPPOSITE directions. Find total magnetic field B midway between wires.", "opts": ["0 T", "1.2 × 10⁻⁵ T", "4.8 × 10⁻⁵ T", "2.4 × 10⁻⁵ T"], "ans": "D", "exp": "Midway between wires (r = 0.10 m), fields from opposite currents point in SAME direction. B_total = B1 + B2 = 2 × [(μ₀ I) / (2 π r)] = 2 × [2×10⁻⁷ × 6.0 / 0.10] = 2.4 × 10⁻⁵ T."}, {"n": 69, "section": "CH 7 · SOURCES OF MAGNETIC FIELDS", "q": "Two long parallel wires separated by 0.20 m carry equal currents of 6.0 A in the SAME direction. Calculate total magnetic field B midway between wires.", "opts": ["0 T", "2.4 × 10⁻⁵ T", "1.2 × 10⁻⁵ T", "4.8 × 10⁻⁵ T"], "ans": "A", "exp": "Midway between wires carrying parallel currents in same direction, field vectors produced by each wire have equal magnitude but opposite directions, canceling to yield B_total = 0 T."}, {"n": 70, "section": "CH 7 · SOURCES OF MAGNETIC FIELDS", "q": "How do Biot-Savart law and Ampere's circuital law compare in magnetostatics?", "opts": ["Ampere's law applies only to static charges while Biot-Savart applies to moving charges", "Both are fundamental laws of magnetostatics; Ampere's law is simpler for high symmetry while Biot-Savart applies to any current geometry", "Biot-Savart law is restricted to symmetrical solenoids while Ampere's law applies to arbitrary arcs", "Ampere's law requires magnetic monopoles while Biot-Savart law requires electric dipoles"], "ans": "B", "exp": "Both laws relate currents to magnetic fields. Ampere's law offers quick calculation when symmetry permits evaluating line integral, whereas Biot-Savart law provides general differential formulation for arbitrary geometry."}, {"n": 71, "section": "CH 7 · SOURCES OF MAGNETIC FIELDS", "q": "A wire bent into a circular arc of radius R = 0.05 m subtends an angle of 60° at center. Calculate magnetic field B at center when current I = 3.0 A flows.", "opts": ["3.77 × 10⁻⁵ T", "1.88 × 10⁻⁵ T", "6.28 × 10⁻⁶ T", "3.14 × 10⁻⁶ T"], "ans": "C", "exp": "Biot-Savart law for arc B = (μ₀ I / 4 π R) × θ. Angle θ = 60° = π/3 rad = 1.0472 rad. Substituting values: B = (4pi×10⁻⁷ × 3.0 / 4 π × 0.05) × 1.0472 = 6×10⁻⁶ × 1.0472 = 6.28 × 10⁻⁶ T."}, {"n": 72, "section": "CH 7 · SOURCES OF MAGNETIC FIELDS", "q": "Why is magnetic field inside a long tightly wound solenoid nearly uniform and parallel to solenoid axis?", "opts": ["Solenoid wire absorbs radial magnetic field lines preventing leakage", "Electric current flows exclusively along axial length of cylinder", "Earth's magnetic field cancels external solenoid field lines", "Transverse field components from adjacent turns cancel while axial components reinforce constructively inside"], "ans": "D", "exp": "In a tightly wound solenoid, transverse magnetic field components produced by neighboring circular current turns oppose and cancel each other, leaving only a net uniform longitudinal field along axis inside."}, {"n": 73, "section": "CH 7 · SOURCES OF MAGNETIC FIELDS", "q": "Why did James Clerk Maxwell modify Ampere's circuital law by adding the displacement current term (ε₀ dPhi_E / dt)?", "opts": ["To make Ampere's law consistent with conservation of electric charge in time-varying electric fields", "To account for electrical resistance in dielectric insulator materials", "To calculate static magnetic forces between moving atomic nucleus charges", "To eliminate need for Biot-Savart law in magnetostatics"], "ans": "A", "exp": "Original Ampere's law failed for non-steady currents (such as charging capacitor). Maxwell added displacement current term I_d = ε₀ (dPhi_E/dt) so ∮ B·ds = μ₀ (I + I_d), ensuring charge conservation."}, {"n": 74, "section": "CH 7 · SOURCES OF MAGNETIC FIELDS", "q": "A single square loop of wire of side length a = 0.20 m carries current I = 5.0 A. Calculate magnetic field B at exact geometrical center of square.", "opts": ["1 × 10⁻⁵ T", "2.83 × 10⁻⁵ T", "5.66 × 10⁻⁵ T", "2 × 10⁻⁵ T"], "ans": "B", "exp": "Formula for magnetic field at center of square loop B = (2 sqrt(2) μ₀ I) / (π a). Substituting values: B = (2 × 1.4142 × 4pi×10⁻⁷ × 5.0) / (π × 0.20) = 2.83 × 10⁻⁵ T."}, {"n": 75, "section": "CH 7 · SOURCES OF MAGNETIC FIELDS", "q": "What is the structural arrangement and purpose of a standard pair of Helmholtz coils?", "opts": ["Two perpendicular circular coils generating a high-frequency rotating magnetic field", "Two concentric coils of different radii carrying opposite currents to cancel external fields", "Two identical coaxial circular coils separated by distance equal to coil radius, producing uniform field between them", "A toroidal coil wound inside a long solenoid to store inductive magnetic energy"], "ans": "C", "exp": "Helmholtz coils consist of two thin circular coaxial coils of radius R separated by distance R carrying equal currents. Second derivative of field d²B/dz² vanishes at midpoint, producing highly uniform field."}]},
 p8:{title:"Electromagnetic Induction",desc:"Faraday, Lenz, motional EMF, generators, transformers",color:"#F97316",icon:"&#128260;",data:[{"n": 76, "section": "CH 8 · ELECTROMAGNETIC INDUCTION", "q": "A square coil of side 0.20 m is placed in a uniform magnetic field of 0.40 T. The plane of coil is at 30° to field lines. Calculate magnetic flux through coil.", "opts": ["0.014 Wb", "0.016 Wb", "4 × 10⁻³ Wb", "8 × 10⁻³ Wb"], "ans": "D", "exp": "Area A = 0.20² = 0.04 m². Normal angle θ = 90° - 30° = 60°. Magnetic flux Phi = B × A × cos(θ) = 0.40 T × 0.04 m² × cos(60°) = 0.40 × 0.04 × 0.5 = 8 × 10⁻³ Wb."}, {"n": 77, "section": "CH 8 · ELECTROMAGNETIC INDUCTION", "q": "A coil of 200 turns and area 0.05 m² is perpendicular to a 0.80 T magnetic field. The field is reduced to zero uniformly in 0.02 s. Calculate average induced EMF.", "opts": ["400 V", "2 V", "200 V", "800 V"], "ans": "A", "exp": "Faraday's law gives induced EMF magnitude E = N × (delta Phi / delta t) = N × (B × A) / delta t = 200 × (0.80 × 0.05) / 0.02 = 200 × 0.04 / 0.02 = 400 V."}, {"n": 78, "section": "CH 8 · ELECTROMAGNETIC INDUCTION", "q": "A flexible 1-turn circular loop of initial area 0.10 m² in field B = 0.50 T is pulled flat (area reduced to zero) in 0.05 s. Find average induced EMF.", "opts": ["0.1 V", "1 V", "2.5 V", "0.5 V"], "ans": "B", "exp": "Average induced EMF E = B × (delta A / delta t) = 0.50 T × (0.10 m² / 0.05 s) = 0.50 × 2.0 = 1 V."}, {"n": 79, "section": "CH 8 · ELECTROMAGNETIC INDUCTION", "q": "A coil of 100 turns and area 0.02 m² perpendicular to field B = 0.30 T is rotated through 180° in 0.10 s. Calculate magnitude of average induced EMF.", "opts": ["6 V", "60 V", "12 V", "1.2 V"], "ans": "C", "exp": "Rotating coil 180° changes flux from +B A to -B A, so delta Phi = 2 B A = 2 × 0.30 × 0.02 = 0.012 Wb. Induced EMF E = N × (delta Phi / delta t) = 100 × 0.012 / 0.10 = 12 V."}, {"n": 80, "section": "CH 8 · ELECTROMAGNETIC INDUCTION", "q": "Lenz's law states that the direction of induced current opposes the flux change producing it. This law is a direct manifestation of which fundamental physics law?", "opts": ["Law of conservation of linear momentum", "Law of conservation of electric charge", "Gauss's law for electrostatics", "Law of conservation of energy"], "ans": "D", "exp": "Lenz's law ensures conservation of energy. Mechanical work must be expended against opposing magnetic forces to generate electrical energy; otherwise energy would be created from nothing."}, {"n": 81, "section": "CH 8 · ELECTROMAGNETIC INDUCTION", "q": "A bar magnet with its North pole pointing downward is dropped vertically through a horizontal conducting ring. Viewed from above as magnet approaches ring, what is direction of induced current?", "opts": ["Counter-clockwise direction", "Clockwise direction", "Zero induced current", "Alternating rapidly back and forth"], "ans": "A", "exp": "As downward North pole approaches ring, downward flux increases. By Lenz's law, ring induces upward magnetic field (North pole facing up) to oppose approach, which corresponds to counter-clockwise current viewed from above."}, {"n": 82, "section": "CH 8 · ELECTROMAGNETIC INDUCTION", "q": "As the bar magnet in Question 81 exits below the ring (South pole leaving ring downward), what is direction of induced current viewed from above?", "opts": ["Counter-clockwise direction", "Clockwise direction", "Zero induced current", "Radially inward current"], "ans": "B", "exp": "As South pole leaves downward, downward magnetic flux decreases. By Lenz's law, induced field points downward (North pole at bottom / South pole at top) to attract magnet, creating clockwise current viewed from above."}, {"n": 83, "section": "CH 8 · ELECTROMAGNETIC INDUCTION", "q": "A conducting rod of length L = 0.40 m moves at speed v = 5.0 m/s perpendicular to a uniform magnetic field B = 0.50 T. Calculate motional EMF induced across the rod.", "opts": ["0.2 V", "2 V", "1 V", "0.1 V"], "ans": "C", "exp": "Motional EMF induced across a moving conductor rod E = B × L × v. Substituting values: E = 0.50 T × 0.40 m × 5.0 m/s = 1 V."}, {"n": 84, "section": "CH 8 · ELECTROMAGNETIC INDUCTION", "q": "The rod in Question 83 (L = 0.40 m, v = 5.0 m/s, B = 0.50 T, EMF = 1.0 V) slides on zero-resistance rails connected to resistor R = 2.0 Ω. Calculate required mechanical input power.", "opts": ["1 W", "0.25 W", "2 W", "0.5 W"], "ans": "D", "exp": "Induced current I = E / R = 1.0 V / 2.0 Ω = 0.50 A. Magnetic force F = B I L = 0.50 × 0.50 × 0.40 = 0.10 N. Mechanical power P = F × v = 0.10 N × 5.0 m/s = 0.5 W (equals electrical power I² R)."}, {"n": 85, "section": "CH 8 · ELECTROMAGNETIC INDUCTION", "q": "A uniform magnetic field fills a cylindrical region of radius R = 0.10 m and increases at rate dB/dt = 2.0 T/s. Calculate induced electric field E at distance r = 0.05 m from axis (r &lt; R).", "opts": ["0.05 V/m", "0.1 V/m", "0.025 V/m", "0.2 V/m"], "ans": "A", "exp": "From Faraday's law ∮ E·ds = E (2 π r) = (dB/dt) (π r²). Inside region (r &lt; R), induced electric field E = 0.5 × r × (dB/dt) = 0.5 × 0.05 m × 2.0 T/s = 0.05 V/m."}, {"n": 86, "section": "CH 8 · ELECTROMAGNETIC INDUCTION", "q": "For the cylindrical field region in Question 85 (R = 0.10 m, dB/dt = 2.0 T/s), calculate induced electric field E at distance r = 0.20 m outside axis (r &gt; R).", "opts": ["0.2 V/m", "0.05 V/m", "0.1 V/m", "0.01 V/m"], "ans": "B", "exp": "Outside region (r &gt; R), total enclosed flux rate is (dB/dt) (π R²). Line integral E (2 π r) = (dB/dt) (π R²), giving E = 0.5 × (R² / r) × (dB/dt) = 0.5 × (0.10² / 0.20) × 2.0 = 0.05 V/m."}, {"n": 87, "section": "CH 8 · ELECTROMAGNETIC INDUCTION", "q": "How does an electric field induced by a time-varying magnetic field differ fundamentally from an electrostatic field produced by electric charges?", "opts": ["The induced electric field exerts forces exclusively on neutral uncharged particles", "The induced electric field stores zero energy density in free space", "The induced electric field is non-conservative with non-zero line integral along closed path (∮ E · ds ≠ 0)", "The induced electric field vectors point radially away from magnetic field centers"], "ans": "C", "exp": "Electrostatic fields are conservative (∮ E·ds = 0) and possess scalar potential. Induced electric fields created by changing magnetic flux (Faraday's law) are non-conservative with non-zero closed line integral."}, {"n": 88, "section": "CH 8 · ELECTROMAGNETIC INDUCTION", "q": "An AC generator coil of 50 turns and area 0.04 m² rotates at angular speed ω = 100 rad/s in field B = 0.50 T. Calculate peak output EMF E0.", "opts": ["50 V", "200 V", "10 V", "100 V"], "ans": "D", "exp": "Peak EMF generated by rotating armature E0 = N × B × A × ω. Substituting values: E0 = 50 × 0.50 T × 0.04 m² × 100 rad/s = 100 V."}, {"n": 89, "section": "CH 8 · ELECTROMAGNETIC INDUCTION", "q": "An AC generator has coil N = 100, A = 0.02 m², B = 0.20 T, rotating at frequency f = 50 Hz. Calculate RMS output voltage V_rms.", "opts": ["88.9 V", "126 V", "62.8 V", "178 V"], "ans": "A", "exp": "Angular speed ω = 2 π f = 2 π × 50 = 314.16 rad/s. Peak EMF E0 = N B A ω = 100 × 0.20 × 0.02 × 314.16 = 126 V. RMS voltage V_rms = E0 / sqrt(2) = 88.9 V."}, {"n": 90, "section": "CH 8 · ELECTROMAGNETIC INDUCTION", "q": "What mechanical operational parameter directly determines the AC voltage frequency produced by an alternator (AC generator)?", "opts": ["The total number of turns in armature coil winding", "The rotational speed (frequency) of armature coil in magnetic field", "The electrical resistance of connected external circuit load", "The magnetic permeability of soft iron armature core"], "ans": "B", "exp": "The frequency of generated alternating current f is directly proportional to rotational frequency of armature coil (ω = 2 π f). Increasing rotation speed increases frequency and peak voltage proportionally."}, {"n": 91, "section": "CH 8 · ELECTROMAGNETIC INDUCTION", "q": "A transformer has primary turns N_p = 1000 and secondary turns N_s = 200. Primary voltage is 240 V AC. Calculate secondary output voltage V_s.", "opts": ["1.2 × 10³ V", "24 V", "48 V", "96 V"], "ans": "C", "exp": "Ideal transformer voltage ratio V_s / V_p = N_s / N_p. Rearranging: V_s = V_p × (N_s / N_p) = 240 V × (200 / 1000) = 240 × 0.20 = 48 V."}, {"n": 92, "section": "CH 8 · ELECTROMAGNETIC INDUCTION", "q": "An ideal step-down transformer reduces voltage from 240 V to 12.0 V. If secondary output current is 5.0 A, calculate primary input current I_p.", "opts": ["100 A", "1 A", "0.5 A", "0.25 A"], "ans": "D", "exp": "For an ideal transformer (100% efficiency), input power equals output power (V_p I_p = V_s I_s). Solving for primary current: I_p = I_s × (V_s / V_p) = 5.0 A × (12.0 / 240) = 0.25 A."}, {"n": 93, "section": "CH 8 · ELECTROMAGNETIC INDUCTION", "q": "A transformer draws 100 W from primary mains while delivering 85 W to secondary electrical load. Calculate efficiency of the transformer.", "opts": ["85.0%", "117.6%", "15.0%", "90.0%"], "ans": "A", "exp": "Transformer efficiency eta = (P_out / P_in) × 100% = (85 W / 100 W) × 100% = 85.0%."}, {"n": 94, "section": "CH 8 · ELECTROMAGNETIC INDUCTION", "q": "Why is the iron core of a power transformer constructed from thin laminated steel sheets insulated from each other rather than a solid block of iron?", "opts": ["To increase mechanical stability and reduce transformer weight", "To minimize energy losses caused by induced eddy currents within core", "To eliminate magnetic flux leakage between primary and secondary windings", "To increase electrical conductivity of core material"], "ans": "B", "exp": "Laminating core into thin insulated sheets breaks up continuous electrical conduction paths, significantly increasing electrical resistance to eddy currents and reducing I² R Joule heating losses."}, {"n": 95, "section": "CH 8 · ELECTROMAGNETIC INDUCTION", "q": "What physical mechanism causes hysteresis loss in a transformer iron core?", "opts": ["Electrical resistance heating in primary copper coil wire windings", "High-voltage sparking across secondary terminal air gap", "Energy dissipated as heat during repeated cycle magnetization and demagnetization of core domain magnetic dipoles", "Acoustic noise vibrations generated by transformer casing"], "ans": "C", "exp": "As alternating current reverses direction, magnetic domain dipoles in core must continuously reorient. Internal friction between domain boundaries dissipates energy as hysteresis heat during each AC cycle."}, {"n": 96, "section": "CH 8 · ELECTROMAGNETIC INDUCTION", "q": "What are eddy currents in electromagnetic systems?", "opts": ["High-frequency surface currents flowing exclusively along thin conductor outer boundaries", "Direct currents produced by series connected electrochemical batteries", "Static electric charge accumulations on insulating dielectric surfaces", "Loops of electrical current induced within bulk conductor materials when subjected to changing magnetic fields"], "ans": "D", "exp": "When a solid conductor experiences changing magnetic flux, Faraday induction creates circulating closed current loops (eddy currents) inside bulk metal by induced electric fields."}, {"n": 97, "section": "CH 8 · ELECTROMAGNETIC INDUCTION", "q": "How are eddy currents utilized in magnetic braking systems of high-speed trains?", "opts": ["Moving metal wheel discs enter strong magnetic fields, creating opposing Lorentz forces that decelerate train smoothly", "Pressing metal brake pads mechanically against train wheels to generate friction", "Directing high-pressure air currents against spinning train axles", "Attracting train wheels electrostatically to steel railway tracks"], "ans": "A", "exp": "When metallic disc attached to axle rotates through electromagnet field, induced eddy currents interact with B field (F = I L × B) producing strong opposing drag torque that brakes train without mechanical wear."}, {"n": 98, "section": "CH 8 · ELECTROMAGNETIC INDUCTION", "q": "Why does an induction cooktop heat a ferromagnetic cooking pot rapidly while keeping the glass ceramic top relatively cool?", "opts": ["An electric heating coil beneath ceramic top transfers heat by direct thermal conduction", "High-frequency AC magnetic field induces strong eddy currents and hysteresis heating directly inside metal pot base", "Infrared radiation emitted from ceramic surface heats bottom of pot", "Microwave radiation excites water molecules contained inside food item"], "ans": "B", "exp": "An induction coil beneath glass top produces high-frequency alternating magnetic field. Field passes through glass top and induces intense eddy currents and hysteresis heat directly inside pot's ferromagnetic base."}, {"n": 99, "section": "CH 8 · ELECTROMAGNETIC INDUCTION", "q": "Two coils have mutual inductance M = 50 mH. Electric current in primary coil changes at rate dI/dt = 100 A/s. Calculate EMF induced in secondary coil.", "opts": ["0.5 V", "50 V", "5 V", "2 V"], "ans": "C", "exp": "Secondary induced EMF E_s = M × (dI/dt). Substituting values: E_s = 0.05 H × 100 A/s = 0.050 × 100 = 5 V."}, {"n": 100, "section": "CH 8 · ELECTROMAGNETIC INDUCTION", "q": "An inductor coil of self-inductance L = 0.20 H carries a steady current of 4.0 A. Calculate magnetic energy stored in magnetic field of inductor.", "opts": ["0.8 J", "3.2 J", "0.4 J", "1.6 J"], "ans": "D", "exp": "Magnetic energy stored in an inductor U = 0.5 × L × I² = 0.5 × 0.20 H × (4.0 A)² = 0.10 × 16.0 = 1.6 J."}]},
 p9:{title:"Inductance & Magnetic Energy",desc:"Self/mutual inductance, RL circuits, energy in B fields",color:"#6366F1",icon:"&#129514;",data:[{"n": 1, "section": "CH 9 · INDUCTANCE & MAGNETIC ENERGY", "q": "A coil with 500 turns carries a current of 2.5 A, producing a magnetic flux of 4 × 10⁻⁴ Wb through each turn. What is the self-inductance of the coil?", "opts": ["8 × 10⁻² H", "0.5 H", "1.6 × 10⁻⁴ H", "3.12 × 10⁶ H"], "ans": "A", "exp": "The self-inductance of a coil is defined by the flux linkage per unit current, L = NΦ / I. Substituting N = 500, Φ = 4 × 10⁻⁴ Wb, and I = 2.5 A gives L = (500 × 4 × 10⁻⁴ Wb) / 2.5 A = 8 × 10⁻² H."}, {"n": 2, "section": "CH 9 · INDUCTANCE & MAGNETIC ENERGY", "q": "A solenoid of length 0.5 m and cross-sectional area 1 × 10⁻³ m² consists of 1000 turns. Calculate its self-inductance in free space.", "opts": ["2.51 × 10⁻⁶ H", "5.03 × 10⁻³ H", "2.51 × 10⁻³ H", "1.26 × 10⁻³ H"], "ans": "C", "exp": "The self-inductance of a solenoid is given by L = μ₀ N² A / l. Substituting μ₀ = 4π × 10⁻⁷ T·m/A, N = 1000, A = 1 × 10⁻³ m², and l = 0.5 m yields L = (4π × 10⁻⁷ × 1000² × 1 × 10⁻³ m²) / 0.5 = 2.51 × 10⁻³ H."}, {"n": 3, "section": "CH 9 · INDUCTANCE & MAGNETIC ENERGY", "q": "The current in an inductor of self-inductance 0.15 H decreases uniformly from 8.0 A to 2.0 A in 0.05 s. What is the magnitude of the self-induced EMF?", "opts": ["0.9 V", "3 V", "18 V", "4.5 × 10⁻² V"], "ans": "C", "exp": "According to Faraday's law for self-inductance, the magnitude of induced EMF is |ε| = L |ΔI/Δt|. Here |ΔI/Δt| = |2.0 - 8.0| / 0.05 = 120.0 A/s. Thus |ε| = 0.15 H × 120.0 A/s = 18 V."}, {"n": 4, "section": "CH 9 · INDUCTANCE & MAGNETIC ENERGY", "q": "When the current flowing through an inductor is increasing with time, what is the direction and physical effect of the self-induced EMF according to Lenz's law?", "opts": ["It aids the increasing current by producing an EMF in the same direction as the applied voltage.", "It acts in a perpendicular direction to the current to create electrostatic charge accumulation.", "It instantly forces the current to drop to zero to conserve magnetic energy.", "It opposes the increasing current by producing a back EMF directed opposite to the applied voltage."], "ans": "D", "exp": "By Lenz's law, the self-induced EMF always opposes the change in magnetic flux that causes it. When current increases, the induced back EMF acts opposite to the current flow, slowing down the rate of current growth."}, {"n": 5, "section": "CH 9 · INDUCTANCE & MAGNETIC ENERGY", "q": "Two coupled coils have a mutual inductance of 4 × 10⁻² H. If the current in the primary coil changes at a rate of 250 A/s, what is the magnitude of the EMF induced in the secondary coil?", "opts": ["10 V", "1.6 × 10⁻⁴ V", "250 V", "2500 V"], "ans": "A", "exp": "The magnitude of EMF induced in the secondary coil is |ε₂| = M (dI₁/dt). Substituting M = 4 × 10⁻² H and dI₁/dt = 250 A/s yields |ε₂| = 0.04 × 250 = 10 V."}, {"n": 6, "section": "CH 9 · INDUCTANCE & MAGNETIC ENERGY", "q": "Two coils with self-inductances 2 × 10⁻² H and 8 × 10⁻² H have a mutual inductance of 3.2 × 10⁻² H. What is the coefficient of coupling k between the coils?", "opts": ["0.80", "0.32", "0.10", "0.05"], "ans": "A", "exp": "The coupling coefficient k is defined by M = k √(L₁ L₂), so k = M / √(L₁ L₂). Substituting values gives k = 0.032 / √(0.02 × 0.08) = 0.032 / 0.040 = 0.80."}, {"n": 7, "section": "CH 9 · INDUCTANCE & MAGNETIC ENERGY", "q": "Two thin coaxial solenoids of length 0.4 m have 400 turns and 800 turns respectively. If the inner solenoid has a cross-sectional area of 5 × 10⁻⁴ m², calculate their mutual inductance M.", "opts": ["2.51 × 10⁻⁴ H", "1.01 × 10⁻³ H", "5.03 × 10⁻³ H", "5.03 × 10⁻⁴ H"], "ans": "D", "exp": "The mutual inductance of two coaxial solenoids sharing cross-sectional area A and length l is M = μ₀ N₁ N₂ A / l. Substituting μ₀ = 4π × 10⁻⁷ T·m/A, N₁ = 400, N₂ = 800, A = 5 × 10⁻⁴ m², and l = 0.4 m gives M = 5.03 × 10⁻⁴ H."}, {"n": 8, "section": "CH 9 · INDUCTANCE & MAGNETIC ENERGY", "q": "Two inductors 5 × 10⁻³ H and 1.2 × 10⁻² H are connected in series aiding with mutual inductance 3 × 10⁻³ H. What is the total equivalent inductance of the combination?", "opts": ["2 × 10⁻² H", "1.1 × 10⁻² H", "1.7 × 10⁻² H", "2.3 × 10⁻² H"], "ans": "D", "exp": "When two inductors are connected in series aiding so that their magnetic fluxes add, the equivalent inductance is L_eq = L₁ + L₂ + 2M. Thus L_eq = 5 × 10⁻³ H + 1.2 × 10⁻² H + 2(3 × 10⁻³ H) = 2.3 × 10⁻² H."}, {"n": 9, "section": "CH 9 · INDUCTANCE & MAGNETIC ENERGY", "q": "Two inductors of inductance 6 × 10⁻³ H and 1.2 × 10⁻² H are connected in parallel with no mutual magnetic coupling. What is the equivalent inductance?", "opts": ["1.8 × 10⁻² H", "4 × 10⁻³ H", "9 × 10⁻³ H", "8.49 × 10⁻³ H"], "ans": "B", "exp": "For uncoupled inductors in parallel, 1/L_eq = 1/L₁ + 1/L₂, giving L_eq = (L₁ × L₂) / (L₁ + L₂). Substituting values gives L_eq = (6 × 10⁻³ H × 1.2 × 10⁻² H) / (6 × 10⁻³ H + 1.2 × 10⁻² H) = 4 × 10⁻³ H."}, {"n": 10, "section": "CH 9 · INDUCTANCE & MAGNETIC ENERGY", "q": "An inductor with self-inductance 0.5 H carries a steady current of 4.0 A. Calculate the energy stored in its magnetic field.", "opts": ["8 J", "1 J", "2 J", "4 J"], "ans": "D", "exp": "The magnetic energy stored in an inductor is U = ½ L I². Substituting L = 0.5 H and I = 4.0 A gives U = 0.5 × 0.5 × (4.0)² = 4 J."}, {"n": 11, "section": "CH 9 · INDUCTANCE & MAGNETIC ENERGY", "q": "Calculate the energy density in a uniform magnetic field of magnetic flux density B = 1.5 T in free space.", "opts": ["1.79 × 10⁶ J/m³", "8.95 × 10⁵ J/m³", "5.97 × 10⁵ J/m³", "1.41 × 10⁻⁶ J/m³"], "ans": "B", "exp": "The magnetic energy density in free space is u = B² / (2μ₀). Substituting B = 1.5 T and μ₀ = 4π × 10⁻⁷ T·m/A gives u = (1.5)² / (2 × 4π × 10⁻⁷) = 8.95 × 10⁵ J/m³."}, {"n": 12, "section": "CH 9 · INDUCTANCE & MAGNETIC ENERGY", "q": "A solenoid has a internal volume of 2 × 10⁻³ m³ and produces a uniform magnetic field of 0.8 T inside. Calculate the total magnetic energy stored inside the solenoid.", "opts": ["255 J", "1.02 × 10³ J", "509 J", "0.509 J"], "ans": "C", "exp": "Total stored magnetic energy is U = u × V = [B² / (2μ₀)] × V. Substituting B = 0.8 T, μ₀ = 4π × 10⁻⁷ T·m/A, and V = 2 × 10⁻³ m³ gives U = [0.8² / (2.513 × 10⁻⁶)] × 2 × 10⁻³ m³ = 509 J."}, {"n": 13, "section": "CH 9 · INDUCTANCE & MAGNETIC ENERGY", "q": "An RL circuit has R = 50 Ω and L = 0.2 H connected to a 100 V DC battery. What is the circuit time constant τ and the current at t = τ?", "opts": ["τ = 4 × 10⁻³ s, I = 1.26 A", "τ = 250 s, I = 1.26 A", "τ = 4 × 10⁻³ s, I = 0.736 A", "τ = 1 × 10⁻² s, I = 2 A"], "ans": "A", "exp": "The time constant is τ = L/R = 0.2 / 50 = 4 × 10⁻³ s. At t = τ, current rises to I(τ) = I₀(1 - e⁻¹) = (100 V / 50 Ω) × (1 - 0.3679) = 2.0 A × 0.6321 = 1.26 A."}, {"n": 14, "section": "CH 9 · INDUCTANCE & MAGNETIC ENERGY", "q": "An RL circuit with L = 0.5 H and R = 25 Ω initially carries a steady current of 4.0 A. The power supply is bypassed at t = 0. Calculate the remaining current after 0.04 s.", "opts": ["1.47 A", "0.541 A", "3.46 A", "0 A"], "ans": "B", "exp": "During current decay in an RL circuit, I(t) = I₀ e⁻ᵗ/ᵀ where τ = L/R = 0.5 / 25 = 0.02 s. At t = 0.04 s, t/τ = 2.0, so I(0.04) = 4.0 × e⁻² = 4.0 × 0.1353 = 0.541 A."}, {"n": 15, "section": "CH 9 · INDUCTANCE & MAGNETIC ENERGY", "q": "In an RL series circuit connected to a constant DC voltage source, what physical significance does the time constant τ = L/R represent during current growth?", "opts": ["The time required for the current to reach 100% of its maximum steady-state value.", "The time required for the current to reach approximately 63.2% of its maximum steady-state value.", "The time required for the voltage across the resistor to reach zero.", "The time required for all stored magnetic energy to convert into heat."], "ans": "B", "exp": "The time constant τ = L/R represents the characteristic time for inductive current growth. At t = τ, I(τ) = I₀(1 - e⁻¹) ≈ 0.632 I₀, meaning current reaches 63.2% of maximum current I₀ = V₀/R."}, {"n": 16, "section": "CH 9 · INDUCTANCE & MAGNETIC ENERGY", "q": "Immediately after closing a switch (t = 0⁺) to connect an unenergized inductor L and resistor R to a DC voltage source V₀, what are the values of current I, resistor voltage V_R, and inductor voltage V_L?", "opts": ["I = V₀/R, V_R = V₀, and V_L = 0.", "I = 0.5 V₀/R, V_R = 0.5 V₀, and V_L = 0.5 V₀.", "I = 0, V_R = V₀, and V_L = 0.", "I = 0, V_R = 0, and V_L = V₀."], "ans": "D", "exp": "At t = 0⁺, the inductor prevents an instantaneous jump in current, so I(0⁺) = 0. Consequently, the resistor voltage drop V_R = I R = 0, and by Kirchhoff's loop law, the entire source voltage drops across the inductor, V_L = V₀."}, {"n": 17, "section": "CH 9 · INDUCTANCE & MAGNETIC ENERGY", "q": "An RL circuit with L = 2.0 H carries an initial current of 3.0 A. When the source is removed and current decays through resistor R, how much total thermal energy is dissipated in R?", "opts": ["18 J", "3 J", "9 J", "6 J"], "ans": "C", "exp": "By conservation of energy, the total thermal energy dissipated in resistor R during decay equals the initial magnetic energy stored in the inductor. W = ½ L I₀² = 0.5 × 2.0 H × (3.0 A)² = 9 J."}, {"n": 18, "section": "CH 9 · INDUCTANCE & MAGNETIC ENERGY", "q": "How does an ideal inductor (zero internal resistance) behave in a DC circuit after a very long time (steady state, t → ∞)?", "opts": ["It acts as a short circuit (zero resistance wire) because current is constant (dI/dt = 0) and induced EMF is zero.", "It acts as an open circuit blocking all current flow.", "It maintains a constant opposition to current equal to its inductance L.", "It acts as an active voltage source continually discharging energy."], "ans": "A", "exp": "At steady state (t → ∞), current in a DC circuit becomes constant so dI/dt = 0. Since induced voltage ε = -L (dI/dt) = 0, an ideal inductor offers zero voltage drop and acts like a short circuit wire."}, {"n": 19, "section": "CH 9 · INDUCTANCE & MAGNETIC ENERGY", "q": "Why is an inductor (choke coil) preferred over a resistor for limiting alternating current in AC circuits?", "opts": ["An inductor increases the frequency of the AC voltage supply.", "An inductor converts AC current directly into DC current.", "An ideal inductor opposes AC current via inductive reactance without dissipating average power as heat.", "An inductor has zero reactance and only dissipates DC power."], "ans": "C", "exp": "A choke coil uses inductive reactance X_L = ωL to limit AC current. In an ideal inductor, current lags voltage by 90°, so the power factor cos φ = 0, resulting in zero average power loss (P = V_rms I_rms cos φ = 0)."}, {"n": 20, "section": "CH 9 · INDUCTANCE & MAGNETIC ENERGY", "q": "In a purely inductive AC circuit connected to a sinusoidal voltage source, what is the phase relationship between voltage and current?", "opts": ["Voltage leads current by 90° (π/2 radians).", "Current leads voltage by 90° (π/2 radians).", "Voltage and current are exactly in phase.", "Voltage leads current by 180° (π radians)."], "ans": "A", "exp": "In a purely inductive circuit, self-induced back EMF opposes current variations, causing current to lag behind applied voltage by 90° (π/2 rad). Equivalently, voltage leads current by 90°."}, {"n": 21, "section": "CH 9 · INDUCTANCE & MAGNETIC ENERGY", "q": "Why does a prominent electrical spark often occur across switch contacts when opening a circuit that contains a large inductance carrying current?", "opts": ["The switch resistance suddenly drops to zero when contacts separate.", "The electric charge stored on inductor coils discharges instantly.", "The rapid drop in current creates a massive dI/dt, inducing a huge back EMF that breaks down air insulation.", "The magnetic field reverses direction and accelerates thermal ions."], "ans": "C", "exp": "Opening the switch forces current to drop to zero very rapidly, creating a very large negative rate of change dI/dt. According to ε = -L (dI/dt), a massive induced back EMF appears across the opening contacts, producing a spark."}, {"n": 22, "section": "CH 9 · INDUCTANCE & MAGNETIC ENERGY", "q": "Current in a 5 × 10⁻² H coil decreases linearly from 10.0 A to 0 A in 0.05 s. What is the magnitude of the self-induced EMF during this interval?", "opts": ["2.5 V", "10 V", "5 V", "0 V"], "ans": "B", "exp": "The rate of current change is |dI/dt| = 10.0 A / 0.05 s = 200 A/s. Induced EMF magnitude is |ε| = L |dI/dt| = 0.05 H × 200 A/s = 10 V."}, {"n": 23, "section": "CH 9 · INDUCTANCE & MAGNETIC ENERGY", "q": "A coil with 200 turns has a self-inductance of 1.2 × 10⁻² H. When carrying a current of 5.0 A, what is the magnetic flux through each turn of the coil?", "opts": ["3 × 10⁻⁴ Wb", "12 Wb", "1.2 × 10⁻⁵ Wb", "6 × 10⁻² Wb"], "ans": "A", "exp": "Magnetic flux linkage is N Φ = L I, so flux per turn is Φ = (L I) / N. Substituting L = 1.2 × 10⁻² H, I = 5.0 A, and N = 200 turns gives Φ = (0.012 × 5.0) / 200 = 3 × 10⁻⁴ Wb."}, {"n": 24, "section": "CH 9 · INDUCTANCE & MAGNETIC ENERGY", "q": "Which pair of expressions correctly gives the energy density stored in an electric field u_E in vacuum and in a magnetic field u_B in vacuum?", "opts": ["u_E = ½ (E² / ε₀) and u_B = ½ μ₀ B².", "u_E = ε₀ E and u_B = μ₀ B.", "u_E = ½ ε₀ E² and u_B = 2μ₀ / B².", "u_E = ½ ε₀ E² and u_B = B² / (2μ₀)."], "ans": "D", "exp": "Energy density stored in an electric field is u_E = ½ ε₀ E², while energy density stored in a magnetic field in free space is u_B = B² / (2μ₀). Both express stored energy per unit volume."}, {"n": 25, "section": "CH 9 · INDUCTANCE & MAGNETIC ENERGY", "q": "According to the reciprocity theorem for mutual inductance between two static co-axial coils 1 and 2, which statement is true?", "opts": ["The mutual inductance M₁₂ of coil 1 on coil 2 always equals M₂₁ of coil 2 on coil 1 (M₁₂ = M₂₁ = M).", "M₁₂ is inversely proportional to M₂₁ depending on turn ratio.", "M₁₂ equals M₂₁ only if both coils have identical radii and turn counts.", "M₁₂ is strictly greater than M₂₁ if coil 1 has a larger volume."], "ans": "A", "exp": "By the reciprocity theorem of electromagnetism, mutual inductance is symmetric: M₁₂ = M₂₁ = M. This equality holds for any two fixed coils regardless of differences in shape, size, or number of turns."}]},
 p10:{title:"Magnetic Materials",desc:"Dia/para/ferromagnetism, permeability, domains, hysteresis",color:"#64748B",icon:"&#9881;",data:[{"n": 26, "section": "CH 10 · MAGNETIC MATERIALS", "q": "Which set of properties correctly characterizes diamagnetic materials?", "opts": ["Magnetic susceptibility χ is negative (χ &lt; 0), relative permeability μ_r &lt; 1, and repelled weakly by magnetic fields.", "Susceptibility χ &gt; 0, relative permeability μ_r &gt; 1, and strongly attracted to magnetic fields.", "Susceptibility χ is positive and very large, retaining permanent magnetization.", "Susceptibility χ &lt; 0, relative permeability μ_r &gt; 1, and strongly attracted to magnetic poles."], "ans": "A", "exp": "Diamagnetic materials have magnetic susceptibility χ &lt; 0 and relative permeability μ_r &lt; 1. Placed in an external field, they develop induced magnetic moments opposing the field and are weakly repelled."}, {"n": 27, "section": "CH 10 · MAGNETIC MATERIALS", "q": "Which group consists entirely of diamagnetic substances?", "opts": ["Iron, nickel, cobalt, and alnico.", "Aluminum, platinum, oxygen, and chromium.", "Copper, bismuth, water, gold, and lead.", "Gadolinium, iron oxide, and permalloy."], "ans": "C", "exp": "Copper, bismuth, water, gold, and lead are classic diamagnetic materials because all their electrons are paired in atomic shells, leaving zero net orbital/spin magnetic moment in the absence of an applied field."}, {"n": 28, "section": "CH 10 · MAGNETIC MATERIALS", "q": "Which set of properties correctly characterizes paramagnetic materials?", "opts": ["Negative susceptibility (χ &lt; 0), relative permeability μ_r &lt; 1, and weakly repelled by magnetic fields.", "Very large susceptibility (χ ~ 10³), retaining residual magnetization when external field is removed.", "Susceptibility χ &lt; 0 and independent of temperature under all conditions.", "Small positive susceptibility (χ &gt; 0), relative permeability μ_r slightly greater than 1, and weakly attracted to magnetic fields."], "ans": "D", "exp": "Paramagnetic materials possess permanent atomic dipole moments (unpaired electrons). Placed in an external magnetic field, dipoles align weakly with the field, giving small positive χ &gt; 0 and μ_r slightly &gt; 1."}, {"n": 29, "section": "CH 10 · MAGNETIC MATERIALS", "q": "At T = 300 K, a paramagnetic sample has magnetic susceptibility χ = 2 × 10⁻⁴. According to Curie's law, what is its susceptibility at T = 400 K?", "opts": ["2.67 × 10⁻⁴", "2 × 10⁻⁴", "1 × 10⁻⁴", "1.5 × 10⁻⁴"], "ans": "D", "exp": "Curie's law states that paramagnetic susceptibility is inversely proportional to absolute temperature, χ = C / T. Thus χ₂ = χ₁ (T₁ / T₂) = (2 × 10⁻⁴) × (300 / 400) = 1.5 × 10⁻⁴."}, {"n": 30, "section": "CH 10 · MAGNETIC MATERIALS", "q": "Which group consists entirely of paramagnetic substances?", "opts": ["Bismuth, copper, water, and graphite.", "Aluminum, platinum, chromium, and oxygen gas.", "Iron, cobalt, nickel, and gadolinium.", "Zinc, silver, lead, and sodium chloride."], "ans": "B", "exp": "Aluminum, platinum, chromium, and oxygen gas are paramagnetic because their constituent atoms/molecules contain unpaired electrons that generate permanent magnetic dipole moments."}, {"n": 31, "section": "CH 10 · MAGNETIC MATERIALS", "q": "Which set of properties correctly describes ferromagnetic materials?", "opts": ["Negative susceptibility χ &lt; 0 that increases linearly with temperature.", "Small positive susceptibility χ ~ 10⁻⁵ independent of applied field.", "Very large positive susceptibility (χ &gt;&gt; 1), μ_r &gt;&gt; 1, strong attraction to magnetic fields, and presence of magnetic domains.", "Zero relative permeability and complete expulsion of magnetic flux."], "ans": "C", "exp": "Ferromagnetic materials exhibit strong magnetization due to magnetic domain structure and quantum exchange coupling between electron spins, resulting in μ_r &gt;&gt; 1 and retention of magnetization."}, {"n": 32, "section": "CH 10 · MAGNETIC MATERIALS", "q": "Which group consists of elemental ferromagnetic materials at or near room temperature?", "opts": ["Copper, silver, gold, and aluminum.", "Iron, cobalt, nickel, and gadolinium.", "Bismuth, antimony, water, and mercury.", "Platinum, manganese, chromium, and magnesium."], "ans": "B", "exp": "Iron (Fe), cobalt (Co), nickel (Ni), and gadolinium (Gd, T_C = 292 K) are the principal elemental ferromagnetic materials."}, {"n": 33, "section": "CH 10 · MAGNETIC MATERIALS", "q": "A magnetic material with relative permeability μ_r = 500 is placed in a magnetic field intensity H = 200 A/m. Calculate magnetic flux density B inside the material.", "opts": ["0.1 T", "1 × 10⁵ T", "0.126 T", "2.51 × 10⁻² T"], "ans": "C", "exp": "Magnetic flux density in a medium is B = μ₀ μ_r H. Substituting μ₀ = 4π × 10⁻⁷ T·m/A, μ_r = 500, and H = 200 A/m yields B = (4π × 10⁻⁷ × 500 × 200) = 0.126 T."}, {"n": 34, "section": "CH 10 · MAGNETIC MATERIALS", "q": "A magnetic substance has susceptibility χ = 499. Calculate its relative permeability μ_r and magnetic permeability μ.", "opts": ["μ_r = 499, μ = 6.27 × 10⁻⁴ T·m/A", "μ_r = 500, μ = 6.28 × 10⁻⁴ T·m/A", "μ_r = 498, μ = 6.26 × 10⁻⁴ T·m/A", "μ_r = 500, μ = 500 T·m/A"], "ans": "B", "exp": "Relative permeability is related to susceptibility by μ_r = 1 + χ = 1 + 499 = 500. Magnetic permeability is μ = μ_r μ₀ = 500 × 4π × 10⁻⁷ T·m/A = 6.28 × 10⁻⁴ T·m/A."}, {"n": 35, "section": "CH 10 · MAGNETIC MATERIALS", "q": "A magnetic rod of volume V = 5 × 10⁻⁵ m³ possesses a total magnetic dipole moment m = 2.5 A·m². Calculate magnetization M of the rod.", "opts": ["1.25 × 10⁻⁴ A/m", "2 × 10⁻⁵ A/m", "2.5 × 10⁵ A/m", "5 × 10⁴ A/m"], "ans": "D", "exp": "Magnetization M is defined as magnetic dipole moment per unit volume, M = m / V. Substituting m = 2.5 A·m² and V = 5 × 10⁻⁵ m³ gives M = 2.5 / (5 × 10⁻⁵ m³) = 5 × 10⁴ A/m."}, {"n": 36, "section": "CH 10 · MAGNETIC MATERIALS", "q": "What is the microscopic/quantum origin of ferromagnetism in materials like iron and nickel?", "opts": ["Unpaired electron spin magnetic moments aligned parallel by quantum mechanical exchange interactions.", "Proton spin alignment inside atomic nuclei.", "Thermal motion of positively charged ions in the lattice.", "Orbital motion of conduction electrons around domain boundaries."], "ans": "A", "exp": "The primary origin of ferromagnetism is the intrinsic spin magnetic moment of unpaired electrons. Quantum exchange interaction forces adjacent spins to align parallel within macroscopic regions called magnetic domains."}, {"n": 37, "section": "CH 10 · MAGNETIC MATERIALS", "q": "When an unmagnetized ferromagnetic sample is exposed to a weak external magnetic field, magnetization occurs primarily through which domain process?", "opts": ["Sudden rotation of all domain magnetization vectors at once.", "Growth of favorably oriented domains at the expense of unfavorably oriented domains (domain wall displacement).", "Destruction and complete disappearance of all domain walls.", "Creation of new electron charges at domain boundaries."], "ans": "B", "exp": "In weak external fields, magnetization occurs mainly by domain wall displacement—domains aligned with the field expand while unaligned domains shrink. Domain rotation becomes dominant in stronger magnetic fields."}, {"n": 38, "section": "CH 10 · MAGNETIC MATERIALS", "q": "In a hysteresis loop for a ferromagnetic material, what is retentivity (remanence)?", "opts": ["The reverse magnetic field required to reduce residual flux density B to zero.", "The maximum flux density achievable at magnetic saturation.", "The heat energy dissipated per unit volume per cycle.", "The residual magnetic flux density B remaining in the material when the external magnetizing field H is reduced to zero."], "ans": "D", "exp": "Retentivity (remanence) is the measure of residual magnetic flux density B that persists in a ferromagnetic material after the external magnetizing field H has been returned to zero."}, {"n": 39, "section": "CH 10 · MAGNETIC MATERIALS", "q": "In a hysteresis loop, what does coercivity (H_c) measure?", "opts": ["The peak magnetic field required to achieve magnetic saturation.", "The residual magnetization remaining when magnetizing field H is zero.", "The initial slope of the magnetization curve from the origin.", "The magnitude of reverse magnetizing field required to reduce residual magnetic flux density B to zero."], "ans": "D", "exp": "Coercivity H_c represents the resistance of a ferromagnetic material to demagnetization. It is defined as the reverse magnetic field intensity needed to bring residual flux density B back to zero."}, {"n": 40, "section": "CH 10 · MAGNETIC MATERIALS", "q": "A transformer core of volume V = 4 × 10⁻³ m³ has a B-H hysteresis loop area corresponding to 250 J/m³ per cycle. If operated at frequency f = 50 Hz, calculate power loss due to hysteresis.", "opts": ["50 W", "1 W", "2500 W", "25 W"], "ans": "A", "exp": "Hysteresis energy loss per unit volume per cycle equals the B-H loop area. Power loss is P = (Loop Area) × Volume × frequency = 250 J/m³ × (4 × 10⁻³ m³) × 50 s⁻¹ = 50 W."}, {"n": 41, "section": "CH 10 · MAGNETIC MATERIALS", "q": "Which set of characteristics defines a soft magnetic material?", "opts": ["High permeability, low coercivity, high retentivity, and small hysteresis loop area.", "High coercivity, low permeability, and large hysteresis loop area.", "Negative susceptibility and zero retentivity.", "High coercivity, high electrical resistivity, and zero permeability."], "ans": "A", "exp": "Soft magnetic materials are easily magnetized and demagnetized. They feature high relative permeability, low coercivity, and narrow hysteresis loops, ensuring minimal hysteresis energy loss per cycle."}, {"n": 42, "section": "CH 10 · MAGNETIC MATERIALS", "q": "Which electrical device applications require soft magnetic materials?", "opts": ["Permanent magnets in loudspeakers and DC motors.", "Transformer cores, AC motor armatures, and electromagnet cores.", "Magnetic compass needles and magnetic hard disk platters.", "High-coercivity credit card magnetic strips."], "ans": "B", "exp": "Soft magnetic materials (such as soft iron and silicon steel) magnetize easily and dissipate minimal hysteresis energy during AC cycling, making them ideal for transformer cores, motor armatures, and electromagnets."}, {"n": 43, "section": "CH 10 · MAGNETIC MATERIALS", "q": "Which set of characteristics defines a hard magnetic material?", "opts": ["Low coercivity, high permeability, and narrow hysteresis loop.", "Zero retentivity and negative susceptibility.", "High coercivity, high retentivity, and large hysteresis loop area.", "Low coercivity and zero resistance to demagnetization."], "ans": "C", "exp": "Hard magnetic materials retain magnetization strongly and resist demagnetization due to high coercivity, high retentivity, and broad hysteresis loop area."}, {"n": 44, "section": "CH 10 · MAGNETIC MATERIALS", "q": "Which applications specifically require hard magnetic materials?", "opts": ["AC transformer cores and choke coil cores.", "Permanent magnets for loudspeakers, magnetic door latches, and DC motor field magnets.", "Electromagnets designed for fast current switching.", "Radio frequency ferrite tuning inductors."], "ans": "B", "exp": "Hard magnetic materials (such as Alnico, NdFeB, and hard ferrites) retain strong permanent magnetization without external electric currents, making them ideal for permanent magnets."}, {"n": 45, "section": "CH 10 · MAGNETIC MATERIALS", "q": "What happens to a ferromagnetic material when heated above its Curie temperature T_C?", "opts": ["It becomes diamagnetic with negative susceptibility.", "It becomes superconducting with zero internal magnetic field.", "It undergoes a phase transition to become paramagnetic, following the Curie-Weiss law χ = C / (T - T_C).", "It remains ferromagnetic with doubled permanent magnetization."], "ans": "C", "exp": "Above the Curie temperature T_C, thermal energy destroys domain alignment and exchange coupling. The material transitions into a paramagnetic state described by the Curie-Weiss law χ = C / (T - T_C)."}, {"n": 46, "section": "CH 10 · MAGNETIC MATERIALS", "q": "Which combination of methods can be used to demagnetize a permanent magnet?", "opts": ["Cooling to near absolute zero temperature.", "Heating above Curie temperature, placing in a decreasing AC magnetic field, or mechanical hammering.", "Placing inside a strong static DC magnetic field permanently.", "Submerging in water or non-magnetic oil."], "ans": "B", "exp": "Demagnetization requires randomizing magnetic domain alignments. This is achieved thermally (heating above T_C), mechanically (hammering or dropping), or magnetically (exposure to an AC magnetic field with decaying amplitude)."}, {"n": 47, "section": "CH 10 · MAGNETIC MATERIALS", "q": "An iron core with relative permeability μ_r = 800 is inside a solenoid producing magnetic field intensity H = 150 A/m. Calculate magnetic flux density B inside the iron core.", "opts": ["0.151 T", "0.12 T", "1.2 × 10⁵ T", "1.88 × 10⁻² T"], "ans": "A", "exp": "Inside the core, B = μ₀ μ_r H. Substituting μ₀ = 4π × 10⁻⁷ T·m/A, μ_r = 800, and H = 150 A/m gives B = (4π × 10⁻⁷ × 800 × 150) = 0.151 T."}, {"n": 48, "section": "CH 10 · MAGNETIC MATERIALS", "q": "Calculate the value of the Bohr magneton μ_B = e ℏ / (2 m_e) using e = 1.6 × 10⁻¹⁹ C, ℏ = 1.05 × 10⁻³⁴ J·s, and m_e = 9.11 × 10⁻³¹ kg.", "opts": ["9.26 × 10⁻²¹ J/T", "1.6 × 10⁻¹⁹ J/T", "9.26 × 10⁻²⁷ J/T", "9.26 × 10⁻²⁴ J/T"], "ans": "D", "exp": "The Bohr magneton is μ_B = e ℏ / (2 m_e) = (1.6 × 10⁻¹⁹ × 1.05 × 10⁻³⁴) / (2 × 9.11 × 10⁻³¹) = 9.26 × 10⁻²⁴ J/T."}, {"n": 49, "section": "CH 10 · MAGNETIC MATERIALS", "q": "How do magnetic lines of force behave when passing through diamagnetic versus paramagnetic materials placed in an external field?", "opts": ["Field lines are concentrated in diamagnetic materials and expelled from paramagnetic materials.", "Field lines are expelled (diverge outward) from diamagnetic materials and concentrated (converge inward) into paramagnetic materials.", "Field lines remain completely unaffected in both materials.", "Field lines form closed circular loops inside diamagnetic materials only."], "ans": "B", "exp": "Because diamagnetic materials have μ_r &lt; 1, they weakly repel magnetic flux lines, pushing them outward. Paramagnetic materials (μ_r &gt; 1) attract flux lines, slightly concentrating them inside."}, {"n": 50, "section": "CH 10 · MAGNETIC MATERIALS", "q": "How does magnetic susceptibility χ depend on absolute temperature T for diamagnetic, paramagnetic, and ferromagnetic materials (above T_C)?", "opts": ["Diamagnetic: increases linearly with T; Paramagnetic: independent of T; Ferromagnetic: independent of T.", "Diamagnetic: χ ∝ 1/T; Paramagnetic: independent of T; Ferromagnetic: increases with T.", "All three increase exponentially with absolute temperature.", "Diamagnetic: independent of T; Paramagnetic: χ ∝ 1/T (Curie's law); Ferromagnetic (T &gt; T_C): χ ∝ 1/(T - T_C)."], "ans": "D", "exp": "Diamagnetism arises from paired electron orbital motion and is independent of temperature. Paramagnetism obeys Curie's law (χ ∝ 1/T) due to thermal randomization of dipoles. Ferromagnetism obeys the Curie-Weiss law above T_C."}]},
 p11:{title:"Alternating Current",desc:"RMS values, reactance, RLC circuits, resonance, power factor",color:"#A855F7",icon:"&#12336;",data:[{"n": 51, "section": "CH 11 · ALTERNATING CURRENT", "q": "An AC voltage is expressed by V(t) = 170 sin(100π t) V. Determine peak voltage V₀, RMS voltage V_rms, and frequency f.", "opts": ["V₀ = 170 V, V_rms = 240 V, f = 100 Hz", "V₀ = 120 V, V_rms = 170 V, f = 50 Hz", "V₀ = 170 V, V_rms = 120 V, f = 100 Hz", "V₀ = 170 V, V_rms = 120 V, f = 50 Hz"], "ans": "D", "exp": "From V(t) = V₀ sin(ω t), peak voltage V₀ = 170 V. RMS voltage V_rms = V₀ / √2 = 170 / 1.414 = 120 V. Angular frequency ω = 100π rad/s, so f = ω / (2π) = 50 Hz."}, {"n": 52, "section": "CH 11 · ALTERNATING CURRENT", "q": "For a sinusoidal AC voltage with peak value V₀ = 311 V, calculate the average voltage V_avg over a positive half-cycle.", "opts": ["220 V", "311 V", "0 V", "198 V"], "ans": "D", "exp": "The average value of sinusoidal AC voltage over a half-cycle is V_avg = (2 / π) V₀. Substituting V₀ = 311 V yields V_avg = (2 / π) × 311 = 198 V. (Note: average over a full cycle is zero)."}, {"n": 53, "section": "CH 11 · ALTERNATING CURRENT", "q": "A capacitor C = 1 × 10⁻⁵ F is connected to a 50 Hz AC supply. Calculate its capacitive reactance X_C.", "opts": ["3.14 × 10⁻³ Ω", "318 Ω", "159 Ω", "500 Ω"], "ans": "B", "exp": "Capacitive reactance is X_C = 1 / (2π f C). Substituting f = 50 Hz and C = 1 × 10⁻⁵ F gives X_C = 1 / (2π × 50 × 1 × 10⁻⁵) = 318 Ω."}, {"n": 54, "section": "CH 11 · ALTERNATING CURRENT", "q": "An inductor L = 0.2 H is connected to a 60 Hz AC supply. Calculate its inductive reactance X_L.", "opts": ["12 Ω", "75.4 Ω", "1.33 × 10⁻² Ω", "151 Ω"], "ans": "B", "exp": "Inductive reactance is X_L = 2π f L. Substituting f = 60 Hz and L = 0.2 H gives X_L = 2π × 60 × 0.2 = 75.4 Ω."}, {"n": 55, "section": "CH 11 · ALTERNATING CURRENT", "q": "Which statement correctly describes the phase relationship between voltage and current in purely resistive, purely inductive, and purely capacitive AC circuits?", "opts": ["Resistor: current leads voltage by 90°; Inductor: in phase; Capacitor: voltage leads current by 90°.", "Resistor: in phase; Inductor: current leads voltage by 90°; Capacitor: voltage leads current by 90°.", "Resistor: voltage and current in phase; Inductor: voltage leads current by 90°; Capacitor: current leads voltage by 90°.", "Resistor: voltage leads by 180°; Inductor: in phase; Capacitor: in phase."], "ans": "C", "exp": "In a pure resistor, voltage and current are in phase (φ = 0). In a pure inductor, voltage leads current by 90° (current lags). In a pure capacitor, current leads voltage by 90°."}, {"n": 56, "section": "CH 11 · ALTERNATING CURRENT", "q": "A series RLC circuit has R = 40 Ω, X_L = 100 Ω, and X_C = 70 Ω. Calculate the total impedance Z of the circuit.", "opts": ["50 Ω", "210 Ω", "70 Ω", "110 Ω"], "ans": "A", "exp": "Impedance of a series RLC circuit is Z = √[R² + (X_L - X_C)²]. Here X_L - X_C = 100 - 70 = 30 Ω. Thus Z = √[40² + 30²] = √(1600 + 900) = 50 Ω."}, {"n": 57, "section": "CH 11 · ALTERNATING CURRENT", "q": "A series RLC circuit with R = 30 Ω, L = 0.25 H, and C = 4 × 10⁻⁵ F is connected to a 120 V, 50 Hz AC source. Calculate RMS current I_rms.", "opts": ["0.638 A", "0.8 A", "4 A", "5.65 A"], "ans": "C", "exp": "First calculate reactances: X_L = 2π(50)(0.25) = 78.54 Ω and X_C = 1/[2π(50)(4 × 10⁻⁵)] = 79.58 Ω. Then Z = √[30² + (78.54 - 79.58)²] = 30.02 Ω. Thus I_rms = V_rms / Z = 120 / 30.02 = 4 A."}, {"n": 58, "section": "CH 11 · ALTERNATING CURRENT", "q": "In a series RLC circuit, R = 50 Ω, X_L = 120 Ω, and X_C = 70 Ω. Calculate the phase angle φ between supply voltage and current.", "opts": ["45°", "30°", "60°", "0°"], "ans": "A", "exp": "The phase angle φ is given by tan φ = (X_L - X_C) / R = (120 - 70) / 50 = 50 / 50 = 1.0. Thus φ = arctan(1.0) = 45° (voltage leads current by 45°)."}, {"n": 59, "section": "CH 11 · ALTERNATING CURRENT", "q": "In a series RLC circuit, if the operating frequency f is greater than the resonant frequency f₀ (f &gt; f₀), how does the circuit behave?", "opts": ["Capacitive (X_C &gt; X_L), so current leads supply voltage.", "Purely resistive (X_L = X_C), so voltage and current are in phase.", "Inductive (X_L &gt; X_C), so supply voltage leads current.", "Zero impedance state with infinite current flow."], "ans": "C", "exp": "Since X_L = 2π f L increases with frequency while X_C = 1/(2π f C) decreases, for f &gt; f₀ we have X_L &gt; X_C. The net reactance is inductive, causing total voltage to lead current."}, {"n": 60, "section": "CH 11 · ALTERNATING CURRENT", "q": "A series RLC circuit has inductance L = 0.1 H and capacitance C = 1 × 10⁻⁵ F. Calculate its resonant frequency f₀.", "opts": ["1000 Hz", "318 Hz", "79.6 Hz", "159 Hz"], "ans": "D", "exp": "Resonant frequency is f₀ = 1 / (2π √(LC)). Substituting L = 0.1 H and C = 1 × 10⁻⁵ F gives √(LC) = 10⁻³ s, so f₀ = 1 / (2π × 10⁻³) = 159 Hz."}, {"n": 61, "section": "CH 11 · ALTERNATING CURRENT", "q": "Which set of conditions correctly describes a series RLC circuit operating at resonance?", "opts": ["Impedance is minimum (Z = R), RMS current is maximum (I_rms = V_rms/R), and power factor cos φ = 1.", "Impedance is maximum, current is zero, and power factor cos φ = 0.", "Inductive reactance X_L is double capacitive reactance X_C.", "Impedance is zero, current is infinite, and power factor is 0.5."], "ans": "A", "exp": "At resonance, X_L = X_C so net reactance (X_L - X_C) = 0. Impedance reaches its minimum value Z = R, yielding maximum current I_rms = V_rms/R and unity power factor cos φ = 1."}, {"n": 62, "section": "CH 11 · ALTERNATING CURRENT", "q": "A series RLC circuit at resonance has V_rms = 10 V, R = 10 Ω, L = 0.2 H, and C = 2 × 10⁻⁶ F. Calculate RMS voltage across the inductor V_L at resonance.", "opts": ["10 V", "316 V", "31.6 V", "100 V"], "ans": "B", "exp": "At resonance, I_rms = V_rms / R = 10 / 10 = 1.0 A. Resonant angular frequency ω₀ = 1 / √(LC) = 1581.1 rad/s. Reactance X_L = ω₀ L = 316.2 Ω. Thus V_L = I_rms X_L = 1.0 × 316.2 = 316 V."}, {"n": 63, "section": "CH 11 · ALTERNATING CURRENT", "q": "An AC circuit supplied by V_rms = 230 V carries RMS current I_rms = 5.0 A with a phase angle φ = 60° between voltage and current. Calculate average real power P.", "opts": ["575 W", "1150 W", "996 W", "288 W"], "ans": "A", "exp": "Average real power in AC circuits is P = V_rms I_rms cos φ. Substituting V_rms = 230 V, I_rms = 5.0 A, and cos(60°) = 0.50 yields P = 230 × 5.0 × 0.50 = 575 W."}, {"n": 64, "section": "CH 11 · ALTERNATING CURRENT", "q": "A coil with resistance R = 30 Ω and inductive reactance X_L = 40 Ω is connected across an AC supply. Calculate the power factor cos φ of the coil.", "opts": ["0.75", "0.80", "0.60", "1.00"], "ans": "C", "exp": "Power factor is cos φ = R / Z. First compute impedance Z = √(R² + X_L²) = √(30² + 40²) = 50 Ω. Thus cos φ = 30 / 50 = 0.60 (lagging)."}, {"n": 65, "section": "CH 11 · ALTERNATING CURRENT", "q": "What is meant by wattless current (idle current) in an AC circuit?", "opts": ["Current lost as leakage through damaged electrical insulation.", "The direct current component produced by rectifying an AC voltage.", "The reactive current component I_rms sin φ that is 90° out of phase with voltage and dissipates zero net average power.", "The peak current flowing through a purely resistive heating element."], "ans": "C", "exp": "In an AC circuit with phase angle φ, the current component I_rms sin φ is 90° out of phase with voltage. Because its average power consumption over a full cycle is zero (P = V_rms I_rms sin φ cos 90° = 0), it is called wattless current."}, {"n": 66, "section": "CH 11 · ALTERNATING CURRENT", "q": "A series RLC circuit has R = 10 Ω, L = 0.2 H, and C = 5 × 10⁻⁶ F. Calculate the Quality factor Q of the circuit.", "opts": ["2", "200", "0.05", "20"], "ans": "D", "exp": "Quality factor of a series resonant circuit is Q = (1/R) √(L/C). Substituting values: √(0.20 / 5 × 10⁻⁶) = √40000 = 200 Ω. Thus Q = 200 / 10 = 20."}, {"n": 67, "section": "CH 11 · ALTERNATING CURRENT", "q": "A resonant RLC circuit has a resonant frequency f₀ = 1000 Hz and a Quality factor Q = 25. Calculate the bandwidth Δf of the resonance curve.", "opts": ["40 Hz", "2.5 × 10⁴ Hz", "250 Hz", "2.5 × 10⁻² Hz"], "ans": "A", "exp": "Bandwidth Δf is related to resonant frequency f₀ and Quality factor Q by Δf = f₀ / Q. Substituting f₀ = 1000 Hz and Q = 25 gives Δf = 1000 / 25 = 40 Hz."}, {"n": 68, "section": "CH 11 · ALTERNATING CURRENT", "q": "An ideal step-down transformer has primary turns N_p = 1200 and secondary turns N_s = 60. Primary voltage is V_p = 240 V. If secondary load draws current I_s = 10 A, calculate secondary voltage V_s and primary current I_p.", "opts": ["V_s = 12 V, I_p = 200 A", "V_s = 4800 V, I_p = 0.5 A", "V_s = 12 V, I_p = 0.5 A", "V_s = 12 V, I_p = 10 A"], "ans": "C", "exp": "For an ideal transformer, V_s / V_p = N_s / N_p, so V_s = 240 × (60 / 1200) = 12 V. Power conservation (V_p I_p = V_s I_s) gives I_p = I_s (N_s / N_p) = 10 × (60 / 1200) = 0.5 A."}, {"n": 69, "section": "CH 11 · ALTERNATING CURRENT", "q": "A transformer absorbs input power P_in = 5000 W. The secondary delivers current I_s = 20 A at V_s = 220 V to a resistive load. Calculate transformer efficiency η.", "opts": ["94%", "88%", "80%", "100%"], "ans": "B", "exp": "Output power is P_out = V_s I_s cos φ = 220 V × 20 A × 1.0 = 4400 W. Efficiency is η = (P_out / P_in) × 100% = (4400 / 5000) × 100% = 88%."}, {"n": 70, "section": "CH 11 · ALTERNATING CURRENT", "q": "How are eddy current energy losses in a transformer iron core minimized?", "opts": ["By replacing the iron core with a solid block of pure copper.", "By increasing the alternating current frequency in primary windings.", "By constructing the core out of thin insulated laminations of high-resistivity silicon steel.", "By winding primary and secondary coils in opposing directions."], "ans": "C", "exp": "Changing magnetic flux induces circulating eddy currents in the core. Laminating the core into thin insulated steel sheets restricts current paths, vastly reducing I²R eddy current power losses."}, {"n": 71, "section": "CH 11 · ALTERNATING CURRENT", "q": "Why is electric power transmitted over long grid distances at extremely high voltages using step-up transformers?", "opts": ["Stepping up voltage increases current, allowing thinner wire conductors.", "Stepping up voltage reduces line current I, which dramatically decreases I²R heat losses in transmission lines.", "High voltage completely eliminates electrical resistance in power cables.", "It converts AC power into high-frequency DC transmission signals."], "ans": "B", "exp": "For transmitted power P = V I, stepping up voltage V reduces line current I proportionally. Because line power dissipation is P_loss = I² R, reducing current by a factor of 10 reduces energy loss by a factor of 100."}, {"n": 72, "section": "CH 11 · ALTERNATING CURRENT", "q": "A half-wave rectifier is supplied by AC peak voltage V₀ = 50 V at frequency f = 50 Hz. Calculate average DC output voltage V_dc (ideal diode) and output ripple frequency f_out.", "opts": ["V_dc = 31.8 V, f_out = 100 Hz", "V_dc = 35.4 V, f_out = 50 Hz", "V_dc = 15.9 V, f_out = 100 Hz", "V_dc = 15.9 V, f_out = 50 Hz"], "ans": "D", "exp": "For a half-wave rectifier, average DC voltage is V_dc = V₀ / π = 50 / π = 15.9 V. Because only one half-cycle conducts per period, output ripple frequency equals input frequency f_out = 50 Hz."}, {"n": 73, "section": "CH 11 · ALTERNATING CURRENT", "q": "A full-wave bridge rectifier is supplied by AC peak voltage V₀ = 100 V at frequency f = 60 Hz. Calculate average DC output voltage V_dc (ideal diodes) and output ripple frequency f_out.", "opts": ["V_dc = 31.8 V, f_out = 60 Hz", "V_dc = 63.7 V, f_out = 120 Hz", "V_dc = 70.7 V, f_out = 120 Hz", "V_dc = 63.7 V, f_out = 60 Hz"], "ans": "B", "exp": "A full-wave rectifier converts both half-cycles, giving average voltage V_dc = 2 V₀ / π = 200 / π = 63.7 V. Since two output voltage pulses occur per input cycle, ripple frequency is doubled: f_out = 2 × 60 = 120 Hz."}, {"n": 74, "section": "CH 11 · ALTERNATING CURRENT", "q": "What is the required Peak Inverse Voltage (PIV) rating for diodes in a full-wave center-tapped transformer rectifier versus a full-wave bridge rectifier (secondary peak voltage V₀)?", "opts": ["Center-tapped: V₀; Bridge rectifier: 2 V₀.", "Both center-tapped and bridge rectifiers require PIV = 0.5 V₀.", "Center-tapped: 2 V₀; Bridge rectifier: V₀.", "Center-tapped: V₀ / √2; Bridge rectifier: V₀ / √2."], "ans": "C", "exp": "In a center-tapped full-wave rectifier, each non-conducting diode experiences a maximum reverse voltage equal to the full secondary voltage span (2 V₀). In a bridge rectifier, non-conducting diodes experience a peak reverse voltage of V₀."}, {"n": 75, "section": "CH 11 · ALTERNATING CURRENT", "q": "What is the primary function of connecting a large filter capacitor in parallel with the load resistor at the output of a rectifier circuit?", "opts": ["It charges during peak rectifier voltage and discharges through the load during valleys, smoothing out AC ripple to produce steady DC.", "It increases the AC frequency of the output voltage by a factor of two.", "It steps up the RMS voltage by a factor of √2.", "It acts as a short circuit to eliminate all DC voltage."], "ans": "A", "exp": "A filter capacitor stores electrical energy during input voltage peaks and discharges energy through the load when rectifier voltage drops, drastically smoothing output voltage fluctuations (ripple) to yield steady DC."}]},
