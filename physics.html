*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

<script>
var QUIZZES={
 p1:{title:"Electric Charge, Potential & Field",desc:"Coulomb's law, fields, potential, dipoles, induced charges",color:"#F59E0B",icon:"&#9889;",data:[{"n": 1, "section": "CH 1 · ELECTRIC CHARGE, POTENTIAL & FIELD", "q": "According to the principle of charge quantization, the net electric charge on any observable macroscopic or microscopic object must be an integer multiple of what fundamental constant?", "opts": ["1.6 × 10⁻¹⁹ C", "8.99 × 10⁹ C", "8.85 × 10⁻¹² C", "9.11 × 10⁻³¹ C"], "ans": "A", "exp": "Electric charge is quantized in integer multiples of the elementary charge e = 1.6 × 10⁻¹⁹ C. Any net charge q can be written as q = ±n e, where n is an integer."}, {"n": 2, "section": "CH 1 · ELECTRIC CHARGE, POTENTIAL & FIELD", "q": "Two point charges q₁ = +4.0 µC and q₂ = -6.0 µC are placed in vacuum separated by a distance of 0.5 m. Calculate the magnitude of the electrostatic force between them.", "opts": ["0.431 N", "0.863 N", "0.216 N", "8.63 N"], "ans": "B", "exp": "Using Coulomb's law: F = k |q₁ q₂| / r² = (8.99 × 10⁹ N·m²/C²)(4.0 × 10⁻⁶ C)(6.0 × 10⁻⁶ C) / (0.5 m)² = 0.863 N."}, {"n": 3, "section": "CH 1 · ELECTRIC CHARGE, POTENTIAL & FIELD", "q": "What is the primary physical reason metallic conductors are good electrical conductors compared to electrical insulators?", "opts": ["Metals contain only positive ions that carry current across the lattice.", "Metals have no atomic nuclei to impede electron flow.", "Metals contain a large density of free (delocalized) electrons that move easily through the crystal lattice.", "Insulators have no electrons in their atomic structure."], "ans": "C", "exp": "In metallic bonding, outer valence electrons are not bound to individual atoms but form a 'sea' of free conduction electrons. Insulators have tightly bound valence electrons that cannot move freely."}, {"n": 4, "section": "CH 1 · ELECTRIC CHARGE, POTENTIAL & FIELD", "q": "An initially neutral metal sphere loses 5 × 10¹² electrons due to friction. What is the net electric charge of the sphere?", "opts": ["-8.01 × 10⁻⁷ C", "3.12 × 10³¹ C", "8.01 × 10⁻¹⁹ C", "8.01 × 10⁻⁷ C"], "ans": "D", "exp": "Loss of electrons results in a net positive charge q = +N e = (5 × 10¹²) × (1.6 × 10⁻¹⁹ C) = 8.01 × 10⁻⁷ C."}, {"n": 5, "section": "CH 1 · ELECTRIC CHARGE, POTENTIAL & FIELD", "q": "Why are fuel transport trucks equipped with a conductive grounding wire connected to the earth before fuel transfer begins?", "opts": ["To safely bleed off accumulated static charge to the ground and prevent sparks that could ignite flammable vapors.", "To increase the electrical resistance of the truck body frame.", "To charge the fuel tank negatively to improve fluid flow rate.", "To attract ambient lightning strikes away from the storage tanks."], "ans": "A", "exp": "Friction between flowing fuel and pipes generates static charge. Grounding provides a safe low-resistance path to discharge static electricity to Earth, avoiding explosive electrostatic sparks."}, {"n": 6, "section": "CH 1 · ELECTRIC CHARGE, POTENTIAL & FIELD", "q": "Calculate the magnitude of the electric field at a distance r = 0.4 m from a point charge q = +3.2 nC in vacuum.", "opts": ["71.9 N/C", "180 N/C", "11.5 N/C", "2.23 × 10⁻¹⁸ N/C"], "ans": "B", "exp": "The electric field of a point charge is given by E = k q / r² = (8.99 × 10⁹ N·m²/C²)(3.2 × 10⁻⁹ C) / (0.4 m)² = 180 N/C."}, {"n": 7, "section": "CH 1 · ELECTRIC CHARGE, POTENTIAL & FIELD", "q": "A positively charged glass rod is brought near an isolated, uncharged metal sphere without making physical contact. What occurs on the sphere?", "opts": ["The sphere acquires a net negative charge overall without touching.", "Positive atomic nuclei move toward the rod while electrons move away.", "Free electrons move toward the near side, leaving a positive charge on the far side and polarizing the sphere.", "The sphere remains completely unpolarized because there is no direct contact."], "ans": "C", "exp": "The positive rod attracts mobile free electrons toward the side closest to the rod. This leaves an equal uncompensated positive charge on the far side, resulting in electrostatic induction (polarization)."}, {"n": 8, "section": "CH 1 · ELECTRIC CHARGE, POTENTIAL & FIELD", "q": "An electron (mₑ = 9.11 × 10⁻³¹ kg, q = -e) is released from rest in a uniform electric field of magnitude E = 500.0 N/C. Calculate the magnitude of its acceleration.", "opts": ["4.8 × 10¹⁰ m/s²", "1.14 × 10⁻¹⁴ m/s²", "5.49 × 10³² m/s²", "8.79 × 10¹³ m/s²"], "ans": "D", "exp": "Newton's second law gives F = mₑ a = e E, so a = e E / mₑ = (1.6 × 10⁻¹⁹ C)(500.0 N/C) / (9.11 × 10⁻³¹ kg) = 8.79 × 10¹³ m/s²."}, {"n": 9, "section": "CH 1 · ELECTRIC CHARGE, POTENTIAL & FIELD", "q": "Which of the following statements regarding electric field lines is INCORRECT?", "opts": ["Electric field lines can cross each other at points where the electric field magnitude is zero.", "Electric field lines originate on positive charges and terminate on negative charges.", "The tangent to an electric field line at any point indicates the direction of the electric field vector E.", "The number of field lines per unit area perpendicular to the lines is proportional to the electric field magnitude."], "ans": "A", "exp": "Electric field lines can NEVER cross. If two lines crossed, the electric field vector at the point of intersection would have two different directions simultaneously, which is physically impossible."}, {"n": 10, "section": "CH 1 · ELECTRIC CHARGE, POTENTIAL & FIELD", "q": "Find the electric potential V at a distance r = 0.2 m from a point charge q = -8.0 nC (taking V = 0 at infinity).", "opts": ["-1800 V", "-360 V", "360 V", "-3.54 × 10⁻¹⁹ V"], "ans": "B", "exp": "The electric potential of a point charge is V = k q / r = (8.99 × 10⁹ N·m²/C²)(-8.0 × 10⁻⁹ C) / (0.2 m) = -360 V."}, {"n": 11, "section": "CH 1 · ELECTRIC CHARGE, POTENTIAL & FIELD", "q": "If the electric potential V throughout a certain three-dimensional region of space is constant at 50 V, what is the electric field magnitude E in that region?", "opts": ["50 N/C", "25 N/C", "0 N/C", "500 N/C"], "ans": "C", "exp": "The electric field is related to potential by E = -dV/dr. Since the potential is constant, its spatial derivative is zero, so E = 0 N/C throughout the region."}, {"n": 12, "section": "CH 1 · ELECTRIC CHARGE, POTENTIAL & FIELD", "q": "Two large parallel conducting plates are separated by d = 0.025 m and maintained at a potential difference ΔV = 150.0 V. Determine the magnitude of the uniform electric field E between the plates.", "opts": ["3.75 V/m", "2.4 × 10⁵ V/m", "75 V/m", "6000 V/m"], "ans": "D", "exp": "In a uniform electric field, the field strength is E = ΔV / d = 150.0 V / 0.025 m = 6000 V/m."}, {"n": 13, "section": "CH 1 · ELECTRIC CHARGE, POTENTIAL & FIELD", "q": "When a positive test charge is moved by an external agent in the direction OPPOSITE to an electric field line, what happens to its electric potential energy?", "opts": ["Its electric potential energy increases because positive work is done by the external agent against the electric field.", "Its electric potential energy decreases because it moves toward lower electric potential.", "Its electric potential energy remains constant because the electric field strength is uniform.", "Its electric potential energy drops to zero immediately upon moving opposite to the field."], "ans": "A", "exp": "Moving a positive charge against the electric field (toward higher potential) requires an external force doing positive work. This work is stored as an increase in electric potential energy (ΔU = q ΔV &gt; 0)."}, {"n": 14, "section": "CH 1 · ELECTRIC CHARGE, POTENTIAL & FIELD", "q": "How much work W must an external agent do to move a point charge q = +2.5 µC through a potential difference ΔV = 80.0 V at constant speed?", "opts": ["3.13 × 10⁻⁸ J", "2 × 10⁻⁴ J", "3.2 × 10⁷ J", "0.016 J"], "ans": "B", "exp": "Work done by an external agent is W = q ΔV = (2.5 × 10⁻⁶ C)(80.0 V) = 2 × 10⁻⁴ J."}, {"n": 15, "section": "CH 1 · ELECTRIC CHARGE, POTENTIAL & FIELD", "q": "On the axis of a thin, uniformly charged ring of total charge Q and radius R, what are the values of the electric field magnitude E and electric potential V at the exact geometric center of the ring (z = 0)?", "opts": ["E = k Q / R² and V = 0", "E = 0 and V = 0", "E = 0 and V = k Q / R", "E = k Q / R² and V = k Q / R"], "ans": "C", "exp": "By symmetry, electric field contributions from opposite segments of the ring cancel at the center, so E = 0. Potential is a scalar sum and every charge element dq is at distance R from the center, so V = ∫ k dq / R = k Q / R."}, {"n": 16, "section": "CH 1 · ELECTRIC CHARGE, POTENTIAL & FIELD", "q": "A proton (mₚ = 1.67 × 10⁻²⁷ kg, q = +e) is accelerated from rest through a potential difference ΔV = 500.0 V. Calculate its final speed v.", "opts": ["2.19 × 10⁵ m/s", "1.33 × 10⁷ m/s", "9.59 × 10¹⁰ m/s", "3.1 × 10⁵ m/s"], "ans": "D", "exp": "By conservation of energy, ½ mₚ v² = e ΔV ⇒ v = √(2 e ΔV / mₚ) = √(2 × (1.6 × 10⁻¹⁹ C) × 500.0 V / 1.67 × 10⁻²⁷ kg) = 3.1 × 10⁵ m/s."}, {"n": 17, "section": "CH 1 · ELECTRIC CHARGE, POTENTIAL & FIELD", "q": "An electric dipole consists of two equal and opposite charges (+q and -q) separated by distance d. What is the magnitude and direction of the electric dipole moment vector p?", "opts": ["Magnitude p = q d, pointing from the negative charge to the positive charge.", "Magnitude p = q d, pointing from the positive charge to the negative charge.", "Magnitude p = q / d, pointing from the negative charge to the positive charge.", "Magnitude p = 2 q d, pointing in the direction of the external electric field."], "ans": "A", "exp": "By convention, the electric dipole moment vector p has magnitude p = q d and points directed from the negative charge (-q) toward the positive charge (+q)."}, {"n": 18, "section": "CH 1 · ELECTRIC CHARGE, POTENTIAL & FIELD", "q": "An electric dipole with dipole moment p = 4 × 10⁻²⁹ C·m is placed in a uniform electric field E = 5 × 10⁴ N/C at an angle of 30.0° to the field lines. Calculate the magnitude of the torque τ acting on the dipole.", "opts": ["1.73 × 10⁻²⁴ N·m", "1 × 10⁻²⁴ N·m", "2 × 10⁻²⁴ N·m", "8 × 10⁻³⁴ N·m"], "ans": "B", "exp": "Torque on a dipole is τ = p E sin θ = (4 × 10⁻²⁹ C·m)(5 × 10⁴ N/C) sin(30.0°) = 1 × 10⁻²⁴ N·m."}, {"n": 19, "section": "CH 1 · ELECTRIC CHARGE, POTENTIAL & FIELD", "q": "At what orientation relative to a uniform electric field E does an electric dipole achieve its MINIMUM (most stable) potential energy U?", "opts": ["When the dipole moment vector p is anti-parallel to the electric field (θ = 180°).", "When the dipole moment vector p is perpendicular to the electric field (θ = 90°).", "When the dipole moment vector p is parallel to the electric field (θ = 0°).", "The potential energy is constant and independent of the dipole angle θ."], "ans": "C", "exp": "Potential energy of a dipole is U = -p · E = -p E cos θ. When θ = 0°, cos(0°) = 1, so U = -p E (the minimum possible potential energy, corresponding to stable equilibrium)."}, {"n": 20, "section": "CH 1 · ELECTRIC CHARGE, POTENTIAL & FIELD", "q": "Two identical positive point charges q₁ = q₂ = +4.0 nC are placed on the x-axis at x = 0 m and x = 2.0 m, respectively. What is the magnitude of the net electric field at the midpoint x = 1.0 m?", "opts": ["71.9 N/C", "36 N/C", "144 N/C", "0 N/C"], "ans": "D", "exp": "By superposition, the electric field from q₁ points in the +x direction and the field from q₂ points in the -x direction. Since the charges and distances are identical, the two field vectors have equal magnitude and cancel out completely, giving E_net = 0 N/C."}, {"n": 21, "section": "CH 1 · ELECTRIC CHARGE, POTENTIAL & FIELD", "q": "How does the magnitude of the electric field E depend on distance r from an infinitely long line of charge with uniform linear charge density λ?", "opts": ["E is inversely proportional to r (E ∝ 1/r).", "E is inversely proportional to r² (E ∝ 1/r²).", "E is independent of distance r (E = constant).", "E is directly proportional to r (E ∝ r)."], "ans": "A", "exp": "Applying Gauss's law to a cylindrical Gaussian surface yields E = λ / (2 π ε₀ r) = 2 k λ / r, showing that E varies inversely with distance r (E ∝ 1/r)."}, {"n": 22, "section": "CH 1 · ELECTRIC CHARGE, POTENTIAL & FIELD", "q": "In a certain region of space, the electric potential is given by V(x) = 5x² - 3x + 10 (where V is in volts and x is in meters). Calculate the magnitude of the electric field at x = 2.0 m.", "opts": ["17 V/m (var 1)", "17 V/m", "24 V/m", "20 V/m"], "ans": "B", "exp": "The electric field component is E_x = -dV/dx = -(10x - 3). Evaluating at x = 2.0 m gives E_x = -(10(2.0) - 3) = -17 V/m, corresponding to a magnitude of 17 V/m."}, {"n": 23, "section": "CH 1 · ELECTRIC CHARGE, POTENTIAL & FIELD", "q": "When a conductor is in electrostatic equilibrium, which of the following statements correctly describes its internal electric field E and internal electric potential V?", "opts": ["The electric field inside is maximum, and the electric potential is zero everywhere.", "Both the electric field and electric potential inside are zero everywhere.", "The electric field inside is zero everywhere, and the electric potential is uniform throughout its volume.", "The electric field inside is constant non-zero, and the potential varies linearly with position."], "ans": "C", "exp": "In electrostatic equilibrium, mobile charges redistribute so that E = 0 inside the conductor. Since E = -dV/dr = 0, the electric potential V is constant throughout the volume of the conductor."}, {"n": 24, "section": "CH 1 · ELECTRIC CHARGE, POTENTIAL & FIELD", "q": "A point charge Q = +5.0 nC is fixed at the origin. Calculate the potential difference V_A - V_B between point A (at r_A = 0.1 m) and point B (at r_B = 0.5 m).", "opts": ["-360 V", "4310 V", "539 V", "360 V"], "ans": "D", "exp": "V_A = k Q / r_A = (8.99 × 10⁹)(5.0 × 10⁻⁹) / 0.1 = 449 V. V_B = k Q / r_B = (8.99 × 10⁹)(5.0 × 10⁻⁹) / 0.5 = 89.9 V. Thus V_A - V_B = 449 - 89.9 = 360 V."}, {"n": 25, "section": "CH 1 · ELECTRIC CHARGE, POTENTIAL & FIELD", "q": "How much work must an external agent do to rotate an electric dipole of moment p = 2 × 10⁻³⁰ C·m in a uniform field E = 4 × 10⁵ N/C from θ₁ = 0° (parallel) to θ₂ = 180° (anti-parallel)?", "opts": ["1.6 × 10⁻²⁴ J", "8 × 10⁻²⁵ J", "0 J", "-1.6 × 10⁻²⁴ J"], "ans": "A", "exp": "Work W = ΔU = U(180°) - U(0°) = (-p E cos 180°) - (-p E cos 0°) = p E - (-p E) = 2 p E = 2(2 × 10⁻³⁰ C·m)(4 × 10⁵ N/C) = 1.6 × 10⁻²⁴ J."}]},
 p2:{title:"Gauss's Law & Potential",desc:"Electric flux, Gauss applications, conductors, cavities",color:"#10B981",icon:"&#128737;",data:[{"n": 26, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "A flat surface of area A = 0.5 m² is placed in a uniform electric field E = 400.0 N/C. If the normal to the surface makes an angle of 60.0° with the field lines, calculate the electric flux Φ_E through the surface.", "opts": ["173 N·m²/C", "100 N·m²/C", "200 N·m²/C", "800 N·m²/C"], "ans": "B", "exp": "Electric flux is given by Φ_E = E A cos θ = (400.0 N/C)(0.5 m²) cos(60.0°) = 100 N·m²/C."}, {"n": 27, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "According to Gauss's Law, the total net electric flux Φ_E through any arbitrary closed Gaussian surface is directly proportional to what physical quantity?", "opts": ["The total surface area and geometric shape of the Gaussian surface.", "The external electric charges located outside the Gaussian surface.", "The total net electric charge enclosed within the closed surface divided by ε₀.", "The distance from the center of the surface to the nearest external charge."], "ans": "C", "exp": "Gauss's law states that Φ_E = ∮ E · dA = q_enclosed / ε₀. The net flux depends solely on the net charge inside the closed surface, independent of the shape or size of the surface."}, {"n": 28, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "A closed Gaussian surface encloses three point charges: q₁ = +5.0 nC, q₂ = -2.0 nC, and q₃ = +6.0 nC. A fourth charge q₄ = -10.0 nC lies outside the surface. Calculate the net electric flux Φ_E through the surface.", "opts": ["-113 N·m²/C", "1470 N·m²/C", "7.97 × 10⁻²⁰ N·m²/C", "1020 N·m²/C"], "ans": "D", "exp": "Net enclosed charge q_enc = q₁ + q₂ + q₃ = 5.0 - 2.0 + 6.0 = +9.0 nC = 9.0 × 10⁻⁹ C. By Gauss's Law, Φ_E = q_enc / ε₀ = (9.0 × 10⁻⁹ C) / (8.85 × 10⁻¹² C²/(N·m²)) = 1020 N·m²/C."}, {"n": 29, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "What is the magnitude and direction of the electric field E just outside the surface of a conductor in electrostatic equilibrium carrying surface charge density σ?", "opts": ["E = σ / ε₀, directed perpendicular to the conductor surface.", "E = σ / (2 ε₀), directed parallel to the conductor surface.", "E = 2 σ / ε₀, directed at 45° to the conductor surface.", "E = 0, because electric fields cannot exist near metal surfaces."], "ans": "A", "exp": "Applying Gauss's law to a small cylindrical Gaussian pillbox straddling the conductor surface yields E = σ / ε₀. The field must be perpendicular to the surface in electrostatic equilibrium, otherwise surface charges would experience tangential forces and move."}, {"n": 30, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "An infinitely long straight line carries a uniform linear charge density λ = 4 × 10⁻⁸ C/m. Calculate the magnitude of the electric field E at a perpendicular distance r = 0.2 m from the line.", "opts": ["1800 N/C", "3600 N/C", "1.8 × 10⁴ N/C", "8990 N/C"], "ans": "B", "exp": "Using Gauss's law for an infinite line of charge: E = λ / (2 π ε₀ r) = 2 k λ / r = 2(8.99 × 10⁹)(4 × 10⁻⁸) / 0.2 = 3600 N/C."}, {"n": 31, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "A point charge +Q is placed inside the uncharged cavity of an isolated neutral hollow conducting sphere. What net charges are induced on the inner cavity surface and the outer surface of the shell, respectively?", "opts": ["Inner surface has charge +Q, outer surface has charge -Q.", "Inner surface has charge -Q, outer surface has charge 0.", "Inner surface has charge -Q, outer surface has charge +Q.", "Inner surface has charge 0, outer surface has charge +Q."], "ans": "C", "exp": "To ensure E = 0 within the conductor material, a Gaussian surface inside the conductor must enclose zero net charge, so -Q is induced on the inner cavity wall. Since the conductor is neutral overall, charge conservation leaves +Q on the outer surface."}, {"n": 32, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "An infinite non-conducting sheet carries a uniform surface charge density σ = 3.5 × 10⁻⁸ C/m². Determine the magnitude of the electric field E near the sheet.", "opts": ["3950 N/C", "198 N/C", "2.53 × 10⁻⁴ N/C", "1980 N/C"], "ans": "D", "exp": "Using Gauss's law for an infinite thin non-conducting sheet: E = σ / (2 ε₀) = (3.5 × 10⁻⁸) / (2 × 8.85 × 10⁻¹²) = 1980 N/C."}, {"n": 33, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "For a solid insulating sphere of radius R carrying a total charge Q distributed uniformly throughout its volume, how does the electric field magnitude E vary with radial distance r inside the sphere (r &lt; R)?", "opts": ["E is directly proportional to r (E ∝ r).", "E is inversely proportional to r² (E ∝ 1/r²).", "E is zero everywhere inside the sphere (E = 0).", "E is constant and independent of r (E = k Q / R²)."], "ans": "A", "exp": "Using Gauss's law with a spherical Gaussian surface of radius r &lt; R, enclosed charge is q_enc = Q (r³/R³). Thus 4 π r² E = Q r³ / (ε₀ R³), which simplifies to E = k Q r / R³. Hence E ∝ r."}, {"n": 34, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "A solid insulating sphere of radius R = 0.1 m has a total charge Q = +8.0 nC distributed uniformly throughout its volume. Calculate the electric field E at a distance r = 0.05 m from the center.", "opts": ["2.88 × 10⁴ N/C", "3600 N/C", "7190 N/C", "0 N/C"], "ans": "B", "exp": "Inside a uniformly charged sphere (r &lt; R): E = k Q r / R³ = (8.99 × 10⁹)(8.0 × 10⁻⁹ C)(0.05 m) / (0.1 m)³ = 3600 N/C."}, {"n": 35, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "A solid conducting sphere of radius R carries a net charge Q. What is the electric potential V at any point inside the sphere at distance r = R/2 from the center (with V = 0 at infinity)?", "opts": ["V = 0", "V = k Q / (2 R)", "V = k Q / R (equal to the potential at the surface).", "V = 2 k Q / R"], "ans": "C", "exp": "Because E = 0 inside a conductor, no work is done moving a charge anywhere within the conductor. The entire conductor is an equipotential volume, so V inside equals V at the surface: V = k Q / R."}, {"n": 36, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "A solid conducting sphere of radius R = 0.15 m carries a charge Q = +12.0 nC. What is the electric potential V at a point r = 0.1 m from the center (inside the sphere)?", "opts": ["1080 V", "0 V", "4790 V", "719 V"], "ans": "D", "exp": "Since the sphere is a conductor, the potential at any interior point (r = 0.1 m &lt; R) is equal to the potential at the surface: V = k Q / R = (8.99 × 10⁹)(12.0 × 10⁻⁹ C) / (0.15 m) = 719 V."}, {"n": 37, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "A single point charge +q is located at the exact geometric center of a cube of edge length L. What is the electric flux Φ_E through ONE face of the cube?", "opts": ["q / (6 ε₀)", "q / ε₀", "q / (4 ε₀)", "q / (12 ε₀)"], "ans": "A", "exp": "By Gauss's law, total flux through all 6 faces of the closed cube is Φ_total = q / ε₀. By symmetry, the flux is shared equally among the 6 identical faces, so flux through one face is Φ_face = q / (6 ε₀)."}, {"n": 38, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "Two large parallel conducting plates carry equal and opposite uniform surface charge densities σ = +8.85 × 10⁻⁹ C/m² and -σ. Calculate the magnitude of the electric field E in the region between the plates.", "opts": ["500 N/C", "1000 N/C", "0 N/C", "2000 N/C"], "ans": "B", "exp": "Each plate contributes E_single = σ / (2 ε₀) in the same direction between the plates. Superposition gives E_total = σ / (2 ε₀) + σ / (2 ε₀) = σ / ε₀ = (8.85 × 10⁻⁹) / (8.85 × 10⁻¹²) = 1000 N/C."}, {"n": 39, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "What physical mechanism enables a hollow metal enclosure (Faraday cage) to completely shield its inner cavity from external electrostatic fields?", "opts": ["The conductor absorbs external electric field lines and transforms them into static magnetic field lines.", "Air inside the cavity acts as a perfect electrical insulator that physically blocks incoming electric field vectors.", "Free charges on the conductor surface redistribute to create an internal field that exactly cancels the external field inside the cavity.", "The metal shell raises the absolute electric potential of the interior to infinity, driving field lines outward."], "ans": "C", "exp": "When an external electric field is applied, free electrons in the metallic shell rapidly move until the internal induced field perfectly opposes the external field. Consequently, E = 0 inside the cavity."}, {"n": 40, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "An infinite straight line charge has linear charge density λ = 2 × 10⁻⁸ C/m. Calculate the potential difference V(r₁) - V(r₂) between point 1 at r₁ = 0.1 m and point 2 at r₂ = 0.3 m.", "opts": ["172 V", "2400 V", "197 V", "395 V"], "ans": "D", "exp": "The potential difference near an infinite line charge is ΔV = (λ / 2π ε₀) ln(r₂/r₁) = 2 k λ ln(r₂/r₁) = 2(8.99 × 10⁹)(2 × 10⁻⁸) ln(0.3/0.1) = 395 V."}, {"n": 41, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "While Gauss's Law is mathematically valid for any closed surface around any charge distribution, under what condition is it most practical for calculating electric field magnitudes directly?", "opts": ["When the charge distribution possesses high geometric symmetry (spherical, cylindrical, or planar).", "When the charge distribution consists exclusively of negative charges.", "When the surrounding space has zero electrical permittivity.", "When the electric potential is constant throughout the universe."], "ans": "A", "exp": "Gauss's law allows direct calculation of E when symmetry permits choosing a Gaussian surface over which |E| is constant and E is everywhere parallel or perpendicular to dA, allowing ∮ E · dA to simplify to E A."}, {"n": 42, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "A solid conducting sphere of radius r₁ = 0.05 m carries charge Q₁ = +3.0 nC. It is surrounded by a concentric thin conducting shell of radius r₂ = 0.10 m carrying charge Q₂ = -5.0 nC. Calculate the electric field magnitude E at r = 0.15 m from the center.", "opts": ["1200 N/C", "799 N/C", "3200 N/C", "0 N/C"], "ans": "B", "exp": "At r = 0.15 m (outside both sphere and shell), the enclosed charge is q_enc = Q₁ + Q₂ = +3.0 - 5.0 = -2.0 nC. By Gauss's Law: E = k |q_enc| / r² = (8.99 × 10⁹)(2.0 × 10⁻⁹ C) / (0.15 m)² = 799 N/C."}, {"n": 43, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "What is the total electrostatic potential energy U required to assemble a thin spherical shell of radius R carrying a total charge Q uniformly distributed over its surface?", "opts": ["U = k Q² / R", "U = 3 k Q² / (5 R)", "U = k Q² / (2 R)", "U = k Q / R²"], "ans": "C", "exp": "The energy stored in assembling the shell is U = ½ Q V_surface, where V_surface = k Q / R. Substituting V gives U = ½ Q (k Q / R) = k Q² / (2 R)."}, {"n": 44, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "A uniform electric field E = 300.0 N/C is parallel to the axis of an open hemispherical surface of radius R = 0.2 m. Calculate the electric flux Φ_E passing through the curved hemispherical surface.", "opts": ["75.4 N·m²/C", "151 N·m²/C", "0 N·m²/C", "37.7 N·m²/C"], "ans": "D", "exp": "Since no charge is enclosed between the open hemisphere and its flat circular base, the flux through the open hemisphere equals the flux through its flat base of area A = π R²: Φ_E = E (π R²) = (300.0)(π × 0.2²) = 37.7 N·m²/C."}, {"n": 45, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "A point charge +q is placed off-center inside the cavity of an uncharged thick spherical conducting shell. How is charge distributed on the OUTER surface of the conducting shell?", "opts": ["Uniformly distributed over the outer surface regardless of the position of q inside the cavity.", "Concentrated primarily on the side of the outer surface closest to q.", "Zero charge exists on the outer surface because the shell is uncharged.", "Concentrated on the side of the outer surface farthest from q."], "ans": "A", "exp": "The conductor shields the outer surface from the internal position of charge q. A total charge +q is forced to the outer surface, and spherical symmetry of the outer shell forces it to spread uniformly."}, {"n": 46, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "A isolated conducting sphere of radius R = 0.08 m is charged to an electric potential V = 450.0 V at its surface. Calculate its surface charge density σ.", "opts": ["3.98 × 10⁻⁹ C/m²", "4.98 × 10⁻⁸ C/m²", "6.23 × 10⁻⁷ C/m²", "3.19 × 10⁻¹⁰ C/m²"], "ans": "B", "exp": "Surface potential V = k Q / R = Q / (4π ε₀ R). Total charge Q = 4π ε₀ R V. Surface charge density σ = Q / (4π R²) = ε₀ V / R = (8.85 × 10⁻¹²)(450.0) / 0.08 = 4.98 × 10⁻⁸ C/m²."}, {"n": 47, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "Why can we NOT set the electric potential reference V = 0 at r = ∞ for an infinitely long line of charge?", "opts": ["Because an infinite line of charge carries zero total charge.", "Because the electric field around an infinite line is zero everywhere.", "Because the charge distribution itself extends to infinity, causing the integral for potential difference to diverge at infinity.", "Because infinity is maintained at a positive non-zero potential relative to the line."], "ans": "C", "exp": "Integrating E = λ / (2 π ε₀ r) from r to ∞ yields a logarithmic integral ln(∞), which diverges. Hence, a finite reference radius r₀ must be chosen instead of infinity."}, {"n": 48, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "A long solid conducting cylinder of radius R = 0.04 m carries a uniform linear charge density λ = 6 × 10⁻⁹ C/m. Find the electric field magnitude E at distance r = 0.12 m from the cylinder axis.", "opts": ["0 N/C", "7490 N/C", "2700 N/C", "899 N/C"], "ans": "D", "exp": "Outside a long cylindrical conductor (r &gt; R), Gauss's law gives E = 2 k λ / r = 2(8.99 × 10⁹)(6 × 10⁻⁹) / 0.12 = 899 N/C."}, {"n": 49, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "If the net electric flux Φ_E through a closed surface is zero, which of the following statements MUST be true?", "opts": ["The net electric charge enclosed by the surface is zero.", "The electric field magnitude E is zero at every point on the surface.", "No electric charges exist anywhere inside or outside the surface.", "The surface must be perfectly spherical in shape."], "ans": "A", "exp": "By Gauss's law, Φ_E = q_enclosed / ε₀. If Φ_E = 0, then q_enclosed = 0. This means either no charges are inside, or positive and negative enclosed charges sum to zero."}, {"n": 50, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "A charge q = +3.0 nC is moved a distance of 0.05 m between two points located entirely inside the solid metallic body of a conductor in electrostatic equilibrium. Calculate the work done by the electric field.", "opts": ["539 J", "0 J", "1.62 × 10⁻⁶ J", "3 × 10⁻⁸ J"], "ans": "B", "exp": "Inside the solid body of a conductor in electrostatic equilibrium, the electric field E is zero everywhere. Thus, the electrostatic force F = q E = 0, and the work done by the electric field is W = 0 J."}]},
 p3:{title:"Capacitors & Dielectrics",desc:"Capacitance, series/parallel, energy, dielectric effects",color:"#8B5CF6",icon:"&#128267;",data:[{"n": 51, "section": "CH 3 · CAPACITORS & DIELECTRICS", "q": "A parallel-plate air capacitor has plate area A = 0.04 m² and plate separation d = 1 × 10⁻³ m. Calculate its capacitance C.", "opts": ["3.54 × 10⁻¹⁶ F", "4.52 × 10¹² F", "3.54 × 10⁻¹⁰ F", "3.54 × 10⁻⁷ F"], "ans": "C", "exp": "Capacitance of a parallel plate capacitor in air/vacuum is C = ε₀ A / d = (8.85 × 10⁻¹²)(0.04) / (1 × 10⁻³) = 3.54 × 10⁻¹⁰ F."}, {"n": 52, "section": "CH 3 · CAPACITORS & DIELECTRICS", "q": "How is the electrical capacitance C of any conductor arrangement defined, and what is its SI unit?", "opts": ["Product of charge Q and potential difference V (C = Q V); SI unit is Joule (J).", "Ratio of potential difference V to charge Q (C = V/Q); SI unit is Ohm (Ω).", "Rate of flow of electric charge per unit time (C = dQ/dt); SI unit is Ampere (A).", "Ratio of charge magnitude Q on either conductor to potential difference V between them (C = Q/V); SI unit is Farad (F)."], "ans": "D", "exp": "Capacitance measures a system's ability to store electric charge per unit potential difference: C = Q / V. One Farad equals one Coulomb per Volt (1 F = 1 C/V)."}, {"n": 53, "section": "CH 3 · CAPACITORS & DIELECTRICS", "q": "Two capacitors C₁ = 6.0 µF and C₂ = 12.0 µF are connected in SERIES. Calculate the equivalent capacitance C_eq of the combination.", "opts": ["4 × 10⁻⁶ F", "1.8 × 10⁻⁵ F", "7.2 × 10⁻¹¹ F", "4 × 10⁻¹² F"], "ans": "A", "exp": "For series capacitors: 1/C_eq = 1/C₁ + 1/C₂ ⇒ C_eq = (C₁ C₂) / (C₁ + C₂) = (6.0 × 12.0) / (6.0 + 12.0) µF = 4.0 µF = 4 × 10⁻⁶ F."}, {"n": 54, "section": "CH 3 · CAPACITORS & DIELECTRICS", "q": "Three capacitors C₁ = 2.0 µF, C₂ = 4.5 µF, and C₃ = 3.5 µF are connected in PARALLEL. Calculate the equivalent capacitance C_eq.", "opts": ["9.92 × 10⁻⁷ F", "1 × 10⁻⁵ F", "3.15 × 10⁻¹⁷ F", "3.33 × 10⁻⁶ F"], "ans": "B", "exp": "For parallel capacitors, equivalent capacitance is the direct sum: C_eq = C₁ + C₂ + C₃ = 2.0 + 4.5 + 3.5 = 10.0 µF = 1 × 10⁻⁵ F."}, {"n": 55, "section": "CH 3 · CAPACITORS & DIELECTRICS", "q": "Which set of mathematical expressions correctly represents the electric potential energy U stored in a capacitor of capacitance C carrying charge Q at potential difference V?", "opts": ["U = C V² = Q² / C = Q V", "U = ½ C² V = ½ Q / C² = ½ V / Q", "U = ½ C V² = ½ Q² / C = ½ Q V", "U = 2 C V² = 2 Q² / C = 2 Q V"], "ans": "C", "exp": "The energy stored equals the work done in charging the capacitor: U = ∫ q/C dq = ½ Q² / C. Using Q = C V, this yields U = ½ C V² = ½ Q V."}, {"n": 56, "section": "CH 3 · CAPACITORS & DIELECTRICS", "q": "A 5 × 10⁻⁵ F capacitor is charged to a potential difference of 200.0 V. Calculate the electrical energy U stored in the capacitor.", "opts": ["2 J", "5 × 10⁻³ J", "2.5 × 10⁻⁷ J", "1 J"], "ans": "D", "exp": "Using U = ½ C V² = 0.5 × (5 × 10⁻⁵ F) × (200.0 V)² = 0.5 × (5.0 × 10⁻⁵) × 40000 = 1 J."}, {"n": 57, "section": "CH 3 · CAPACITORS & DIELECTRICS", "q": "A parallel plate capacitor is charged by a battery and then DISCONNECTED. A dielectric slab (κ &gt; 1) is then inserted to completely fill the space between the plates. How do charge Q, capacitance C, voltage V, and stored energy U change?", "opts": ["Q remains constant, C increases, V decreases, and U decreases.", "Q increases, C increases, V remains constant, and U increases.", "Q decreases, C decreases, V increases, and U remains constant.", "Q remains constant, C decreases, V increases, and U increases."], "ans": "A", "exp": "Since the battery is disconnected, charge Q cannot leave the plates (Q constant). Inserting dielectric increases capacitance to C = κ C₀. Voltage drops to V = Q/C = V₀/κ. Stored energy drops to U = Q²/(2C) = U₀/κ."}, {"n": 58, "section": "CH 3 · CAPACITORS & DIELECTRICS", "q": "An air-filled capacitor C₀ = 10.0 µF is charged to V₀ = 100.0 V and then disconnected from the battery. A dielectric material with dielectric constant κ = 4.0 is inserted between the plates. What is the new potential difference V across the capacitor?", "opts": ["400 V", "25 V", "100 V", "6.25 V"], "ans": "B", "exp": "With the battery disconnected, charge Q remains constant while C increases by factor κ (C = κ C₀). New voltage V = Q / C = Q / (κ C₀) = V₀ / κ = 100.0 / 4.0 = 25 V."}, {"n": 59, "section": "CH 3 · CAPACITORS & DIELECTRICS", "q": "A parallel plate capacitor remains CONNECTED to a battery supplying constant voltage V while a dielectric slab (κ &gt; 1) is inserted between its plates. How do voltage V, capacitance C, charge Q, and stored energy U change?", "opts": ["V increases, C remains constant, Q decreases, and U decreases.", "V decreases, C increases, Q remains constant, and U decreases.", "V remains constant, C increases, Q increases, and U increases.", "All four quantities (V, C, Q, U) remain completely unchanged."], "ans": "C", "exp": "Connected to the battery, voltage V is fixed. Inserting the dielectric increases capacitance C = κ C₀. Charge increases to Q = C V = κ Q₀, and stored energy increases to U = ½ C V² = κ U₀."}, {"n": 60, "section": "CH 3 · CAPACITORS & DIELECTRICS", "q": "Calculate the electric energy density u (energy per unit volume) stored in a region of vacuum where a uniform electric field of magnitude E = 3 × 10⁶ V/m exists.", "opts": ["79.7 J/m³", "1.33 × 10⁻⁵ J/m³", "2.66 × 10⁻⁵ J/m³", "39.8 J/m³"], "ans": "D", "exp": "Energy density in an electric field is given by u = ½ ε₀ E² = 0.5 × (8.85 × 10⁻¹²) × (3 × 10⁶)² = 39.8 J/m³."}, {"n": 61, "section": "CH 3 · CAPACITORS & DIELECTRICS", "q": "From a molecular perspective, what occurs inside a non-polar dielectric material when it is placed in an external electric field?", "opts": ["The external field induces electric dipole moments in individual molecules by shifting positive and negative charge centers in opposite directions.", "Molecules ionize completely into free conduction electrons and positive ions.", "Permanent dipoles align strictly anti-parallel to the external electric field.", "Molecules contract in volume without acquiring any net dipole moment."], "ans": "A", "exp": "In a non-polar dielectric, individual molecules have no permanent dipole moment. An applied E field exerts forces in opposite directions on nuclei (+ charge) and electron clouds (- charge), inducing microscopic electric dipoles aligned with the field."}, {"n": 62, "section": "CH 3 · CAPACITORS & DIELECTRICS", "q": "A coaxial cylindrical capacitor has inner conductor radius a = 2 × 10⁻³ m and outer conductor radius b = 5 × 10⁻³ m with length L = 1.0 m. Calculate its capacitance C in vacuum.", "opts": ["1.4 × 10⁻¹⁰ F", "6.07 × 10⁻¹¹ F", "6.07 × 10⁻¹¹ F (var 1)", "9.66 × 10⁻¹² F"], "ans": "B", "exp": "Capacitance of a cylindrical capacitor is C = 2π ε₀ L / ln(b/a) = 2π(8.85 × 10⁻¹²)(1.0) / ln(0.005/0.002) = 6.07 × 10⁻¹¹ F."}, {"n": 63, "section": "CH 3 · CAPACITORS & DIELECTRICS", "q": "What does the term 'dielectric strength' of an insulating material signify in practical capacitor design?", "opts": ["The maximum total electric charge the material can store per cubic meter.", "The ratio of the material's mass density to the density of pure water.", "The maximum electric field magnitude the material can withstand before dielectric breakdown occurs and it becomes conductive.", "The rate at which the material dissipates electrical energy as heat during rapid charging."], "ans": "C", "exp": "Dielectric strength is the maximum electric field E_max an insulator can endure before electrons are stripped from atoms, leading to a discharge spark and breakdown of insulating properties."}, {"n": 64, "section": "CH 3 · CAPACITORS & DIELECTRICS", "q": "A parallel-plate capacitor with plate separation d = 5 × 10⁻⁴ m uses a dielectric material with dielectric strength E_max = 2 × 10⁷ V/m. Calculate the maximum safe operating voltage V_max across the capacitor.", "opts": ["4 × 10¹⁰ V", "5 V", "1.77 × 10⁻⁴ V", "1 × 10⁴ V"], "ans": "D", "exp": "Maximum voltage before breakdown is V_max = E_max d = (2 × 10⁷ V/m)(5 × 10⁻⁴ m) = 1 × 10⁴ V."}, {"n": 65, "section": "CH 3 · CAPACITORS & DIELECTRICS", "q": "Which type of commercial capacitor offers very high capacitance per unit volume using an ultra-thin metallic oxide layer as dielectric, but MUST be connected with correct polarity in circuits?", "opts": ["Electrolytic capacitor", "Ceramic capacitor", "Mica capacitor", "Air variable capacitor"], "ans": "A", "exp": "Electrolytic capacitors utilize an extremely thin anodized oxide layer formed electrolytically. Because the oxide layer breaks down if reverse-biased, they are polarized and must be connected with correct polarity."}, {"n": 66, "section": "CH 3 · CAPACITORS & DIELECTRICS", "q": "Capacitor C₁ = 6.0 µF is connected in series with a parallel pair of capacitors C₂ = 4.0 µF and C₃ = 8.0 µF. The entire combination is connected across a 24.0 V battery. Find the charge Q₁ on capacitor C₁.", "opts": ["1.44 × 10⁻⁴ C", "9.6 × 10⁻⁵ C", "4.8 × 10⁻⁵ C", "2.88 × 10⁻⁴ C"], "ans": "B", "exp": "Parallel pair equivalent C_p = 4.0 + 8.0 = 12.0 µF. Total equivalent capacitance C_eq = (6.0 × 12.0)/(6.0 + 12.0) = 4.0 µF. Total charge from battery Q_tot = C_eq V = 4.0 µF × 24 V = 96.0 µC. Since C₁ is in series with the rest, Q₁ = Q_tot = 9.6 × 10⁻⁵ C."}, {"n": 67, "section": "CH 3 · CAPACITORS & DIELECTRICS", "q": "What is the mathematical relation between the induced bound surface charge density σ_b on a dielectric slab and the free surface charge density σ_f on capacitor plates, where κ is the dielectric constant?", "opts": ["σ_b = σ_f (κ - 1)", "σ_b = σ_f / κ", "σ_b = σ_f (1 - 1/κ)", "σ_b = σ_f (1 + 1/κ)"], "ans": "C", "exp": "Net electric field in dielectric is E = E₀ / κ = (σ_f - σ_b) / ε₀. Since E₀ = σ_f / ε₀, we get σ_f / κ = σ_f - σ_b, which yields σ_b = σ_f (1 - 1/κ)."}, {"n": 68, "section": "CH 3 · CAPACITORS & DIELECTRICS", "q": "Calculate the capacitance C of an isolated conducting sphere of radius R = 0.45 m in vacuum.", "opts": ["4.04 × 10⁹ F", "2.25 × 10⁻¹¹ F", "3.98 × 10⁻¹² F", "5.01 × 10⁻¹¹ F"], "ans": "D", "exp": "The capacitance of an isolated spherical conductor is C = 4π ε₀ R = R / k = 0.45 / (8.99 × 10⁹) = 5.01 × 10⁻¹¹ F."}, {"n": 69, "section": "CH 3 · CAPACITORS & DIELECTRICS", "q": "A parallel plate capacitor of plate area A and total gap distance d is filled with two equal-thickness slabs (thickness d/2) of dielectric constants κ₁ and κ₂ placed parallel to the plates. How can this system be modeled?", "opts": ["As two capacitors connected in SERIES, each having plate separation d/2 and area A.", "As two capacitors connected in PARALLEL, each having plate area A/2 and separation d.", "As a single uniform capacitor with dielectric constant κ₁ + κ₂.", "As two capacitors connected in PARALLEL, each having plate separation d/2."], "ans": "A", "exp": "When dielectric slabs are stacked parallel to the plates, electric field lines pass sequentially through both slabs. The total voltage drop is the sum of drops across each slab (V = V₁ + V₂), which defines a SERIES combination."}, {"n": 70, "section": "CH 3 · CAPACITORS & DIELECTRICS", "q": "Capacitor C₁ = 4.0 µF is charged to V₁ = 100.0 V and then disconnected from the power source. It is subsequently connected in parallel across an uncharged capacitor C₂ = 6.0 µF. Find the final common voltage V_f across the pair.", "opts": ["100 V", "40 V", "60 V", "25 V"], "ans": "B", "exp": "Total charge is conserved: Q_tot = C₁ V₁ = (4.0 µF)(100 V) = 400 µC. Total parallel capacitance C_tot = 4.0 + 6.0 = 10.0 µF. Final voltage V_f = Q_tot / C_tot = 400 µC / 10.0 µF = 40 V."}, {"n": 71, "section": "CH 3 · CAPACITORS & DIELECTRICS", "q": "Why is the electrostatic attractive force F between the two oppositely charged plates of a parallel plate capacitor carrying charge Q equal to F = Q² / (2 ε₀ A) rather than Q² / (ε₀ A)?", "opts": ["Half of the charge on each plate leaks into the surrounding air gap during attraction.", "The total electric field between the plates is doubled due to electromagnetic induction.", "Each plate experiences a force due to the electric field produced by the OTHER plate alone, which has magnitude E_other = Q / (2 ε₀ A).", "Gravitational attraction between metal plates reduces electrostatic force by exactly 50%."], "ans": "C", "exp": "The total field E = Q / (ε₀ A) is the sum of equal fields from both plates: E = E₁ + E₂ where E₁ = E₂ = Q / (2 ε₀ A). The force on plate 1 is F = Q E₂ = Q [Q / (2 ε₀ A)] = Q² / (2 ε₀ A)."}, {"n": 72, "section": "CH 3 · CAPACITORS & DIELECTRICS", "q": "A spherical capacitor consists of two concentric metallic spherical shells of inner radius a = 0.09 m and outer radius b = 0.1 m. Calculate its capacitance C in air.", "opts": ["5.27 × 10⁻¹² F", "1.11 × 10⁻⁸ F", "8.09 × 10⁹ F", "1 × 10⁻¹⁰ F"], "ans": "D", "exp": "Capacitance of concentric spherical shells is C = 4π ε₀ (a b) / (b - a) = (a b) / [k (b - a)] = (0.09 × 0.1) / [(8.99 × 10⁹) × (0.1 - 0.09)] = 1 × 10⁻¹⁰ F."}, {"n": 73, "section": "CH 3 · CAPACITORS & DIELECTRICS", "q": "When an initially uncharged capacitor C is charged by a battery of constant EMF V through a series resistor R, what percentage of the total energy supplied by the battery is stored in the capacitor?", "opts": ["Exactly 50% (the remaining 50% is dissipated as heat in the resistor).", "100% (no electrical energy is dissipated during charging).", "25% (75% is dissipated as heat in the resistor).", "It depends entirely on the numerical resistance value R of the circuit."], "ans": "A", "exp": "Total energy supplied by battery during charging is W_battery = Q V = C V². Energy stored in capacitor is U = ½ C V². Exactly half (50%) of the supplied energy is stored, while the other half is converted to heat in the charging circuit regardless of R."}, {"n": 74, "section": "CH 3 · CAPACITORS & DIELECTRICS", "q": "In the capacitor reconnection scenario of Question 70 (C₁ = 4.0 µF initially at 100.0 V connected to uncharged C₂ = 6.0 µF), calculate the amount of electrostatic energy lost as heat and spark during charge redistribution.", "opts": ["0 J", "0.012 J", "8 × 10⁻³ J", "0.02 J"], "ans": "B", "exp": "Initial energy U_i = ½ C₁ V₁² = 0.5(4.0 µF)(100 V)² = 0.020 J. Final energy U_f = ½ C_tot V_f² = 0.5(10.0 µF)(40 V)² = 0.008 J. Energy lost ΔU = U_i - U_f = 0.020 - 0.008 = 0.012 J."}, {"n": 75, "section": "CH 3 · CAPACITORS & DIELECTRICS", "q": "How does a traditional mechanical variable tuning capacitor in radio receivers alter its capacitance?", "opts": ["By varying the dielectric constant κ of air through mechanical pressure.", "By altering the plate separation distance d using a micro-screw thread.", "By rotating a set of movable rotor plates to change the effective overlapping surface area A with stationary stator plates.", "By changing the electrical resistivity of the aluminum plate material."], "ans": "C", "exp": "Variable air capacitors consist of interleaved stator and rotor metal plates. Rotating the shaft changes the overlapping area A between plates, varying capacitance according to C = ε₀ A / d."}]},
 p4:{title:"Current & Electricity",desc:"EMF, Ohm's law, resistivity, temperature effects, power",color:"#EF4444",icon:"&#128268;",data:[{"n": 76, "section": "CH 4 · CURRENT & ELECTRICITY", "q": "A total electric charge of 450.0 C passes through a cross-section of a conducting wire in a time interval of 3.0 minutes. Calculate the electric current I in the wire.", "opts": ["150 A", "8.1 × 10⁴ A", "0.0139 A", "2.5 A"], "ans": "D", "exp": "Current is charge per unit time: I = ΔQ / Δt. Converting time to seconds: Δt = 3.0 × 60 = 180.0 s. Thus I = 450.0 C / 180.0 s = 2.5 A."}, {"n": 77, "section": "CH 4 · CURRENT & ELECTRICITY", "q": "Although conduction electrons in a metal move at high random thermal speeds (~10⁶ m/s), what is the order of magnitude of their net drift speed v_d along a wire carrying typical household direct current?", "opts": ["10⁻⁴ to 10⁻³ m/s (fraction of a millimeter per second)", "Near the speed of light in vacuum (~3 × 10⁸ m/s)", "Equal to the speed of sound in copper (~5000 m/s)", "Zero m/s because electrons bounce back and forth without net displacement"], "ans": "A", "exp": "Frequent collisions with lattice ions randomize electron motion. Under an electric field, electrons acquire a tiny net drift speed v_d on the order of 10⁻⁴ m/s. Electrical signals propagate at near light speed because field changes travel rapidly through the wire."}, {"n": 78, "section": "CH 4 · CURRENT & ELECTRICITY", "q": "A copper wire of cross-sectional area A = 2 × 10⁻⁶ m² carries current I = 5.0 A. Assuming conduction electron density n = 8.5 × 10²⁸ m⁻³, calculate electron drift speed v_d.", "opts": ["3.67 × 10⁻¹⁰ m/s", "1.84 × 10⁻⁴ m/s", "7.34 × 10⁻¹⁶ m/s", "5450 m/s"], "ans": "B", "exp": "Using I = n e A v_d ⇒ v_d = I / (n e A) = 5.0 / [(8.5 × 10²⁸)(1.6 × 10⁻¹⁹)(2 × 10⁻⁶)] = 1.84 × 10⁻⁴ m/s."}, {"n": 79, "section": "CH 4 · CURRENT & ELECTRICITY", "q": "Under what condition is the terminal voltage V across a real battery with internal resistance r EXACTLY equal to its electromotive force (EMF) E?", "opts": ["When the battery terminals are short-circuited with a zero-resistance wire.", "When the battery is delivering maximum rated current to a heavy load.", "When the battery is in an open circuit so that zero current flows (I = 0).", "When the battery is being rapidly recharged with a high external current."], "ans": "C", "exp": "Terminal voltage of a discharging battery is V = E - I r. When no current is drawn (I = 0, open circuit), the internal resistance drop I r vanishes, making V = E."}, {"n": 80, "section": "CH 4 · CURRENT & ELECTRICITY", "q": "A real battery has an EMF E = 12.0 V and internal resistance r = 0.5 Ω. Calculate its terminal voltage V when it delivers a current I = 3.0 A to an external circuit.", "opts": ["13.5 V", "6 V", "12 V", "10.5 V"], "ans": "D", "exp": "When discharging, terminal voltage is V = E - I r = 12.0 - (3.0 A)(0.5 Ω) = 12.0 - 1.5 = 10.5 V."}, {"n": 81, "section": "CH 4 · CURRENT & ELECTRICITY", "q": "What is the microscopic vector form of Ohm's Law relating current density J, electric field E, and electrical conductivity σ?", "opts": ["J = σ E", "J = E / σ", "J = σ / E", "J = σ E²"], "ans": "A", "exp": "Microscopic Ohm's law states that current density J at a point is directly proportional to local electric field E: J = σ E = E / ρ, where σ is electrical conductivity and ρ is resistivity."}, {"n": 82, "section": "CH 4 · CURRENT & ELECTRICITY", "q": "Calculate the resistance R of a copper wire of length L = 50.0 m and radius r = 5 × 10⁻⁴ m, given copper resistivity ρ = 1.7 × 10⁻⁸ Ω·m.", "opts": ["0.271 Ω", "1.08 Ω", "3.4 Ω", "6.68 × 10⁻¹³ Ω"], "ans": "B", "exp": "Cross-sectional area A = π r² = π(5 × 10⁻⁴)² = 7.85 × 10⁻⁷ m². Resistance R = ρ L / A = (1.7 × 10⁻⁸)(50.0) / (7.85 × 10⁻⁷) = 1.08 Ω."}, {"n": 83, "section": "CH 4 · CURRENT & ELECTRICITY", "q": "How does electrical resistivity ρ change with increasing temperature T for pure metals compared to intrinsic semiconductors?", "opts": ["Resistivity DECREASES with temperature in metals, but INCREASES in semiconductors.", "Resistivity INCREASES with temperature in both metals and intrinsic semiconductors.", "Resistivity INCREASES with temperature in metals (positive α), but DECREASES with temperature in semiconductors (negative α).", "Resistivity is completely independent of temperature for all solid materials."], "ans": "C", "exp": "In metals, higher T increases lattice vibrations, scattering electrons more (ρ increases). In intrinsic semiconductors, higher T excites valence electrons across the bandgap into conduction band, dramatically increasing charge carrier density n (ρ decreases)."}, {"n": 84, "section": "CH 4 · CURRENT & ELECTRICITY", "q": "A platinum resistance thermometer has R₀ = 10.0 Ω at T₀ = 20.0 °C. Its temperature coefficient of resistivity is α = 3.92 × 10⁻³ °C⁻¹. Calculate its resistance R at T = 120.0 °C.", "opts": ["10 Ω", "3.92 Ω", "14.7 Ω", "13.9 Ω"], "ans": "D", "exp": "R(T) = R₀ [1 + α (T - T₀)] = 10.0 [1 + (3.92 × 10⁻³)(120.0 - 20.0)] = 10.0 [1 + 0.392] = 13.9 Ω."}, {"n": 85, "section": "CH 4 · CURRENT & ELECTRICITY", "q": "Below its critical transition temperature T_c, a superconductor exhibits two defining physical properties: zero electrical resistance and what unique magnetic behavior?", "opts": ["Perfect diamagnetism (complete expulsion of interior magnetic flux, known as the Meissner effect).", "Perfect ferromagnetism (spontaneous creation of permanent magnetic fields).", "Infinite internal electrical capacitance.", "Continuous conversion of ambient magnetic fields into high-energy gamma radiation."], "ans": "A", "exp": "Superconductivity is characterized by R = 0 and perfect diamagnetism (B = 0 inside the superconductor). When cooled below T_c, it expels magnetic fields from its interior (Meissner effect)."}, {"n": 86, "section": "CH 4 · CURRENT & ELECTRICITY", "q": "A heating element of resistance R = 15.0 Ω is connected across a constant potential difference V = 120.0 V. Calculate the rate of electrical power P dissipated as heat.", "opts": ["8 W", "960 W", "1800 W", "2.16 × 10⁵ W"], "ans": "B", "exp": "Electric power dissipated in a resistor is P = V² / R = (120.0)² / 15.0 = 14400 / 15.0 = 960 W."}, {"n": 87, "section": "CH 4 · CURRENT & ELECTRICITY", "q": "According to the Maximum Power Transfer Theorem, an external load resistor R receives MAXIMUM electrical power from a real source of EMF E with internal resistance r when R is set equal to what value?", "opts": ["R = 0 (short circuit across load).", "R = ∞ (open circuit load).", "R = r (load resistance equals internal resistance).", "R = 2 r (load resistance double internal resistance)."], "ans": "C", "exp": "Power to load is P = I² R = [E / (R + r)]² R. Setting dP/dR = 0 yields R = r for maximum power transfer to the load."}, {"n": 88, "section": "CH 4 · CURRENT & ELECTRICITY", "q": "A battery with EMF E = 24.0 V and internal resistance r = 3.0 Ω is connected to a variable load resistor R. Calculate the MAXIMUM power P_max that can be delivered to the load.", "opts": ["192 W", "96 W", "24 W", "48 W"], "ans": "D", "exp": "Maximum power occurs when R = r = 3.0 Ω. Current I = E / (R + r) = 24 / 6 = 4.0 A. Maximum load power P_max = I² R = (4.0 A)² × 3.0 Ω = 48 W (or P_max = E² / (4 r))."}, {"n": 89, "section": "CH 4 · CURRENT & ELECTRICITY", "q": "Kirchhoff's Junction Rule (Current Law) and Loop Rule (Voltage Law) are direct statements of which two fundamental conservation principles in physics, respectively?", "opts": ["Conservation of Electric Charge (Junction Rule) and Conservation of Energy (Loop Rule).", "Conservation of Linear Momentum and Conservation of Energy.", "Conservation of Energy and Conservation of Electric Charge.", "Conservation of Angular Momentum and Conservation of Mass."], "ans": "A", "exp": "Junction Rule states net current entering a junction equals net current leaving (conservation of charge). Loop Rule states sum of potential changes around any closed loop is zero (conservation of energy)."}, {"n": 90, "section": "CH 4 · CURRENT & ELECTRICITY", "q": "Four wires meet at a circuit junction. Currents entering the junction are I₁ = 4.5 A and I₂ = 3.2 A. Two currents leave the junction: I₃ = 2.1 A and an unknown current I₄. Calculate I₄.", "opts": ["7.7 A", "5.6 A", "0.8 A", "9.8 A"], "ans": "B", "exp": "By Kirchhoff's Junction Rule: Σ I_in = Σ I_out ⇒ I₁ + I₂ = I₃ + I₄ ⇒ 4.5 + 3.2 = 2.1 + I₄ ⇒ 7.7 = 2.1 + I₄ ⇒ I₄ = 5.6 A."}, {"n": 91, "section": "CH 4 · CURRENT & ELECTRICITY", "q": "When a rechargeable battery with EMF E and internal resistance r is being CHARGED by an external power source supplying current I, what is the terminal voltage V across the battery?", "opts": ["V = E - I r (less than EMF E)", "V = E (equal to EMF E regardless of current)", "V = E + I r (greater than EMF E)", "V = I r (equal to internal drop only)"], "ans": "C", "exp": "During charging, current flows into the positive terminal (opposite to discharge direction). The external charger must overcome both internal EMF and internal resistance drop, so V = E + I r."}, {"n": 92, "section": "CH 4 · CURRENT & ELECTRICITY", "q": "A 1.5 kW electrical space heater operates 8.0 hours daily for 30 days. If electricity costs 0.12 USD per kWh, calculate the total cost to run the heater.", "opts": ["4320.00 USD", "1.44 USD", "2.59 USD", "43.20 USD"], "ans": "D", "exp": "Total energy consumed E = (1.5 kW) × (8.0 h/day) × (30 days) = 360 kWh. Total cost = 360 kWh × 0.12 USD/kWh = 43.20 USD."}, {"n": 93, "section": "CH 4 · CURRENT & ELECTRICITY", "q": "What is the primary safety function of connecting an electrical appliance's metallic outer chassis to the earth ground wire in a standard 3-prong plug?", "opts": ["To provide a low-resistance path to ground that safely blows the fuse/breaker if an internal short circuit energizes the chassis.", "To increase the appliance's operating voltage and overall energy efficiency.", "To prevent radio frequency electromagnetic radiation from leaking into the surrounding room.", "To store excess electric charge during sudden power grid voltage surges."], "ans": "A", "exp": "If a live wire accidentally touches the grounded metal chassis, a large fault current flows directly to Earth through the ground wire, immediately tripping the circuit breaker and preventing severe electric shock to users."}, {"n": 94, "section": "CH 4 · CURRENT & ELECTRICITY", "q": "In a circuit, resistor R₁ = 10.0 Ω is in series with a parallel combination of R₂ = 20.0 Ω and R₃ = 30.0 Ω. The circuit is connected across a 44.0 V battery. Calculate total current I supplied by the battery.", "opts": ["0.733 A", "2 A", "8.07 A", "1.26 A"], "ans": "B", "exp": "Parallel pair equivalent R_p = (20 × 30)/(20 + 30) = 600/50 = 12.0 Ω. Total equivalent resistance R_eq = R₁ + R_p = 10.0 + 12.0 = 22.0 Ω. Total current I = V / R_eq = 44.0 V / 22.0 Ω = 2 A."}, {"n": 95, "section": "CH 4 · CURRENT & ELECTRICITY", "q": "In the standard 4-band color code system for axial carbon-composition resistors, what does the fourth color band represent?", "opts": ["First significant digit of the resistance value.", "Multiplier power of ten for the resistance value.", "Manufacturing resistance tolerance percentage (e.g., Gold = ±5%, Silver = ±10%).", "Maximum temperature rating of the resistor in degrees Celsius."], "ans": "C", "exp": "In a 4-band resistor color code: band 1 = 1st digit, band 2 = 2nd digit, band 3 = multiplier (10ⁿ), and band 4 = manufacturing tolerance percentage."}, {"n": 96, "section": "CH 4 · CURRENT & ELECTRICITY", "q": "A 12.0 V lead-acid automotive battery has a capacity rating of 60.0 Ampere-hours (Ah). Calculate the total electrical energy stored in the fully charged battery in Joules.", "opts": ["720 J", "0.2 J", "4.32 × 10⁴ J", "2.59 × 10⁶ J"], "ans": "D", "exp": "1 Ah = 3600 C. Total charge capacity Q = 60.0 × 3600 = 2.16 × 10⁵ C. Stored electrical energy E = Q V = (2.16 × 10⁵ C)(12.0 V) = 2.59 × 10⁶ J."}, {"n": 97, "section": "CH 4 · CURRENT & ELECTRICITY", "q": "Which of the following circuit components is classified as NON-OHMIC because its current-voltage (I-V) characteristic curve is non-linear?", "opts": ["Semiconductor PN junction diode", "Carbon composition fixed resistor", "Constantan wire coil at constant temperature", "Copper power cable carrying moderate direct current"], "ans": "A", "exp": "Ohmic materials maintain a constant resistance R = V/I (linear I-V graph). Semiconductor diodes conduct current easily in one direction but block it in reverse, producing a strongly non-linear I-V curve."}, {"n": 98, "section": "CH 4 · CURRENT & ELECTRICITY", "q": "A wire made of material with electrical conductivity σ = 4 × 10⁷ (Ω·m)⁻¹ carries a current density J = 2 × 10⁶ A/m². Calculate the magnitude of internal electric field E.", "opts": ["8 × 10¹³ V/m", "0.05 V/m", "20 V/m", "1 × 10⁵ V/m"], "ans": "B", "exp": "Microscopic Ohm's law: J = σ E ⇒ E = J / σ = (2 × 10⁶) / (4 × 10⁷) = 0.05 V/m."}, {"n": 99, "section": "CH 4 · CURRENT & ELECTRICITY", "q": "What is a fundamental difference between Type I and Type II superconductors?", "opts": ["Type I superconductors operate above room temperature while Type II operate near absolute zero.", "Type I superconductors have non-zero resistance while Type II have strictly zero resistance.", "Type II superconductors enter a vortex (mixed) state allowing them to remain superconducting in much higher external magnetic fields.", "Type II superconductors repel electric currents while Type I superconductors attract them."], "ans": "C", "exp": "Type I superconductors lose superconductivity at relatively low critical magnetic fields H_c. Type II superconductors have two critical fields (H_c1 and H_c2) and enter a mixed state where magnetic flux penetrates in vortices, preserving zero resistance up to very high magnetic fields (H_c2)."}, {"n": 100, "section": "CH 4 · CURRENT & ELECTRICITY", "q": "Electric power P = 1.2 × 10⁶ W is transmitted through power lines of total resistance R = 4.0 Ω at a transmission voltage V = 2.4 × 10⁴ V. Calculate power lost as Joule heat P_loss in the lines.", "opts": ["200 W", "200 W (var 1)", "1.2 × 10⁵ W", "1 × 10⁴ W"], "ans": "D", "exp": "Line current I = P_trans / V = (1.2 × 10⁶) / 24000.0 = 50.0 A. Power loss in lines is P_loss = I² R = (50.0 A)² × 4.0 Ω = 2500 × 4.0 = 1 × 10⁴ W."}]},
 p5:{title:"DC Circuits & Instruments",desc:"Kirchhoff, Wheatstone, meters, shunts, RC circuits, CRO",color:"#3B82F6",icon:"&#128208;",data:[{"n": 1, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "Three resistors of resistance 6.0 Ω, 12.0 Ω, and 4.0 Ω are connected in parallel across a 12.0 V ideal battery. Calculate the total current supplied by the battery.", "opts": ["6 A", "0.545 A", "2 A", "3 A"], "ans": "A", "exp": "For parallel resistors, 1/Req = 1/6.0 + 1/12.0 + 1/4.0 = 0.5 Ω⁻¹, giving Req = 2.0 Ω. Total current I = V / Req = 12.0 V / 2.0 Ω = 6 A."}, {"n": 2, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "A circuit consists of a 10.0 Ω resistor in series with a parallel combination of 20.0 Ω and 30.0 Ω resistors, connected to a 50.0 V DC supply. Calculate total power dissipated in the circuit.", "opts": ["41.7 W", "114 W", "250 W", "208 W"], "ans": "B", "exp": "Parallel resistance Rp = (20.0 × 30.0) / (20.0 + 30.0) = 12.0 Ω. Total equivalent resistance Req = 10.0 + 12.0 = 22.0 Ω. Total power P = V² / Req = 50.0² / 22.0 = 114 W."}, {"n": 3, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "A DC cell with EMF 1.50 V and internal resistance 0.50 Ω is connected to an external load resistor of 4.50 Ω. Calculate the terminal potential difference across the cell.", "opts": ["1.5 V", "0.15 V", "1.35 V", "1.2 V"], "ans": "C", "exp": "Circuit current I = E / (R + r) = 1.50 V / (4.50 + 0.50) Ω = 0.3 A. Terminal voltage V = E - Ir = 1.50 - (0.3 A × 0.50) = 1.35 V."}, {"n": 4, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "A DC power source has an open-circuit voltage of 24.0 V and internal resistance of 6.0 Ω. Determine the maximum power that can be delivered to an external load resistor.", "opts": ["96 W", "48 W", "12 W", "24 W"], "ans": "D", "exp": "According to the Maximum Power Transfer Theorem, maximum power is delivered when load R equals internal resistance r (6.0 Ω). Maximum power P_max = E² / (4r) = 24.0² / (4 × 6.0) = 24 W."}, {"n": 5, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "Kirchhoff's junction rule (first law) for electric circuits is a direct consequence of which fundamental physical principle?", "opts": ["Conservation of electric charge", "Conservation of energy", "Conservation of linear momentum", "Conservation of magnetic flux"], "ans": "A", "exp": "Kirchhoff's junction rule states that the total electric current entering any circuit junction must equal total current leaving it. This expresses the law of conservation of electric charge, as charge cannot accumulate at a junction in steady state."}, {"n": 6, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "Two DC sources of EMF E1 = 12.0 V (r1 = 1.0 Ω) and E2 = 6.0 V (r2 = 2.0 Ω) are connected in series opposing each other across a load resistor R = 3.0 Ω. Calculate the loop current.", "opts": ["3 A", "1 A", "2 A", "0.667 A"], "ans": "B", "exp": "In series opposing configuration, net EMF E_net = E1 - E2 = 12.0 - 6.0 = 6.0 V. Total circuit resistance R_tot = r1 + r2 + R = 1.0 + 2.0 + 3.0 = 6.0 Ω. Current I = 6.0 / 6.0 = 1 A."}, {"n": 7, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "In a two-loop mesh circuit, mesh equations are: 10 I1 + 5 I2 = 25 and 5 I1 + 15 I2 = 30. Calculate mesh current I1.", "opts": ["1.2 A", "2.5 A", "1.8 A", "0.8 A"], "ans": "C", "exp": "From equation 1, I2 = 5 - 2 I1. Substituting into equation 2 gives 5 I1 + 15(5 - 2 I1) = 30, which simplifies to -25 I1 = -45. Thus I1 = 45 / 25 = 1.8 A."}, {"n": 8, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "To minimize circuit disturbance when taking measurements, what are the ideal internal resistance values for an ammeter and a voltmeter?", "opts": ["Infinite resistance for an ammeter, zero resistance for a voltmeter", "Zero resistance for both instruments", "Infinite resistance for both instruments", "Zero resistance for an ammeter, infinite resistance for a voltmeter"], "ans": "D", "exp": "An ammeter is connected in series, so it must have zero resistance to avoid adding load resistance and changing circuit current. A voltmeter is connected in parallel, so it must have infinite resistance to draw zero current from the measured circuit."}, {"n": 9, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "A voltmeter with internal resistance 10.0 kΩ measures voltage across one resistor in a series voltage divider consisting of two 10.0 kΩ resistors across a 20.0 V supply. What voltage does the meter display?", "opts": ["6.67 V", "10 V", "5 V", "13.3 V"], "ans": "A", "exp": "The parallel combination of voltmeter and resistor has resistance Rp = (10 × 10) / (10 + 10) = 5.0 kΩ. Total circuit resistance becomes 10 + 5 = 15 kΩ. The meter reads V = 20.0 V × (5.0 / 15.0) = 6.67 V (showing loading effect compared to true 10.0 V)."}, {"n": 10, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "A galvanometer has internal resistance 50.0 Ω and full-scale deflection current 2 × 10⁻³ A. Calculate the shunt resistance required to convert it into an ammeter reading up to 5.0 A.", "opts": ["0.1 Ω", "0.02 Ω", "10 Ω", "2.5 × 10⁴ Ω"], "ans": "B", "exp": "Shunt formula S = (Ig × Rg) / (I - Ig). Substituting values gives S = (2 × 10⁻³ A × 50.0 Ω) / (5.0 A - 2 × 10⁻³ A) = 0.100 / 4.998 = 0.02 Ω."}, {"n": 11, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "A galvanometer has full-scale deflection current 1 × 10⁻³ A and internal resistance 100.0 Ω. Calculate multiplier resistance needed to convert it into a voltmeter reading up to 100.0 V.", "opts": ["1 × 10⁵ Ω", "1.01 × 10⁴ Ω", "9.99 × 10⁴ Ω", "9.9 × 10³ Ω"], "ans": "C", "exp": "Multiplier resistance Rm = (V / Ig) - Rg = (100.0 V / 1 × 10⁻³ A) - 100.0 Ω = 100,000 - 100 = 9.99 × 10⁴ Ω (or 99.9 kΩ)."}, {"n": 12, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "How is a moving coil galvanometer modified to measure larger electric currents as an ammeter?", "opts": ["A high-resistance resistor is connected in series with the galvanometer", "A low-resistance resistor is connected in series with the galvanometer", "A high-resistance resistor is connected in parallel with the galvanometer", "A low-resistance resistor (shunt) is connected in parallel with the galvanometer"], "ans": "D", "exp": "To convert a galvanometer into an ammeter, a low-resistance shunt is connected in parallel across the galvanometer coil. This allows the majority of the total circuit current to bypass the delicate galvanometer coil safely."}, {"n": 13, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "Why is a slide-wire potentiometer preferred over a standard voltmeter for precise measurement of cell electromotive force (EMF)?", "opts": ["It operates on a null method where zero current is drawn from the cell at balance point", "It measures internal resistance directly without external standard resistors", "It draws maximum current from the cell to determine full capacity", "It does not require an auxiliary battery or driver circuit"], "ans": "A", "exp": "A potentiometer measures cell EMF at null balance where no current flows through the cell under test. Because no current is drawn, there is no potential drop across internal resistance (Ir = 0), yielding true open-circuit EMF."}, {"n": 14, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "A potentiometer balances a standard cell of EMF 1.50 V against a wire length of 60.0 cm. A second cell balances at 45.0 cm on the same wire. Calculate EMF of the second cell.", "opts": ["2 V", "1.12 V", "1.35 V", "0.9 V"], "ans": "B", "exp": "The principle of potentiometer gives E1 / E2 = l1 / l2. Rearranging for E2 = E1 × (l2 / l1) = 1.50 V × (45.0 / 60.0) = 1.12 V."}, {"n": 15, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "A potentiometer wire balances open-circuit cell EMF at 75.0 cm. When cell terminals are shunted by a 10.0 Ω resistor, balance length decreases to 60.0 cm. Find internal resistance of the cell.", "opts": ["2 Ω", "12.5 Ω", "2.5 Ω", "1.5 Ω"], "ans": "C", "exp": "Internal resistance r = R × (l1 - l2) / l2. Substituting values: r = 10.0 Ω × (75.0 - 60.0) / 60.0 = 10 × 15 / 60 = 2.5 Ω."}, {"n": 16, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "Four resistors R1 = 10.0 Ω, R2 = 20.0 Ω, R3 = 30.0 Ω, and Rx form a balanced Wheatstone bridge (R1/R2 = R3/Rx). Calculate unknown resistance Rx.", "opts": ["6.67 Ω", "15 Ω", "40 Ω", "60 Ω"], "ans": "D", "exp": "For a balanced Wheatstone bridge, R1 / R2 = R3 / Rx. Solving for Rx = (R2 × R3) / R1 = (20.0 × 30.0) / 10.0 = 600 / 10 = 60 Ω."}, {"n": 17, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "Under what condition is a Wheatstone bridge circuit most sensitive to tiny changes in an unknown resistance?", "opts": ["When all four resistor arms have equal or nearly equal resistances", "When two arms have zero resistance and two have infinite resistance", "When galvanometer resistance is much greater than bridge arm resistances", "When ratio arms differ by several orders of magnitude"], "ans": "A", "exp": "A Wheatstone bridge achieves maximum sensitivity to small resistance fractional changes when all four arm resistances are of the same order of magnitude (ideally equal), maximizing deflection current per change in resistance."}, {"n": 18, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "In a meter bridge experiment, an unknown resistance X is connected in the left gap and a standard 15.0 Ω resistor in the right gap. Null point is obtained at 40.0 cm from left end. Calculate X.", "opts": ["22.5 Ω", "10 Ω", "6 Ω", "37.5 Ω"], "ans": "B", "exp": "Meter bridge balance equation gives X / R = l / (100 - l). Substituting values: X = 15.0 Ω × 40.0 / (100 - 40.0) = 15 × 40 / 60 = 10 Ω."}, {"n": 19, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "Why are experimenters instructed to select standard resistance values that yield meter bridge balance points near the center of the wire (between 40 cm and 60 cm)?", "opts": ["To prevent excessive electric current from overheating the bridge wire", "To ensure supply battery voltage remains constant throughout trial", "To minimize relative percentage errors in length measurement and end-resistance errors", "To eliminate thermoelectric EMFs generated at copper strip contacts"], "ans": "C", "exp": "Obtaining balance near 50 cm minimizes relative uncertainty Δl/l and reduces systematic end errors caused by finite contact resistance at metallic terminal strips."}, {"n": 20, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "A 4 × 10⁻⁶ F capacitor is charged through a 2.5 × 10⁶ Ω resistor in a DC RC circuit. Calculate the time constant τ of the circuit.", "opts": ["0.1 s", "1 s", "100 s", "10 s"], "ans": "D", "exp": "The time constant τ of an RC circuit is defined as τ = R × C. Substituting given parameters: τ = (2.5 × 10⁶ Ω) × (4 × 10⁻⁶ F) = 10 s."}, {"n": 21, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "A 1 × 10⁻⁵ F capacitor is connected in series with a 1 × 10⁵ Ω resistor across a 12.0 V DC supply. Calculate voltage across capacitor after one time constant (t = τ).", "opts": ["7.59 V", "4.41 V", "12 V", "6 V"], "ans": "A", "exp": "During RC charging, voltage V(t) = V0 × (1 - e^(-t/τ)). At t = τ, V = 12.0 × (1 - e⁻¹) = 12.0 × (1 - 0.3679) = 7.59 V (63.2% of final voltage)."}, {"n": 22, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "A 5 × 10⁻⁶ F capacitor charged to 100.0 V is discharged through a 5 × 10⁴ Ω resistor. Calculate the initial discharging current at t = 0 s.", "opts": ["0.01 A", "2 × 10⁻³ A", "4 × 10⁻⁴ A", "0.02 A"], "ans": "B", "exp": "At instant t = 0 s, capacitor voltage equals full initial voltage V0 = 100.0 V. Ohm's law gives initial discharging current I0 = V0 / R = 100.0 V / 5 × 10⁴ Ω = 2 × 10⁻³ A (2.0 mA)."}, {"n": 23, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "A 2 × 10⁻⁵ F capacitor is fully charged by a 50.0 V DC source. Calculate total electrostatic energy stored in the electric field of the capacitor.", "opts": ["0.05 J", "0.5 J", "0.025 J", "2.5 × 10⁻³ J"], "ans": "C", "exp": "Electrostatic potential energy stored in capacitor U = 0.5 × C × V² = 0.5 × (2 × 10⁻⁵ F) × (50.0 V)² = 0.5 × 2.0×10⁻⁵ × 2500 = 0.025 J (25.0 mJ)."}, {"n": 24, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "On a CRO display screen, one full sine wave cycle spans 4.0 horizontal divisions. If horizontal time-base is set to 5 × 10⁻⁴ s/div, calculate frequency of the signal.", "opts": ["250 Hz", "2 × 10³ Hz", "1 × 10³ Hz", "500 Hz"], "ans": "D", "exp": "Period T = horizontal divisions × time-base setting = 4.0 div × 5 × 10⁻⁴ s/div = 2 × 10⁻³ s. Signal frequency f = 1 / T = 1 / 2 × 10⁻³ s = 500 Hz."}, {"n": 25, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "What is the primary function of the internal sweep time-base generator in a Cathode Ray Oscilloscope (CRO)?", "opts": ["Applies a sawtooth voltage to horizontal deflection plates to sweep electron beam linearly across screen", "Focuses cathode electrons into a narrow cylindrical beam", "Accelerates thermionic electrons from cathode toward anode", "Regulates intensity and brightness of trace on fluorescent screen"], "ans": "A", "exp": "The time-base circuit generates a linear sawtooth waveform applied across horizontal deflection X-plates, sweeping electron beam horizontally across screen at constant velocity to display voltage waveforms against time."}]},
 p6:{title:"Magnetism",desc:"Forces on wires and charges, Hall effect, cyclotrons, torque, motors",color:"#EC4899",icon:"&#129517;",data:[{"n": 26, "section": "CH 6 · MAGNETISM", "q": "Gauss's law for magnetism states that total magnetic flux through any closed Gaussian surface is zero. What fundamental physical principle does this law describe?", "opts": ["Magnetic fields are conservative fields", "Isolated magnetic monopoles do not exist in nature", "Electric charges cannot move inside magnetic fields", "Magnetic field lines originate and terminate on positive charges"], "ans": "B", "exp": "Gauss's law for magnetism (∮ B · dA = 0) implies that magnetic field lines form continuous closed loops without beginning or end. This proves that magnetic monopoles (isolated North or South poles) do not exist."}, {"n": 27, "section": "CH 6 · MAGNETISM", "q": "A long vertical wire carries an electric current directed vertically downward. Using the right-hand grip rule, what is the direction of magnetic field lines in a horizontal plane surrounding the wire?", "opts": ["Counter-clockwise when viewed from above", "Radially outward from the wire", "Clockwise when viewed from above", "Radially inward toward the wire"], "ans": "C", "exp": "By pointing the right thumb downwards in the direction of current, the fingers curl in a clockwise direction in a horizontal plane when viewed from above."}, {"n": 28, "section": "CH 6 · MAGNETISM", "q": "A straight wire 0.50 m long carrying a current of 4.0 A is placed in a uniform magnetic field of 0.30 T at an angle of 30.0° to field lines. Calculate magnetic force on the wire.", "opts": ["0.6 N", "0.52 N", "1.2 N", "0.3 N"], "ans": "D", "exp": "Magnetic force formula F = B × I × L × sin(θ). Substituting values gives F = 0.30 T × 4.0 A × 0.50 m × sin(30.0°) = 0.30 × 4.0 × 0.50 × 0.5 = 0.3 N."}, {"n": 29, "section": "CH 6 · MAGNETISM", "q": "A 1.2 m straight conductor carrying a current of 8.0 A experiences a maximum magnetic force of 2.4 N in a uniform magnetic field. Calculate magnetic field strength B.", "opts": ["0.25 T", "4 T", "0.4 T", "2.3 T"], "ans": "A", "exp": "Maximum force occurs when wire is perpendicular to magnetic field (θ = 90°, sin 90° = 1). Therefore F_max = B × I × L, giving B = F_max / (I × L) = 2.4 / (8.0 × 1.2) = 0.25 T."}, {"n": 30, "section": "CH 6 · MAGNETISM", "q": "A proton (1.6 × 10⁻¹⁹ C) enters a uniform magnetic field of 0.50 T perpendicular to field lines with speed 3 × 10⁶ m/s. Calculate magnetic force acting on the proton.", "opts": ["4.81 × 10⁻¹³ N", "2.4 × 10⁻¹³ N", "1.2 × 10⁻¹³ N", "1.6 × 10⁻¹⁹ N"], "ans": "B", "exp": "Magnetic force on a moving charged particle F = q × v × B × sin(θ). With θ = 90°, F = (1.6 × 10⁻¹⁹ C) × (3 × 10⁶ m/s) × 0.50 T = 2.4 × 10⁻¹³ N."}, {"n": 31, "section": "CH 6 · MAGNETISM", "q": "An electron beam passes undeflected through crossed electric (5 × 10⁴ V/m) and magnetic (0.10 T) fields in a velocity selector. Calculate speed of the electrons.", "opts": ["2 × 10⁻⁶ m/s", "5 × 10³ m/s", "5 × 10⁵ m/s", "5 × 10⁶ m/s"], "ans": "C", "exp": "For undeflected motion in a velocity selector, electric force equals magnetic force (q E = q v B). Solving for speed gives v = E / B = 5 × 10⁴ V/m / 0.10 T = 5 × 10⁵ m/s."}, {"n": 32, "section": "CH 6 · MAGNETISM", "q": "A charged particle is projected into a uniform magnetic field at an angle of 45° relative to the magnetic field direction. What geometry describes the particle's trajectory?", "opts": ["A circular path in a plane perpendicular to field lines", "A straight line along magnetic field lines", "A parabolic trajectory curving away from field lines", "A helical (spiral) path along magnetic field lines"], "ans": "D", "exp": "The velocity component perpendicular to field (v sin 45°) produces uniform circular motion, while the component parallel to field (v cos 45°) maintains uniform linear translation along field lines, resulting in a helical trajectory."}, {"n": 33, "section": "CH 6 · MAGNETISM", "q": "A current of 10.0 A flows through a metal conductor strip of thickness 2 × 10⁻⁴ m in a perpendicular magnetic field of 1.50 T. Given carrier density n = 8.5 × 10²⁸ m⁻³, calculate Hall voltage.", "opts": ["5.51 × 10⁻⁶ V", "1.1 × 10⁻⁵ V", "2.75 × 10⁻⁶ V", "5.51 × 10⁻³ V"], "ans": "A", "exp": "Hall voltage formula V_H = (I × B) / (n × q × t). Substituting values: V_H = (10.0 × 1.50) / (8.5 × 10²⁸ m⁻³ × 1.6 × 10⁻¹⁹ C × 2 × 10⁻⁴ m) = 15.0 / 2.723×10⁶ = 5.51 × 10⁻⁶ V (5.51 μV)."}, {"n": 34, "section": "CH 6 · MAGNETISM", "q": "In solid-state physics, what fundamental property of charge carriers in a semiconductor material is determined from the polarity (sign) of measured Hall voltage?", "opts": ["The total mass of atomic nuclei in semiconductor lattice", "The sign of dominant charge carriers (electrons vs positive holes)", "The drift velocity of electrolyte ions during chemical reactions", "The electrical breakdown resistance of insulating gate oxide"], "ans": "B", "exp": "The polarity of Hall voltage depends directly on whether mobile charge carriers deflected by magnetic force are negative electrons or positive holes, allowing identification of n-type or p-type semiconductors."}, {"n": 35, "section": "CH 6 · MAGNETISM", "q": "An α particle (3.2 × 10⁻¹⁹ C, mass 6.64 × 10⁻²⁷ kg) moves at speed 2 × 10⁶ m/s in a circular path perpendicular to a 1.20 T magnetic field. Calculate radius of the orbit.", "opts": ["0.069 m", "0.017 m", "0.035 m", "0.138 m"], "ans": "C", "exp": "Centripetal force is provided by magnetic force (m v² / r = q v B), yielding cyclotron orbit radius r = (m × v) / (q × B). Substituting values: r = (6.64 × 10⁻²⁷ kg × 2 × 10⁶ m/s) / (3.2 × 10⁻¹⁹ C × 1.20 T) = 0.035 m (3.45 cm)."}, {"n": 36, "section": "CH 6 · MAGNETISM", "q": "Calculate the cyclotron frequency of a proton (1.6 × 10⁻¹⁹ C, mass 1.67 × 10⁻²⁷ kg) circulating in a uniform magnetic field of 0.80 T.", "opts": ["2.44 × 10⁷ Hz", "6.11 × 10⁶ Hz", "7.68 × 10⁶ Hz", "1.22 × 10⁷ Hz"], "ans": "D", "exp":
