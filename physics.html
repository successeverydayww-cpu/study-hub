 mixed:{title:"Mixed Random 25",desc:"A fresh random 25 from all 11 chapters — reshuffled every time you open it",color:"#D97706",icon:"&#127919;",data:[{"n": 86, "section": "CH 8 · ELECTROMAGNETIC INDUCTION", "q": "For the cylindrical field region in Question 85 (R = 0.10 m, dB/dt = 2.0 T/s), calculate induced electric field E at distance r = 0.20 m outside axis (r &gt; R).", "opts": ["0.2 V/m", "0.05 V/m", "0.1 V/m", "0.01 V/m"], "ans": "B", "exp": "Outside region (r &gt; R), total enclosed flux rate is (dB/dt) (π R²). Line integral E (2 π r) = (dB/dt) (π R²), giving E = 0.5 × (R² / r) × (dB/dt) = 0.5 × (0.10² / 0.20) × 2.0 = 0.05 V/m."}, {"n": 66, "section": "CH 7 · SOURCES OF MAGNETIC FIELDS", "q": "In Ampere's circuital law ∮ B · ds = μ₀ I_enc, what does symbol I_enc represent?", "opts": ["Total current flowing in entire power distribution circuit", "Net electric current passing through surface bounded by closed integration path (Amperean loop)", "Electric current flowing parallel to integration displacement vector", "Displacement current density inside dielectric capacitor"], "ans": "B", "exp": "I_enc represents net algebraic sum of electric currents passing through any open surface enclosed by chosen closed Amperean loop path."}, {"n": 73, "section": "CH 11 · ALTERNATING CURRENT", "q": "A full-wave bridge rectifier is supplied by AC peak voltage V₀ = 100 V at frequency f = 60 Hz. Calculate average DC output voltage V_dc (ideal diodes) and output ripple frequency f_out.", "opts": ["V_dc = 31.8 V, f_out = 60 Hz", "V_dc = 63.7 V, f_out = 120 Hz", "V_dc = 70.7 V, f_out = 120 Hz", "V_dc = 63.7 V, f_out = 60 Hz"], "ans": "B", "exp": "A full-wave rectifier converts both half-cycles, giving average voltage V_dc = 2 V₀ / π = 200 / π = 63.7 V. Since two output voltage pulses occur per input cycle, ripple frequency is doubled: f_out = 2 × 60 = 120 Hz."}, {"n": 43, "section": "CH 6 · MAGNETISM", "q": "What key function does the split-ring commutator perform in a direct current (DC) electric motor?", "opts": ["Converts mechanical rotational power into high-voltage alternating current", "Varies internal field coil resistance to prevent motor overspeeding", "Reverses direction of current in armature coil every half rotation to maintain continuous unidirectional torque", "Suppresses high-voltage spark discharges across carbon brush contacts"], "ans": "C", "exp": "As armature coil rotates past vertical plane, split-ring commutator switches brush contacts, reversing current direction in coil sides every 180° so magnetic torque continues driving rotation in same direction."}, {"n": 34, "section": "CH 6 · MAGNETISM", "q": "In solid-state physics, what fundamental property of charge carriers in a semiconductor material is determined from the polarity (sign) of measured Hall voltage?", "opts": ["The total mass of atomic nuclei in semiconductor lattice", "The sign of dominant charge carriers (electrons vs positive holes)", "The drift velocity of electrolyte ions during chemical reactions", "The electrical breakdown resistance of insulating gate oxide"], "ans": "B", "exp": "The polarity of Hall voltage depends directly on whether mobile charge carriers deflected by magnetic force are negative electrons or positive holes, allowing identification of n-type or p-type semiconductors."}, {"n": 93, "section": "CH 4 · CURRENT & ELECTRICITY", "q": "What is the primary safety function of connecting an electrical appliance's metallic outer chassis to the earth ground wire in a standard 3-prong plug?", "opts": ["To provide a low-resistance path to ground that safely blows the fuse/breaker if an internal short circuit energizes the chassis.", "To increase the appliance's operating voltage and overall energy efficiency.", "To prevent radio frequency electromagnetic radiation from leaking into the surrounding room.", "To store excess electric charge during sudden power grid voltage surges."], "ans": "A", "exp": "If a live wire accidentally touches the grounded metal chassis, a large fault current flows directly to Earth through the ground wire, immediately tripping the circuit breaker and preventing severe electric shock to users."}, {"n": 38, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "Two large parallel conducting plates carry equal and opposite uniform surface charge densities σ = +8.85 × 10⁻⁹ C/m² and -σ. Calculate the magnitude of the electric field E in the region between the plates.", "opts": ["500 N/C", "1000 N/C", "0 N/C", "2000 N/C"], "ans": "B", "exp": "Each plate contributes E_single = σ / (2 ε₀) in the same direction between the plates. Superposition gives E_total = σ / (2 ε₀) + σ / (2 ε₀) = σ / ε₀ = (8.85 × 10⁻⁹) / (8.85 × 10⁻¹²) = 1000 N/C."}, {"n": 73, "section": "CH 7 · SOURCES OF MAGNETIC FIELDS", "q": "Why did James Clerk Maxwell modify Ampere's circuital law by adding the displacement current term (ε₀ dPhi_E / dt)?", "opts": ["To make Ampere's law consistent with conservation of electric charge in time-varying electric fields", "To account for electrical resistance in dielectric insulator materials", "To calculate static magnetic forces between moving atomic nucleus charges", "To eliminate need for Biot-Savart law in magnetostatics"], "ans": "A", "exp": "Original Ampere's law failed for non-steady currents (such as charging capacitor). Maxwell added displacement current term I_d = ε₀ (dPhi_E/dt) so ∮ B·ds = μ₀ (I + I_d), ensuring charge conservation."}, {"n": 5, "section": "CH 1 · ELECTRIC CHARGE, POTENTIAL & FIELD", "q": "Why are fuel transport trucks equipped with a conductive grounding wire connected to the earth before fuel transfer begins?", "opts": ["To safely bleed off accumulated static charge to the ground and prevent sparks that could ignite flammable vapors.", "To increase the electrical resistance of the truck body frame.", "To charge the fuel tank negatively to improve fluid flow rate.", "To attract ambient lightning strikes away from the storage tanks."], "ans": "A", " : 23, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "A 2 × 10⁻⁵ F capacitor is fully charged by a 50.0 V DC source. Calculate total electrostatic energy stored in the electric field of the capacitor.", "opts": ["0.05 J", "0.5 J", "0.025 J", "2.5 × 10⁻³ J"], "ans": "C", "exp": "Electrostatic potential energy stored in capacitor U = 0.5 × C × V² = 0.5 × (2 × 10⁻⁵ F) × (50.0 V)² = 0.5 × 2.0×10⁻⁵ × 2500 = 0.025 J (25.0 mJ)."}, {"n": 18, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "In a meter bridge experiment, an unknown resistance X is connected in the left gap and a standard 15.0 Ω resistor in the right gap. Null point is obtained at 40.0 cm from left end. Calculate X.", "opts": ["22.5 Ω", "10 Ω", "6 Ω", "37.5 Ω"], "ans": "B", "exp": "Meter bridge balance equation gives X / R = l / (100 - l). Substituting values: X = 15.0 Ω × 40.0 / (100 - 40.0) = 15 × 40 / 60 = 10 Ω."}, {"n": 20, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "A 4 × 10⁻⁶ F capacitor is charged through a 2.5 × 10⁶ Ω resistor in a DC RC circuit. Calculate the time constant τ of the circuit.", "opts": ["0.1 s", "1 s", "100 s", "10 s"], "ans": "D", "exp": "The time constant τ of an RC circuit is defined as τ = R × C. Substituting given parameters: τ = (2.5 × 10⁶ Ω) × (4 × 10⁻⁶ F) = 10 s."}, {"n": 27, "section": "CH 10 · MAGNETIC MATERIALS", "q": "Which group consists entirely of diamagnetic substances?", "opts": ["Iron, nickel, cobalt, and alnico.", "Aluminum, platinum, oxygen, and chromium.", "Copper, bismuth, water, gold, and lead.", "Gadolinium, iron oxide, and permalloy."], "ans": "C", "exp": "Copper, bismuth, water, gold, and lead are classic diamagnetic materials because all their electrons are paired in atomic shells, leaving zero net orbital/spin magnetic moment in the absence of an applied field."}, {"n": 1, "section": "CH 5 · DC CIRCUITS & INSTRUMENTS", "q": "Three resistors of resistance 6.0 Ω, 12.0 Ω, and 4.0 Ω are connected in parallel across a 12.0 V ideal battery. Calculate the total current supplied by the battery.", "opts": ["6 A", "0.545 A", "2 A", "3 A"], "ans": "A", "exp": "For parallel resistors, 1/Req = 1/6.0 + 1/12.0 + 1/4.0 = 0.5 Ω⁻¹, giving Req = 2.0 Ω. Total current I = V / Req = 12.0 V / 2.0 Ω = 6 A."}, {"n": 29, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "What is the magnitude and direction of the electric field E just outside the surface of a conductor in electrostatic equilibrium carrying surface charge density σ?", "opts": ["E = σ / ε₀, directed perpendicular to the conductor surface.", "E = σ / (2 ε₀), directed parallel to the conductor surface.", "E = 2 σ / ε₀, directed at 45° to the conductor surface.", "E = 0, because electric fields cannot exist near metal surfaces."], "ans": "A", "exp": "Applying Gauss's law to a small cylindrical Gaussian pillbox straddling the conductor surface yields E = σ / ε₀. The field must be perpendicular to the surface in electrostatic equilibrium, otherwise surface charges would experience tangential forces and move."}, {"n": 49, "section": "CH 6 · MAGNETISM", "q": "Two electrons move parallel to each other at speed 2 × 10⁶ m/s separated by distance 1 × 10⁻³ m. Calculate magnetic attraction force between them.", "opts": ["1.03 × 10⁻²⁶ N", "2.05 × 10⁻²⁶ N", "1.03 × 10⁻²³ N", "5.13 × 10⁻²⁷ N"], "ans": "A", "exp": "Magnetic force between parallel moving charges F = (μ₀ / 4pi) × (q1 q2 v1 v2 / r²). Substituting values: F = (10⁻⁷) × (1.6 × 10⁻¹⁹ C² × (2 × 10⁶ m/s)²) / (1 × 10⁻³ m)² = 1.03 × 10⁻²⁶ N."}, {"n": 66, "section": "CH 11 · ALTERNATING CURRENT", "q": "A series RLC circuit has R = 10 Ω, L = 0.2 H, and C = 5 × 10⁻⁶ F. Calculate the Quality factor Q of the circuit.", "opts": ["2", "200", "0.05", "20"], "ans": "D", "exp": "Quality factor of a series resonant circuit is Q = (1/R) √(L/C). Substituting values: √(0.20 / 5 × 10⁻⁶) = √40000 = 200 Ω. Thus Q = 200 / 10 = 20."}, {"n": 51, "section": "CH 11 · ALTERNATING CURRENT", "q": "An AC voltage is expressed by V(t) = 170 sin(100π t) V. Determine peak voltage V₀, RMS voltage V_rms, and frequency f.", "opts": ["V₀ = 170 V, V_rms = 240 V, f = 100 Hz", "V₀ = 120 V, V_rms = 170 V, f = 50 Hz", "V₀ = 170 V, V_rms = 120 V, f = 100 Hz", "V₀ = 170 V, V_rms = 120 V, f = 50 Hz"], "ans": "D", "exp": "From V(t) = V₀ sin(ω t), peak voltage V₀ = 170 V. RMS voltage V_rms = V₀ / √2 = 170 / 1.414 = 120 V. Angular frequency ω = 100π rad/s, so f = ω / (2π) = 50 Hz."}, {"n": 30, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "An infinitely long straight line carries a uniform linear charge density λ = 4 × 10⁻⁸ C/m. Calculate the magnitude of the electric field E at a perpendicular distance r = 0.2 m from the line.", "opts": ["1800 N/C", "3600 N/C", "1.8 × 10⁴ N/C", "8990 N/C"], "ans": "B", "exp": "Using Gauss's law for an infinite line of charge: E = λ / (2 π ε₀ r) = 2 k λ / r = 2(8.99 × 10⁹)(4 × 10⁻⁸) / 0.2 = 3600 N/C."}, {"n": 19, "section": "CH 9 · INDUCTANCE & MAGNETIC ENERGY", "q": "Why is an inductor (choke coil) preferred over a resistor for limiting alternating current in AC circuits?", "opts": ["An inductor increases the frequency of the AC voltage supply.", "An inductor converts AC current directly into DC current.", "An ideal inductor opposes AC current via inductive reactance without dissipating average power as heat.", "An inductor has zero reactance and only dissipates DC power."], "ans": "C", "exp": "A choke coil uses inductive reactance X_L = ωL to limit AC current. In an ideal inductor, current lags voltage by 90°, so the power factor cos φ = 0, resulting in zero average power loss (P = V_rms I_rms cos φ = 0)."}, {"n": 45, "section": "CH 2 · GAUSS'S LAW & ELECTRIC POTENTIAL", "q": "A point charge +q is placed off-center inside the cavity of an uncharged thick spherical conducting shell. How is charge distributed on the OUTER surface of the conducting shell?", "opts": ["Uniformly distributed over the outer surface regardless of the position of q inside the cavity.", "Concentrated primarily on the side of the outer surface closest to q.", "Zero charge exists on the outer surface because the shell is uncharged.", "Concentrated on the side of the outer surface farthest from q."], "ans": "A", "exp": "The conductor shields the outer surface from the internal position of charge q. A total charge +q is forced to the outer surface, and spherical symmetry of the outer shell forces it to spread uniformly."}, {"n": 99, "section": "CH 4 · CURRENT & ELECTRICITY", "q": "What is a fundamental difference between Type I and Type II superconductors?", "opts": ["Type I superconductors operate above room temperature while Type II operate near absolute zero.", "Type I superconductors have non-zero resistance while Type II have strictly zero resistance.", "Type II superconductors enter a vortex (mixed) state allowing them to remain superconducting in much higher external magnetic fields.", "Type II superconductors repel electric currents while Type I superconductors attract them."], "ans": "C", "exp": "Type I superconductors lose superconductivity at relatively low critical magnetic fields H_c. Type II superconductors have two critical fields (H_c1 and H_c2) and enter a mixed state where magnetic flux penetrates in vortices, preserving zero resistance up to very high magnetic fields (H_c2)."}]}

var cur=null,picks=[],graded=false;

/* ---------- hub ---------- */
function renderHub(){
  var el=document.getElementById('hubcards');
  el.innerHTML='';
  Object.keys(QUIZZES).forEach(function(id){
    var z=QUIZZES[id];
    var secs={};z.data.forEach(function(q){secs[q.section]=1;});
    var card=document.createElement('div');
    card.className='hubcard';card.style.setProperty('--c',z.color);
    card.innerHTML='<h2>'+z.icon+' '+z.title+'</h2><p>'+z.desc+'</p>'+
      '<div class="chips"><span class="chip">'+z.data.length+' questions</span><span class="chip gold">'+Object.keys(secs).length+' topics</span><span class="chip">Explanations + tutor</span></div>'+
      '<button onclick="openQuiz(\''+id+'\')">Start</button>';
    el.appendChild(card);
  });
}
function backToHub(){
  tutClose();
  document.getElementById('quizview').style.display='none';
  document.getElementById('qbar').style.display='none';
  document.getElementById('hub').style.display='block';
  window.scrollTo({top:0});
}

function makeMixed(){
  var all=[];
  Object.keys(QUIZZES).forEach(function(id){if(id!=='mixed')all=all.concat(QUIZZES[id].data);});
  for(var i=all.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=all[i];all[i]=all[j];all[j]=t;}
  QUIZZES.mixed.data=all.slice(0,25);
}
var qi=0,score=0,answered=false;
function openQuiz(id){
  if(id==='mixed')makeMixed();
  cur=id;var z=QUIZZES[id];
  picks=Array(z.data.length).fill(null);qi=0;score=0;answered=false;
  document.getElementById('hub').style.display='none';
  document.getElementById('quizview').style.display='block';
  document.getElementById('qbar').style.display='none';
  document.getElementById('qhero').innerHTML='<h1>'+z.icon+' '+z.title+'</h1><p>'+z.data.length+' questions · tap an option for instant marking and the full explanation · 🎓 tutor on every question</p>';
  renderQ();
}
function renderQ(){
  answered=false;
  var z=QUIZZES[cur],q=z.data[qi];
  document.getElementById('qprog').textContent=z.title+' · '+(qi+1)+' / '+z.data.length+' · score '+score;
  var main=document.getElementById('qmain');main.innerHTML='';
  var card=document.createElement('div');card.className='card';
  var optsHtml=q.opts.map(function(o,k){return '<div class="opt" id="o'+k+'" onclick="pick('+k+')"><b>'+'ABCD'[k]+'</b><span>'+o+'</span></div>';}).join('');
  card.innerHTML='<div class="qmeta"><span class="qnum">Q'+(qi+1)+'</span><span class="qtag">'+q.section+' · '+(qi+1)+' of '+z.data.length+'</span></div>'+
    '<div class="qtext">'+q.q+'</div>'+optsHtml+
    '<div class="verdict" id="v"></div>'+
    '<div class="expl" id="ex"><b>EXPLANATION</b><br>'+q.exp+'</div>'+
    '<button class="tutbtn" id="tbtn" style="display:none" onclick="tutOpen('+qi+')">&#127891; Ask the Tutor about this question</button>'+
    '<button class="btnq" id="nbtn" style="display:none" onclick="nextQ()">'+(qi===z.data.length-1?'See my score':'Next question &#8594;')+'</button>';
  main.appendChild(card);
  window.scrollTo({top:0});
}
function pick(k){
  if(answered)return;
  answered=true;
  var q=QUIZZES[cur].data[qi];var a='ABCD'.indexOf(q.ans);
  picks[qi]=k;
  var right=(k===a);if(right)score++;
  for(var j=0;j<4;j++){var el=document.getElementById('o'+j);el.classList.add('dis');
    if(j===a)el.classList.add('correct');else if(j===k)el.classList.add('miss');}
  var v=document.getElementById('v');
  if(right){v.textContent='\u2714 Correct';v.className='verdict ok';}
  else{v.textContent='\u2718 Wrong \u2014 the correct answer is '+q.ans;v.className='verdict no';}
  document.getElementById('ex').style.display='block';
  document.getElementById('tbtn').style.display='block';
  document.getElementById('nbtn').style.display='block';
  document.getElementById('qprog').textContent=QUIZZES[cur].title+' · '+(qi+1)+' / '+QUIZZES[cur].data.length+' · score '+score;
}
function nextQ(){
  var z=QUIZZES[cur];
  if(qi<z.data.length-1){qi++;renderQ();}
  else finishQuiz();
}
function finishQuiz(){
  var z=QUIZZES[cur],n=z.data.length,pct=Math.round(score/n*100);
  document.getElementById('qprog').textContent=z.title+' · finished · '+score+' / '+n;
  var main=document.getElementById('qmain');main.innerHTML='';
  var card=document.createElement('div');card.className='card';
  card.innerHTML='<div class="qtext" style="text-align:center;font-size:19px">Session complete: '+score+' / '+n+' \u00b7 '+pct+'%</div>'+
   '<div class="expl" style="display:block;text-align:center">'+(pct>=70?'Excellent \u2014 pass mark cleared. Move to the next session!':pct>=50?'Fair. Review the explanations above, then retake or move on.':'Go through the explanations again, then retake this session.')+'</div>'+
   '<button class="btnq" onclick="openQuiz(cur)">Practice this session again</button>'+
   '<button class="btnq alt" onclick="backToHub()">Back to all sessions</button>';
  main.appendChild(card);window.scrollTo({top:0});
}
function resetAll(){tutClose();openQuiz(cur);}

var MUS={ctx:null,master:null,evq:[],ci:0,nextChordT:0,timer:null,on:false,userStopped:false};
MUS.prog=[
 {b:36,notes:[60,64,67],mel:[[0,76],[2,79],[4,84],[8,83],[10,79],[12,76]]},
 {b:35,notes:[59,62,67],mel:[[0,74],[2,71],[4,74],[8,76],[10,74],[12,71]]},
 {b:33,notes:[57,60,64],mel:[[0,72],[2,76],[4,81],[8,79],[10,76],[12,72]]},

];
function mf(m){return 440*Math.pow(2,(m-69)/12);}
MUS.init=function(){if(MUS.ctx)return;
  MUS.ctx=new (window.AudioContext||window.webkitAudioContext)();
  var lp=MUS.ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;
  MUS.master=MUS.ctx.createGain();MUS.master.gain.value=1.0;
  MUS.master.connect(lp);lp.connect(MUS.ctx.destination);
  var dl=MUS.ctx.createDelay(1);dl.delayTime.value=0.29;
  var fb=MUS.ctx.createGain();fb.gain.value=0.3;
  var wet=MUS.ctx.createGain();wet.gain.value=0.16;
  lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(MUS.ctx.destination);};
MUS.note=function(t,f,vel,dur){
  var g=MUS.ctx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vel,t+0.012);
  g.gain.exponentialRampToValueAtTime(Math.max(vel*0.3,0.001),t+0.25);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  g.connect(MUS.master);
  var p=[[1,'sine',1],[2,'sine',0.3],[3,'triangle',0.09]];
  p.forEach(function(h){
    var o=MUS.ctx.createOscillator();o.type=h[1];o.frequency.value=f*h[0];
    var og=MUS.ctx.createGain();og.gain.value=h[2];
    o.connect(og);og.connect(g);o.start(t);o.stop(t+dur+0.15);});};
MUS.padn=function(t,f,dur){
  var g=MUS.ctx.createGain();
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(0.034,t+1.3);
  g.gain.setValueAtTime(0.034,Math.max(t+1.3,t+dur-1.5));
  g.gain.linearRampToValueAtTime(0,t+dur);
  var o=MUS.ctx.createOscillator();o.type='sine';o.frequency.value=f;
  o.connect(g);g.connect(MUS.master);o.start(t);o.stop(t+dur+0.15);};
MUS.chordEvents=function(t0,ci){
  var ch=MUS.prog[ci%4],len=6.4,E=[],i;
  E.push({t:t0,k:'pad',f:mf(ch.b+12),d:len});
  ch.notes.forEach(function(n){E.push({t:t0,k:'pad',f:mf(n),d:len});});
  E.push({t:t0,k:'note',f:mf(ch.b),v:0.13,d:2.8});
  ch.notes.forEach(function(n){E.push({t:t0,k:'note',f:mf(n),v:0.07,d:1.7});});
  var seq=[0,1,2,1];
  for(i=2;i<16;i+=2){if(i%8!==0){E.push({t:t0+i*0.4,k:'note',f:mf(ch.notes[seq[(i/2)%4]]),v:0.03,d:0.5});}}
  ch.mel.forEach(function(m){E.push({t:t0+m[0]*0.4,k:'note',f:mf(m[1]),v:0.11,d:0.85});});
  return E;};
MUS.pump=function(){
  if(!MUS.on)return;
  var ahead=MUS.ctx.currentTime+1.7;
  while(MUS.nextChordT<ahead){
    MUS.chordEvents(MUS.nextChordT,MUS.ci).forEach(function(e){MUS.evq.push(e);});
    MUS.ci++;MUS.nextChordT+=6.4;
  }
  var now=MUS.ctx.currentTime;
  MUS.evq=MUS.evq.filter(function(e){
    if(!e.done&&e.t<=ahead){
      if(e.k==='pad')MUS.padn(e.t,e.f,e.d);else MUS.note(e.t,e.f,e.v,e.d);
      e.done=true;
    }
    return !(e.done&&e.t+e.d+0.3<now);
  });};
MUS.ui=function(on){var b=document.getElementById('mus');if(!b)return;b.textContent=on?'\u23f8':'\u266a';b.classList.toggle('playing',on);};
MUS.start=function(){MUS.init();MUS.ctx.resume();if(MUS.on)return;MUS.on=true;MUS.ci=0;MUS.evq=[];MUS.nextChordT=MUS.ctx.currentTime+0.1;MUS.timer=setInterval(MUS.pump,250);MUS.pump();MUS.ui(true);};
MUS.stop=function(){if(!MUS.on)return;MUS.on=false;clearInterval(MUS.timer);MUS.evq=[];MUS.ui(false);};
function musToggle(){if(MUS.on){MUS.userStopped=true;MUS.stop();}else{MUS.userStopped=false;MUS.start();}}
MUS.autostart=function(){if(MUS.on||MUS.userStopped)return;try{MUS.start();}catch(e){}};
window.addEventListener('load',function(){setTimeout(MUS.autostart,300);});
['touchstart','pointerdown','keydown'].forEach(function(ev){document.addEventListener(ev,MUS.autostart,{capture:true});});

/* ---------- live AI tutor ---------- */
var API='https://superagent-ccb075d2.base44.app/functions/';
var TUT={q:-1,hist:[],open:false,voice:true,rec:null,recChunks:[],listening:false,busy:false};
function tutOpen(i){
  TUT.q=i;TUT.hist=[];
  var q=QUIZZES[cur].data[i];
  document.getElementById('tutsub').textContent='Question '+(i+1)+' · '+QUIZZES[cur].title;
  var chat=document.getElementById('tutchat');chat.innerHTML='';
  var pickTxt=picks[i]===null?'(not answered)':'the student chose '+'ABCD'[picks[i]];
  addMsg('t',"Hi! I'm your tutor for question "+(i+1)+". I can see the full question and your answer — ask me anything, or tap the mic and just talk.");
  addMsg('t','This question: '+stripTags(q.q)+' Options: '+q.opts.map(function(o,k){return 'ABCD'[k]+'. '+stripTags(o);}).join('  ')+' — '+pickTxt+', and the correct answer is '+q.ans+'.');
  document.getElementById('tutchips').innerHTML='';
  [['Explain this simply',0],['Why is the correct answer right?',1],['Where do students usually slip here?',2]].forEach(function(c){
    var b=document.createElement('button');b.textContent=c[0];
    b.onclick=function(){tutAsk(c[0]);};document.getElementById('tutchips').appendChild(b);});
  document.getElementById('tutor').classList.add('open');
  TUT.open=true;updStatus(navigator.onLine?'Online — mic and voice live':'Offline mode — voice tutor needs internet');
  if(navigator.onLine)setTimeout(function(){tutSpeak("Hi! I'm your tutor for question "+(i+1)+". Ask me anything about it.");},250);
}
function tutClose(){
  TUT.open=false;micStop();
  document.getElementById('tutor').classList.remove('open');
  try{speechSynthesis.cancel();}catch(e){}
}
function stripTags(s){var d=document.createElement('div');d.innerHTML=s;return d.textContent.replace(/\s+/g,' ').trim();}
function addMsg(cls,txt){
  var chat=document.getElementById('tutchat');
  var m=document.createElement('div');m.className='tutmsg '+cls;m.textContent=txt;
  chat.appendChild(m);chat.scrollTop=chat.scrollHeight;return m;
}
function updStatus(s){document.getElementById('tutstatus').textContent=s;}
function tutSend(){
  var inp=document.getElementById('tuttxt');
  var t=inp.value.trim();if(!t)return;
  inp.value='';tutAsk(t);
}
function tutAsk(t){
  if(TUT.busy||TUT.q<0)return;
  addMsg('s',t);TUT.hist.push({role:'student',text:t});
  TUT.busy=true;updStatus('Thinking...');
  var q=QUIZZES[cur].data[TUT.q];
  var ctx={quiz:QUIZZES[cur].title,qnum:TUT.q+1,q:stripTags(q.q),opts:q.opts.map(stripTags),pick:picks[TUT.q]===null?null:'ABCD'[picks[TUT.q]],ans:q.ans,exp:stripTags(q.exp)};
  fetch(API+'quizTutor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({msg:t,ctx:ctx,history:TUT.hist.slice(0,-1)})})
   .then(function(r){return r.json();})
   .then(function(j){
     TUT.busy=false;
     var reply=String(j.reply||'');
     if(!reply||j.err){offlineExplain(t);return;}
     addMsg('t',reply);TUT.hist.push({role:'tutor',text:reply});
     updStatus(navigator.onLine?'Online':'');tutSpeak(reply);
     if(TUT.listening)setTimeout(micStart,600);
   })
   .catch(function(){TUT.busy=false;offlineExplain(t);});
}
function offlineExplain(t){
  var q=QUIZZES[cur].data[TUT.q];
  var line='Offline mode, so here is the built-in explanation: '+stripTags(q.exp);
  addMsg('sys','Live tutor needs internet. Reading the saved explanation instead.');
  addMsg('t',line);updStatus('Offline');tutSpeak(line);
}
function tutSpeak(text){
  if(!TUT.open||!TUT.voice)return;
  fetch(API+'airconnectTts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:String(text).slice(0,900)})})
   .then(function(r){if(!r.ok)throw 0;return r.blob();})
   .then(function(blob){
     var a=new Audio(URL.createObjectURL(blob));
     a.onended=function(){if(TUT.listening&&navigator.onLine)setTimeout(micStart,500);};
     a.play().catch(function(){sayFallback(text);});
   })
   .catch(function(){sayFallback(text);});
}
function sayFallback(text){
  try{
    var u=new SpeechSynthesisUtterance(String(text).slice(0,600));
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}
/* mic: record -> STT -> auto-ask, loop while open */
function micToggle(){
  if(TUT.listening){micStop();updStatus('');}
  else{micStart();}
}
function micStart(){
  if(TUT.listening||TUT.busy)return;
  if(!navigator.onLine){addMsg('sys','Voice input needs internet. Type your question instead.');updStatus('Offline');return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){addMsg('sys','This browser cannot record audio. Type your question instead.');return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var mime='audio/webm';
    try{TUT.rec=new MediaRecorder(stream,{mimeType:mime});}catch(e){TUT.rec=new MediaRecorder(stream);}
    TUT.recChunks=[];
    TUT.rec.ondataavailable=function(ev){if(ev.data&&ev.data.size)TUT.recChunks.push(ev.data);};
    TUT.rec.onstop=function(){
      stream.getTracks().forEach(function(tr){tr.stop();});
      var blob=new Blob(TUT.recChunks,{type:'audio/webm'});
      if(blob.size<2000){if(TUT.listening)setTimeout(micStart,300);return;}
      var fr=new FileReader();
      fr.onload=function(){
        updStatus('Transcribing...');
        fetch(API+'airconnectStt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({audio:fr.result})})
         .then(function(r){return r.json();})
         .then(function(j){
           var t=String(j.text||'').trim();
           if(t){tutAsk(t);}else{updStatus('');if(TUT.listening)setTimeout(micStart,300);}
         })
         .catch(function(){updStatus('Mic error');micStop();});
      };
      fr.readAsDataURL(blob);
    };
    TUT.rec.start();
    TUT.listening=true;
    document.getElementById('tutmic').classList.add('rec');
    updStatus('Listening... speak now (tap mic to stop)');
  }).catch(function(){addMsg('sys','Microphone unavailable. Type your question instead.');});
}
function micStop(){
  TUT.listening=false;
  document.getElementById('tutmic').classList.remove('rec');
  if(TUT.rec&&TUT.rec.state!=='inactive'){try{TUT.rec.stop();}catch(e){}}
  TUT.rec=null;
}
renderHub();
