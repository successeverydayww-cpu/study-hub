ts": ["essentially 100% (99.5%+), all water removed", "about 50% by volume", "about 95% by volume", "denatured with methanol"], "ans": "A", "exp": "Rectified spirit is about 95% ethanol (the azeotrope limit of simple distillation); absolute alcohol is the water-free ~99.5%+ product obtained with dehydrating agents."}, {"n": 62, "section": "ALCOHOLS", "q": "When ethanol vapour is passed over hot copper (about 300°C) in the absence of air, the product is:", "opts": ["ethene", "ethanal", "ethanoic acid", "diethyl ether"], "ans": "B", "exp": "Copper catalyzes dehydrogenation: CH<sub>3</sub>CH<sub>2</sub>OH → CH<sub>3</sub>CHO + H<sub>2</sub>. No air means no oxidation beyond the aldehyde."}, {"n": 63, "section": "ALCOHOLS", "q": "Glycerol (glycerine) is the trivial name of:", "opts": ["propan-1-ol", "propan-1,2-diol", "propan-1,2,3-triol", "propan-2,3-diol"], "ans": "C", "exp": "Glycerol carries a hydroxyl group on every carbon: propan-1,2,3-triol. It is a sweet, viscous liquid produced in soap-making."}, {"n": 64, "section": "ALCOHOLS", "q": "In the esterification of ethanol with ethanoic acid, the concentrated H<sub>2</sub>SO<sub>4</sub> serves as:", "opts": ["a reducing agent", "an oxidizing agent", "a nucleophile", "a catalyst and dehydrating agent that shifts the equilibrium towards ester"], "ans": "D", "exp": "H<sub>2</sub>SO<sub>4</sub> protonates the acid to speed up the reaction AND removes water, driving the reversible equilibrium towards more ethyl ethanoate."}, {"n": 65, "section": "ALCOHOLS", "q": "Direct hydration of propene over H<sub>3</sub>PO<sub>4</sub> gives mainly:", "opts": ["propan-1-ol", "propanal", "propan-2-ol", "propanoic acid"], "ans": "C", "exp": "Markovnikov addition puts the OH on the middle carbon (the more substituted carbocation), so propene yields propan-2-ol, not propan-1-ol."}, {"n": 66, "section": "ETHERS", "q": "Diethyl ether is heated with EXCESS hot concentrated HI. The products are:", "opts": ["ethanol and iodoethane", "ethene and water", "ethoxyethane and hydrogen", "two moles of iodoethane"], "ans": "D", "exp": "Excess hot HI cleaves both C-O bonds: C<sub>2</sub>H<sub>5</sub>OC<sub>2</sub>H<sub>5</sub> + 2HI → 2C<sub>2</sub>H<sub>5</sub>I + H<sub>2</sub>O. With cold dilute HI only one bond breaks, giving one alcohol and one iodide."}, {"n": 67, "section": "ETHERS", "q": "Ethers are relatively unreactive towards sodium, dilute acids and oxidizing agents because:", "opts": ["they are gases", "the C-O bond is ionic", "they contain double bonds", "they have no reactive O-H bond and no electron-deficient carbon under these conditions"], "ans": "D", "exp": "With both oxygens already fully bonded and no acidic hydrogen, ethers offer no site for nucleophiles, bases or mild oxidants, which is why they make ideal solvents."}, {"n": 68, "section": "ETHERS", "q": "In Williamson's synthesis, sodium methoxide reacts with bromoethane. The product is:", "opts": ["ethoxyethane", "propane", "ethanol", "methoxyethane"], "ans": "D", "exp": "CH<sub>3</sub>O<sup>-</sup> performs an S<sub>N</sub>2 attack on the primary halide: CH<sub>3</sub>OC<sub>2</sub>H<sub>5</sub> (methoxyethane) + NaBr."}, {"n": 69, "section": "ETHERS", "q": "Why must old bottles of diethyl ether be tested before distillation in the laboratory?", "opts": ["ether absorbs water and becomes dangerous", "ether polymerizes spontaneously", "ether slowly forms explosive peroxides on contact with air and light", "ether evaporates completely"], "ans": "C", "exp": "Ethers react with atmospheric oxygen to build up peroxides, which concentrate in the distillation residue and can detonate, so old ether is tested for peroxides first."}, {"n": 70, "section": "ETHERS", "q": "The boiling point of an ether is much lower than that of its isomeric alcohol because:", "opts": ["ethers cannot form intermolecular hydrogen bonds with each other", "ethers have higher molar masses", "ethers are ionic", "ethers contain double bonds"], "ans": "A", "exp": "Although an ether can accept a hydrogen bond, it has no O-H to donate, so ether molecules associate only weakly and escape much more easily."}, {"n": 71, "section": "ETHERS", "q": "Which of the following is NOT a common use of diethyl ether?", "opts": ["Antifreeze", "Laboratory solvent", "Anaesthetic", "Starting fluid for engines"], "ans": "A", "exp": "Diethyl ether is prized as a solvent, was the classic surgical anaesthetic and is an engine starting fluid, but it boils far too low (35°C) to serve as antifreeze, which is a job for glycols."}, {"n": 72, "section": "AMINES & NITRILES", "q": "Ethylamine is a stronger base than ammonia because:", "opts": ["the N-H bonds are weaker in ethylamine", "ethylamine is aromatic", "it cannot be protonated", "the ethyl group donates electron density inductively, making nitrogen's lone pair more available"], "ans": "D", "exp": "The alkyl group pushes electron density (+I effect) onto nitrogen, concentrating charge on the lone pair and strengthening its hold on a proton. Gas-phase basicity rises from NH<sub>3</sub> through to tertiary amines."}, {"n": 73, "section": "AMINES & NITRILES", "q": "Aniline (phenylamine) is a weaker base than ethylamine because:", "opts": ["it is insoluble in water", "its nitrogen lone pair is delocalized into the benzene ring and less available for protonation", "it has no lone pair at all", "its molar mass is larger"], "ans": "B", "exp": "The lone pair participates in the ring's π system, so aniline's nitrogen shares it with the ring instead of offering it to a proton. Aliphatic amines have no such delocalization."}, {"n": 74, "section": "AMINES & NITRILES", "q": "A primary aliphatic amine reacts with cold dilute nitrous acid (HNO<sub>2</sub>) giving an alcohol and a colourless gas. The gas is:", "opts": ["hydrogen", "nitrogen", "oxygen", "nitrogen dioxide"], "ans": "B", "exp": "RNH<sub>2</sub> + HNO<sub>2</sub> → ROH + N<sub>2</sub> + H<sub>2</sub>O. The brisk, steady evolution of nitrogen (which turns limewater colourless... actually N<sub>2</sub> simply fails to re-light) distinguishes primary amines; secondary amines give an oily nitrosamine and no gas."}, {"n": 75, "section": "AMINES & NITRILES", "q": "Ethanenitrile (CH<sub>3</sub>CN) is completely reduced with H<sub>2</sub>/Ni or LiAlH<sub>4</sub>. The product is:", "opts": ["methylamine", "ethylamine", "ethanol", "ethane"], "ans": "B", "exp": "Reduction of a nitrile converts C≡N into CH<sub>2</sub>NH<sub>2</sub> without changing the carbon count: CH<sub>3</sub>CN (2 carbons) → CH<sub>3</sub>CH<sub>2</sub>NH<sub>2</sub>, a primary amine with one MORE carbon than the alkyl group attached to CN."}, {"n": 76, "section": "AMINES & NITRILES", "q": "Propanamide (CH<sub>3</sub>CH<sub>2</sub>CONH<sub>2</sub>) is treated with bromine and concentrated KOH (Hofmann degradation). The amine formed is:", "opts": ["propan-1-amine", "ethanamine", "methanamine", "butan-1-amine"], "ans": "B", "exp": "Hofmann degradation removes the carbonyl carbon: RCONH<sub>2</sub> → RNH<sub>2</sub> one carbon SHORTER. Propanamide (3 carbons) gives ethylamine (2 carbons), the mirror image of nitrile reduction."}, {"n": 77, "section": "AMINES & NITRILES", "q": "Tertiary amines boil LOWER than their isomeric primary and secondary amines because:", "opts": ["they are lighter molecules", "they have no N-H bond and cannot donate hydrogen bonds", "they are aromatic", "they contain double bonds"], "ans": "B", "exp": "With all three hydrogens on nitrogen replaced by alkyl groups, tertiary amines can only accept hydrogen bonds, so intermolecular attraction is weakest and the boiling point lowest for a given formula."}, {"n": 78, "section": "AMINES & NITRILES", "q": "When ammonia is exhaustively alkylated with excess iodomethane, the final product is:", "opts": ["methylamine", "trimethylamine only", "methane", "tetramethylammonium iodide"], "ans": "D", "exp": "Successive substitutions pass through the 1°, 2° and 3° amines until the quaternary salt (CH<sub>3</sub>)<sub>4</sub>N<sup>+</sup>I<sup>-</sup> forms, which can no longer donate a lone pair to react further."}, {"n": 79, "section": "AMINES & NITRILES", "q": "The fishy smell of amines can be removed by washing with dilute acid because:", "opts": ["the amine is converted into a non-volatile, water-soluble ionic salt", "the acid oxidizes the amine", "the smell dissolves in the acid", "amines react to give esters"], "ans": "A", "exp": "RNH<sub>2</sub> + HCl → RNH<sub>3</sub><sup>+</sup>Cl<sup>-</sup>. The ammonium salt is ionic, non-volatile and stays in the wash water, taking the odour with it."}, {"n": 80, "section": "REACTION MECHANISMS & TESTS", "q": "The correct order of carbocation stability is:", "opts": ["CH<sub>3</sub><sup>+</sup> > primary > secondary > tertiary", "tertiary > secondary > primary > CH<sub>3</sub><sup>+</sup>", "secondary > tertiary > primary > CH<sub>3</sub><sup>+</sup>", "primary > secondary > tertiary > CH<sub>3</sub><sup>+</sup>"], "ans": "B", "exp": "Alkyl groups stabilize the positive charge by inductive donation and hyperconjugation, so the more alkyl groups attached to the cationic carbon, the more stable the carbocation."}, {"n": 81, "section": "REACTION MECHANISMS & TESTS", "q": "In reaction mechanism terminology, a nucleophile is best described as:", "opts": ["an electron-pair donor seeking an electron-deficient centre", "an electron-pair acceptor", "a species that always bears a positive charge", "a free radical"], "ans": "A", "exp": "Nucleophiles (OH<sup>-</sup>, CN<sup>-</sup>, NH<sub>3</sub>, H<sub>2</sub>O) donate a lone pair to an electron-poor carbon; an electron-pair acceptor is the electrophile."}, {"n": 82, "section": "REACTION MECHANISMS & TESTS", "q": "The order of reactivity of alkyl halides towards the S<sub>N</sub>2 mechanism is:", "opts": ["tertiary > secondary > primary > methyl", "methyl > primary > secondary > tertiary", "secondary > primary > tertiary > methyl", "all react equally fast"], "ans": "B", "exp": "S<sub>N  "opts": ["an aldehyde, which reduces Ag<sup>+</sup> to metallic silver", "a ketone", "an alkene", "an amine"], "ans": "A", "exp": "RCHO + 2[Ag(NH<sub>3</sub>)<sub>2</sub>]<sup>+</sup> → RCOO<sup>-</sup> + 2Ag (mirror) + NH<sub>4</sub><sup>+</sup>. The aldehyde is oxidized while silver is reduced onto the glass; ketones stay negative."}, {"n": 87, "section": "REACTION MECHANISMS & TESTS", "q": "Bromine water is added separately to hexane and hex-1-ene in the DARK. The result is:", "opts": ["both decolourize immediately", "neither decolourizes", "only hex-1-ene decolourizes rapidly; hexane shows no reaction in the dark", "both give precipitates"], "ans": "C", "exp": "The alkene's π bond adds bromine instantly; the alkane needs UV light for radical substitution, so in the dark it leaves the bromine water orange."}, {"n": 88, "section": "REACTION MECHANISMS & TESTS", "q": "The simplest laboratory test to distinguish hexane from hex-1-ene is:", "opts": ["measure their densities", "add dilute NaOH", "heat both and compare flames", "add bromine water and watch for rapid decolourization"], "ans": "D", "exp": "Rapid decolourization of bromine water by hex-1-ene (addition to C=C) against no change for hexane cleanly separates the unsaturated from the saturated compound."}, {"n": 89, "section": "REACTION MECHANISMS & TESTS", "q": "2,4-dinitrophenylhydrazine (2,4-DNPH) gives a yellow/orange precipitate with:", "opts": ["alcohols and ethers", "alkenes", "amines", "aldehydes and ketones (carbonyl compounds)"], "ans": "D", "exp": "2,4-DNPH condenses with the C=O group to form bright hydrazones, making it the standard test that separates carbonyl compounds from alcohols and ethers."}, {"n": 90, "section": "REACTION MECHANISMS & TESTS", "q": "The iodoform test can be used to distinguish ethanol from methanol because:", "opts": ["both give yellow precipitates", "only ethanol (CH<sub>3</sub>CH<sub>2</sub>OH) contains the CH<sub>3</sub>CH(OH)- unit needed to give yellow CHI<sub>3</sub>", "methanol is insoluble", "ethanol is coloured"], "ans": "B", "exp": "The test needs a CH<sub>3</sub>CO- or CH<sub>3</sub>CH(OH)- fragment. Ethanol is first oxidized to ethanal by the reagent and then gives yellow iodoform; methanol cannot satisfy either condition."}, {"n": 91, "section": "REACTION MECHANISMS & TESTS", "q": "Alkaline hydrolysis (saponification) of a fat yields:", "opts": ["ethanol and ethanoic acid", "glucose", "glycerol and the sodium salts of fatty acids (soap)", "propane-1,2,3-triol and an aldehyde"], "ans": "C", "exp": "Boiling animal fat with NaOH breaks the ester links: glycerol is freed and the long-chain acids appear as their sodium salts, which is soap."}, {"n": 92, "section": "ORGANIC CALCULATIONS", "q": "A hydrocarbon is found to contain 82.8% carbon by mass. Its molecular formula could be:", "opts": ["C<sub>2</sub>H<sub>6</sub>", "C<sub>4</sub>H<sub>10</sub>", "C<sub>3</sub>H<sub>8</sub>", "C<sub>5</sub>H<sub>12</sub>"], "ans": "B", "exp": "Per 100 g: C = 82.8/12 = 6.9 mol; H = 17.2/1 = 17.2 mol; ratio C:H ≈ 1:2.5, i.e. 4:10, so C<sub>4</sub>H<sub>10</sub> (butane: 48/58 = 82.8% C)."}, {"n": 93, "section": "ORGANIC CALCULATIONS", "q": "An organic acid contains 40.0% carbon, 6.7% hydrogen and 53.3% oxygen. Its empirical formula is:", "opts": ["C<sub>2</sub>H<sub>4</sub>O", "CH<sub>2</sub>O", "CH<sub>4</sub>O", "CHO<sub>2</sub>"], "ans": "B", "exp": "Moles: 40/12 = 3.33, 6.7/1 = 6.7, 53.3/16 = 3.33. Dividing by 3.33 gives 1:2:1, so CH<sub>2</sub>O. (With M<sub>r</sub> = 60 this is ethanoic acid, C<sub>2</sub>H<sub>4</sub>O<sub>2</sub> = 2 × CH<sub>2</sub>O.)"}, {"n": 94, "section": "ORGANIC CALCULATIONS", "q": "10 cm<sup>3</sup> of a gaseous alkane requires exactly 50 cm<sup>3</sup> of oxygen for complete combustion (same conditions). The alkane is:", "opts": ["propane", "methane", "ethane", "butane"], "ans": "A", "exp": "Volume ratio alkane:O<sub>2</sub> = 10:50 = 1:5. From C<sub>n</sub>H<sub>2n+2</sub> + (3n+1)/2 O<sub>2</sub> → products, (3n+1)/2 = 5 gives n = 3: propane (C<sub>3</sub>H<sub>8</sub> + 5O<sub>2</sub>)."}, {"n": 95, "section": "ORGANIC CALCULATIONS", "q": "4.6 g of ethanol (M<sub>r</sub> = 46) is completely dehydrated to ethene. What volume of ethene is produced at s.t.p.? (molar volume = 22.4 dm<sup>3</sup>)", "opts": ["1.12 dm<sup>3</sup>", "4.48 dm<sup>3</sup>", "22.4 dm<sup>3</sup>", "2.24 dm<sup>3</sup>"], "ans": "D", "exp": "Moles of ethanol = 4.6/46 = 0.1. Dehydration is 1:1, so 0.1 mol of ethene forms: 0.1 × 22.4 = 2.24 dm<sup>3</sup>."}, {"n": 96, "section": "ORGANIC CALCULATIONS", "q": "6.0 g of a monobasic carboxylic acid is exactly neutralized by 4.0 g of NaOH (M<sub>r</sub> = 40). The molar mass of the acid is:", "opts": ["30 g", "45 g", "90 g", "60 g"], "ans": "D", "exp": "NaOH moles = 4.0/40 = 0.1. A monobasic acid reacts 1:1, so acid moles = 0.1, giving M = 6.0/0.1 = 60 g mol<sup>-1</sup> (ethanoic acid, CH<sub>3</sub>COOH)."}, {"n": 97, "section": "ORGANIC CALCULATIONS", "q": "A hydrocarbon contains 85.7% carbon by mass. A possible molecular formula is:", "opts": ["C<sub>3</sub>H<sub>8</sub>", "C<sub>2</sub>H<sub>6</sub>", "C<sub>3</sub>H<sub>6</sub>", "C<sub>4</sub>H<sub>10</sub>"], "ans": "C", "exp": "85.7% C fits the CH<sub>2</sub> unit (12/14 = 85.7%), the signature of the C<sub>n</sub>H<sub>2n</sub> family, so C<sub>3</sub>H<sub>6</sub> qualifies (it could be propene or cyclopropane). The others are C<sub>n</sub>H<sub>2n+2</sub> members with lower carbon percentages."}, {"n": 98, "section": "ORGANIC CALCULATIONS", "q": "What total volume of CO<sub>2</sub> at s.t.p. is produced when 6.0 g of ethane (M<sub>r</sub> = 30) is completely burned?", "opts": ["2.24 dm<sup>3</sup>", "4.48 dm<sup>3</sup>", "11.2 dm<sup>3</sup>", "8.96 dm<sup>3</sup>"], "ans": "D", "exp": "Moles of ethane = 6.0/30 = 0.2. From 2C<sub>2</sub>H<sub>6</sub> + 7O<sub>2</sub> → 4CO<sub>2</sub> + 6H<sub>2</sub>O, each mole of ethane gives 2 moles of CO<sub>2</sub>: 0.4 mol × 22.4 = 8.96 dm<sup>3</sup>."}, {"n": 99, "section": "ORGANIC CALCULATIONS", "q": "8.8 g of an ester (M<sub>r</sub> = 88) is hydrolysed with aqueous alkali to give ethanol and the sodium salt of a carboxylic acid. The ester is:", "opts": ["ethyl methanoate", "methyl propanoate", "ethyl ethanoate", "propyl methanoate"], "ans": "C", "exp": "The ester must be made from ethanol (to release it) and ethanoic acid (to give sodium ethanoate): CH<sub>3</sub>COOC<sub>2</sub>H<sub>5</sub>, whose M<sub>r</sub> is 88. Methyl propanoate also has M<sub>r</sub> = 88 but hydrolyses to methanol, so it fails the stated products."}, {"n": 100, "section": "ORGANIC CALCULATIONS", "q": "7.0 g of a gaseous alkene occupies 5.6 dm<sup>3</sup> at s.t.p. (molar volume = 22.4 dm<sup>3</sup>). The alkene is:", "opts": ["propene", "ethene", "but-1-ene", "ethyne"], "ans": "B", "exp": "Moles of gas = 5.6/22.4 = 0.25, so M<sub>r</sub> = 7.0/0.25 = 28. The C<sub>n</sub>H<sub>2n</sub> member with M<sub>r</sub> = 28 is C<sub>2</sub>H<sub>4</sub>, ethene."}]}

var cur=null,picks=[],graded=false;

/* ---------- hub ---------- */
function renderHub(){
  var el=document.getElementById('hubcards');
  el.innerHTML='';
  Object.keys(QUIZZES).forEach(function(id){
    var z=QUIZZES[id];
    var secs={};z.data.forEach(function(q){secs[q.section]=1;});
    var card=document.createElement('div');
    card.className='hubcard';card.style.setProperty('--c',z.color);
    card.innerHTML='<h2>'+z.icon+' '+z.title+'</h2><p>'+z.desc+'</p>'+
      '<div class="chips"><span class="chip">'+z.data.length+' questions</span><span class="chip gold">'+Object.keys(secs).length+' topics</span><span class="chip">Explanations + tutor</span></div>'+
      '<button onclick="openQuiz(\''+id+'\')">Start</button>';
    el.appendChild(card);
  });
}
function backToHub(){
  tutClose();
  document.getElementById('quizview').style.display='none';
  document.getElementById('qbar').style.display='none';
  document.getElementById('hub').style.display='block';
  window.scrollTo({top:0});
}
function openQuiz(id){
  cur=id;picks=Array(QUIZZES[id].data.length).fill(null);graded=false;
  document.getElementById('hub').style.display='none';
  document.getElementById('quizview').style.display='block';
  document.getElementById('qbar').style.display='block';
  var z=QUIZZES[id];
  document.getElementById('qhero').innerHTML='<h1>'+z.icon+' '+z.title+'</h1><p>'+z.data.length+' questions. Pick A, B, C or D, submit, and see every explanation. Tap &#127891; Tutor on any question.</p>';
  updProg();
  var main=document.getElementById('qmain');main.innerHTML='';
  var lastSec=null;
  z.data.forEach(function(q,i){
    if(q.section!==lastSec){lastSec=q.section;
      var sh=document.createElement('div');sh.className='sechead';sh.textContent=q.section;main.appendChild(sh);}
    var card=document.createElement('div');card.className='card';card.id='c'+i;
    var optsHtml=q.opts.map(function(o,k){return '<div class="opt" id="o'+i+'_'+k+'" onclick="pick('+i+','+k+')"><b>'+'ABCD'[k]+'</b><span>'+o+'</span></div>';}).join('');
    card.innerHTML='<div class="qmeta"><span class="qnum">Q'+(i+1)+'</span><span class="qtag">'+(i+1)+' of '+z.data.length+'</span></div>'+
      '<div class="qtext">'+q.q+'</div>'+optsHtml+
      '<div class="verdict" id="v'+i+'"></div>'+
      '<div class="expl"><b>EXPLANATION</b><br>'+q.exp+'</div>'+
      '<button class="tutbtn" onclick="tutOpen('+i+')">&#127891; Ask the Tutor about this question</button>';
    main.appendChild(card);
  });
  var sc=document.createElement('div');sc.className='score';sc.id='score';
  sc.innerHTML='<div class="n" id="scoreN"></div><div class="d" id="scoreD"></div><div class="m" id="scoreM"></div>';
  main.appendChild(sc);
  document.getElementById('submit').style.display='block';
  document.getElementById('reset').style.display='none';
  window.scrollTo({top:0});
}
function updProg(){
  document.getElementById('qprog').textContent=QUIZZES[cur].title+' · '+picks.filter(function(p){return p!==null;}).length+' / '+picks.length+' answered';
}
function pick(i,j){
  if(graded)return;
  picks[i]=j;
  for(var k=0;k<4;k++)document.getElementById('o'+i+'_'+k).classList.toggle('sel',k===j);
  updProg();
}
function grade(){
  if(graded||!cur)return;
  var data=QUIZZES[cur].data,un=picks.filter(function(p){return p===null;}).length,correct=0;
  data.forEach(function(q,i){
    var a='ABCD'.indexOf(q.ans);
    for(var k=0;k<4;k++){
      var el=document.getElementById('o'+i+'_'+k);
      el.classList.add('dis');el.classList.remove('sel');
      if(k===a)el.classList.add('correct');
      else if(picks[i]===k)el.classList.add('miss');
    }
    var card=document.getElementById('c'+i),v=document.getElementById('v'+i);
    card.classList.add('done');
    if(picks[i]===a){correct++;card.classList.add('right');v.textContent='✔ Correct';v.className='verdict ok';}
    else{card.classList.add('wrong');v.textContent=picks[i]===null?'— Not answered':'✘ Wrong';v.className='verdict no';}
  });
  graded=true;
  var pct=Math.round(correct/data.length*100);
  document.getElementById('scoreN').textContent=correct+'/'+data.length;
  document.getElementById('scoreD').textContent=correct+' correct · '+(data.length-correct-un)+' wrong · '+un+' unanswered · '+pct+'%';
  document.getElementById('scoreM').textContent=pct>=70?'Excellent — pass mark cleared.':(pct>=50?'Fair. Review the explanations and retake.':'Study the explanations below, then retake.');
  document.getElementById('score').classList.add('show');
  document.getElementById('submit').style.display='none';
  document.getElementById('reset').style.display='block';
  document.getElementById('score').scrollIntoView({behavior:'smooth'});
}
function resetAll(){
  tutClose();
  openQuiz(cur);
}

var MUS={ctx:null,master:null,evq:[],ci:0,nextChordT:0,timer:null,on:false,userStopped:false};
MUS.prog=[
 {b:36,notes:[60,64,67],mel:[[0,76],[2,79],[4,84],[8,83],[10,79],[12,76]]},
 {b:35,notes:[59,62,67],mel:[[0,74],[2,71],[4,74],[8,76],[10,74],[12,71]]},
 {b:33,notes:[57,60,64],mel:[[0,72],[2,76],[4,81],[8,79],[10,76],[12,72]]},
 {b:29,notes:[57,60,65],mel:[[0,69],[2,72],[4,77],[8,76],[10,72],[12,69]]}
];
function mf(m){return 440*Math.pow(2,(m-69)/12);}
MUS.init=function(){if(MUS.ctx)return;
  MUS.ctx=new (window.AudioContext||window.webkitAudioContext)();
  var lp=MUS.ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;
  MUS.master=MUS.ctx.createGain();MUS.master.gain.value=1.0;
  MUS.master.connect(lp);lp.connect(MUS.ctx.destination);
  var dl=MUS.ctx.createDelay(1);dl.delayTime.value=0.29;
  var fb=MUS.ctx.createGain();fb.gain.value=0.3;
  var wet=MUS.ctx.createGain();wet.gain.value=0.16;
  lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(MUS.ctx.destination);};
MUS.note=function(t,f,vel,dur){
  var g=MUS.ctx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vel,t+0.012);
  g.gain.exponentialRampToValueAtTime(Math.max(vel*0.3,0.001),t+0.25);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  g.connect(MUS.master);
  var p=[[1,'sine',1],[2,'sine',0.3],[3,'triangle',0.09]];
  p.forEach(function(h){
    var o=MUS.ctx.createOscillator();o.type=h[1];o.frequency.value=f*h[0];
    var og=MUS.ctx.createGain();og.gain.value=h[2];
    o.connect(og);og.connect(g);o.start(t);o.stop(t+dur+0.15);});};
MUS.padn=function(t,f,dur){
  var g=MUS.ctx.createGain();
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(0.034,t+1.3);
  g.gain.setValueAtTime(0.034,Math.max(t+1.3,t+dur-1.5));
  g.gain.linearRampToValueAtTime(0,t+dur);
  var o=MUS.ctx.createOscillator();o.type='sine';o.frequency.value=f;
  o.connect(g);g.connect(MUS.master);o.start(t);o.stop(t+dur+0.15);};
MUS.chordEvents=function(t0,ci){
  var ch=MUS.prog[ci%4],len=6.4,E=[],i;
  E.push({t:t0,k:'pad',f:mf(ch.b+12),d:len});
  ch.notes.forEach(function(n){E.push({t:t0,k:'pad',f:mf(n),d:len});});
  E.push({t:t0,k:'note',f:mf(ch.b),v:0.13,d:2.8});
  ch.notes.forEach(function(n){E.push({t:t0,k:'note',f:mf(n),v:0.07,d:1.7});});
  var seq=[0,1,2,1];
  for(i=2;i<16;i+=2){if(i%8!==0){E.push({t:t0+i*0.4,k:'note',f:mf(ch.notes[seq[(i/2)%4]]),v:0.03,d:0.5});}}
  ch.mel.forEach(function(m){E.push({t:t0+m[0]*0.4,k:'note',f:mf(m[1]),v:0.11,d:0.85});});
  return E;};
MUS.pump=function(){
  if(!MUS.on)return;
  var ahead=MUS.ctx.currentTime+1.7;
  while(MUS.nextChordT<ahead){
    MUS.chordEvents(MUS.nextChordT,MUS.ci).forEach(function(e){MUS.evq.push(e);});
    MUS.ci++;MUS.nextChordT+=6.4;
  }
  var now=MUS.ctx.currentTime;
  MUS.evq=MUS.evq.filter(function(e){
    if(!e.done&&e.t<=ahead){
      if(e.k==='pad')MUS.padn(e.t,e.f,e.d);else MUS.note(e.t,e.f,e.v,e.d);
      e.done=true;
    }
    return !(e.done&&e.t+e.d+0.3<now);
  });};
MUS.ui=function(on){var b=document.getElementById('mus');if(!b)return;b.textContent=on?'\u23f8':'\u266a';b.classList.toggle('playing',on);};
MUS.start=function(){MUS.init();MUS.ctx.resume();if(MUS.on)return;MUS.on=true;MUS.ci=0;MUS.evq=[];MUS.nextChordT=MUS.ctx.currentTime+0.1;MUS.timer=setInterval(MUS.pump,250);MUS.pump();MUS.ui(true);};
MUS.stop=function(){if(!MUS.on)return;MUS.on=false;clearInterval(MUS.timer);MUS.evq=[];MUS.ui(false);};
function musToggle(){if(MUS.on){MUS.userStopped=true;MUS.stop();}else{MUS.userStopped=false;MUS.start();}}
MUS.autostart=function(){if(MUS.on||MUS.userStopped)return;try{MUS.start();}catch(e){}};
window.addEventListener('load',function(){setTimeout(MUS.autostart,300);});
['touchstart','pointerdown','keydown'].forEach(function(ev){document.addEventListener(ev,MUS.autostart,{capture:true});});

/* ---------- live AI tutor ---------- */
var API='https://superagent-ccb075d2.base44.app/functions/';
var TUT={q:-1,hist:[],open:false,voice:true,rec:null,recChunks:[],listening:false,busy:false};
function tutOpen(i){
  TUT.q=i;TUT.hist=[];
  var q=QUIZZES[cur].data[i];
  document.getElementById('tutsub').textContent='Question '+(i+1)+' · '+QUIZZES[cur].title;
  var chat=document.getElementById('tutchat');chat.innerHTML='';
  var pickTxt=picks[i]===null?'(not answered)':'the student chose '+'ABCD'[picks[i]];
  addMsg('t',"Hi! I'm your tutor for question "+(i+1)+". I can see the full question and your answer — ask me anything, or tap the mic and just talk.");
  addMsg('t','This question: '+stripTags(q.q)+' Options: '+q.opts.map(function(o,k){return 'ABCD'[k]+'. '+stripTags(o);}).join('  ')+' — '+pickTxt+', and the correct answer is '+q.ans+'.');
  document.getElementById('tutchips').innerHTML='';
  [['Explain this simply',0],['Why is the correct answer right?',1],['Where do students usually slip here?',2]].forEach(function(c){
    var b=document.createElement('button');b.textContent=c[0];
    b.onclick=function(){tutAsk(c[0]);};document.getElementById('tutchips').appendChild(b);});
  document.getElementById('tutor').classList.add('open');
  TUT.open=true;updStatus(navigator.onLine?'Online — mic and voice live':'Offline mode — voice tutor needs internet');
  if(navigator.onLine)setTimeout(function(){tutSpeak("Hi! I'm your tutor for question "+(i+1)+". Ask me anything about it.");},250);
}
function tutClose(){
  TUT.open=false;micStop();
  document.getElementById('tutor').classList.remove('open');
  try{speechSynthesis.cancel();}catch(e){}
}
function stripTags(s){var d=document.createElement('div');d.innerHTML=s;return d.textContent.replace(/\s+/g,' ').trim();}
function addMsg(cls,txt){
  var chat=document.getElementById('tutchat');
  var m=document.createElement('div');m.className='tutmsg '+cls;m.textContent=txt;
  chat.appendChild(m);chat.scrollTop=chat.scrollHeight;return m;
}
function updStatus(s){document.getElementById('tutstatus').textContent=s;}
function tutSend(){
  var inp=document.getElementById('tuttxt');
  var t=inp.value.trim();if(!t)return;
  inp.value='';tutAsk(t);
}
function tutAsk(t){
  if(TUT.busy||TUT.q<0)return;
  addMsg('s',t);TUT.hist.push({role:'student',text:t});
  TUT.busy=true;updStatus('Thinking...');
  var q=QUIZZES[cur].data[TUT.q];
  var ctx={quiz:QUIZZES[cur].title,qnum:TUT.q+1,q:stripTags(q.q),opts:q.opts.map(stripTags),pick:picks[TUT.q]===null?null:'ABCD'[picks[TUT.q]],ans:q.ans,exp:stripTags(q.exp)};
  fetch(API+'quizTutor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({msg:t,ctx:ctx,history:TUT.hist.slice(0,-1)})})
   .then(function(r){return r.json();})
   .then(function(j){
     TUT.busy=false;
     var reply=String(j.reply||'');
     if(!reply||j.err){offlineExplain(t);return;}
     addMsg('t',reply);TUT.hist.push({role:'tutor',text:reply});
     updStatus(navigator.onLine?'Online':'');tutSpeak(reply);
     if(TUT.listening)setTimeout(micStart,600);
   })
   .catch(function(){TUT.busy=false;offlineExplain(t);});
}
function offlineExplain(t){
  var q=QUIZZES[cur].data[TUT.q];
  var line='Offline mode, so here is the built-in explanation: '+stripTags(q.exp);
  addMsg('sys','Live tutor needs internet. Reading the saved explanation instead.');
  addMsg('t',line);updStatus('Offline');tutSpeak(line);
}
function tutSpeak(text){
  if(!TUT.open||!TUT.voice)return;
  fetch(API+'airconnectTts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:String(text).slice(0,900)})})
   .then(function(r){if(!r.ok)throw 0;return r.blob();})
   .then(function(blob){
     var a=new Audio(URL.createObjectURL(blob));
     a.onended=function(){if(TUT.listening&&navigator.onLine)setTimeout(micStart,500);};
     a.play().catch(function(){sayFallback(text);});
   })
   .catch(function(){sayFallback(text);});
}
function sayFallback(text){
  try{
    var u=new SpeechSynthesisUtterance(String(text).slice(0,600));
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}
/* mic: record -> STT -> auto-ask, loop while open */
function micToggle(){
  if(TUT.listening){micStop();updStatus('');}
  else{micStart();}
}
function micStart(){
  if(TUT.listening||TUT.busy)return;
  if(!navigator.onLine){addMsg('sys','Voice input needs internet. Type your question instead.');updStatus('Offline');return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){addMsg('sys','This browser cannot record audio. Type your question instead.');return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var mime='audio/webm';
    try{TUT.rec=new MediaRecorder(stream,{mimeType:mime});}catch(e){TUT.rec=new MediaRecorder(stream);}
    TUT.recChunks=[];
    TUT.rec.ondataavailable=function(ev){if(ev.data&&ev.data.size)TUT.recChunks.push(ev.data);};
    TUT.rec.onstop=function(){
      stream.getTracks().forEach(function(tr){tr.stop();});
      var blob=new Blob(TUT.recChunks,{type:'audio/webm'});
      if(blob.size<2000){if(TUT.listening)setTimeout(micStart,300);return;}
      var fr=new FileReader();
      fr.onload=function(){
        updStatus('Transcribing...');
        fetch(API+'airconnectStt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({audio:fr.result})})
         .then(function(r){return r.json();})
         .then(function(j){
           var t=String(j.text||'').trim();
           if(t){tutAsk(t);}else{updStatus('');if(TUT.listening)setTimeout(micStart,300);}
         })
         .catch(function(){updStatus('Mic error');micStop();});
      };
      fr.readAsDataURL(blob);
    };
    TUT.rec.start();
    TUT.listening=true;
    document.getElementById('tutmic').classList.add('rec');
    updStatus('Listening... speak now (tap mic to stop)');
  }).catch(function(){addMsg('sys','Microphone unavailable. Type your question instead.');});
}
function micStop(){
  TUT.listening=false;
  document.getElementById('tutmic').classList.remove('rec');
  if(TUT.rec&&TUT.rec.state!=='inactive'){try{TUT.rec.stop();}catch(e){}}
  TUT.rec=null;
}
