<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>Study Hub — Chemistry Practice</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#F0F2F5;color:#111827;margin:0;padding-bottom:96px}
.hubhero{background:linear-gradient(135deg,#00785F 0%,#00A884 55%,#0BD4A0 100%);padding:34px 20px 30px;color:#fff;position:relative;overflow:hidden}
.hubhero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08);top:-70px;right:-50px}
.hubhero::before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.10);bottom:-50px;left:-30px}
.hubhero h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.01em}
.hubhero p{margin:6px 0 0;font-size:13.5px;opacity:.93}
.hubwrap{max-width:680px;margin:0 auto;padding:18px 14px 30px}
.hubcards{display:flex;flex-direction:column;gap:14px}
.hubcard{background:#fff;border-radius:18px;padding:18px 18px 16px;box-shadow:0 2px 10px rgba(15,23,42,.08);border-left:5px solid var(--c);position:relative}
.hubcard h2{margin:0 0 4px;font-size:17px;font-weight:800;color:#0F172A}
.hubcard p{margin:0 0 12px;font-size:12.5px;color:#64748B;line-height:1.5}
.hubcard .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.hubcard .chip{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:20px;background:#F1F5F9;color:#475569}
.hubcard .chip.gold{background:#FEF3C7;color:#92400E}
.hubcard button{width:100%;padding:13px 0;border:none;border-radius:12px;background:var(--c);color:#fff;font-size:14px;font-weight:800;cursor:pointer}
.hubcard button:active{filter:brightness(.94)}
.hubnote{margin-top:18px;font-size:11.5px;color:#94A3B8;text-align:center;line-height:1.6}
.sticky{position:fixed;top:0;left:0;right:0;background:rgba(0,168,132,.96);color:#fff;font-size:12px;font-weight:600;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;z-index:50;backdrop-filter:blur(6px)}
.sticky button{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px;cursor:pointer}
main{max-width:680px;margin:0 auto;padding:16px 14px 0}
.hero{background:#00A884;padding:24px 20px 26px;color:#fff}
.hero h1{margin:0;font-size:21px;font-weight:800}
.hero p{margin:6px 0 0;font-size:12.5px;opacity:.92}
.sechead{margin:26px 2px 10px;font-size:12px;font-weight:800;letter-spacing:.09em;color:#00875F;text-transform:uppercase}
.card{background:#fff;border-radius:14px;padding:16px 16px 14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.08);border:1.5px solid transparent}
.card.right{border-color:rgba(0,168,132,.55)}
.card.wrong{border-color:rgba(239,68,68,.5)}
.qmeta{display:flex;gap:8px;align-items:baseline;margin-bottom:8px}
.qnum{font-size:11px;font-weight:800;color:#fff;background:#00A884;border-radius:8px;padding:3px 8px;flex:0 0 auto}
.qtag{font-size:10.5px;color:#94A3B8;font-weight:600}
.qtext{font-size:14.5px;font-weight:600;line-height:1.55;margin-bottom:12px}
.opt{display:flex;gap:10px;align-items:center;padding:11px 12px;border:1.5px solid #E2E8F0;border-radius:11px;margin-bottom:8px;cursor:pointer;font-size:13.5px;line-height:1.45}
.opt b{font-size:11px;color:#00A884;border:1.5px solid #00A884;border-radius:7px;padding:1px 7px;flex:0 0 auto;font-weight:800}
.opt.sel{border-color:#00A884;background:#F0FDF9}
.opt.dis{cursor:default}
.opt.correct{border-color:#00A884;background:#ECFDF5}
.opt.miss{border-color:#EF4444;background:#FEF2F2}
.verdict{font-size:13px;font-weight:800;margin:2px 0 8px;display:none}
.verdict.ok{color:#059669;display:block}
.verdict.no{color:#DC2626;display:block}
.expl{display:none;font-size:12.5px;color:#334155;background:#F8FAFC;border-radius:10px;padding:10px 12px;line-height:1.6;margin-top:4px}
.card.done .expl{display:block}
.tutbtn{display:none;width:100%;margin-top:10px;padding:10px 0;border:1.5px solid #00A884;background:#fff;color:#00875F;border-radius:10px;font-size:12.5px;font-weight:800;cursor:pointer}
.card.done .tutbtn{display:block}
.tutbtn:active{background:#F0FDF9}
.score{display:none;background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(15,23,42,.1);text-align:center;margin:8px 0 22px}
.score.show{display:block}
.score .n{font-size:34px;font-weight:800;color:#0F172A}
.score .d{font-size:12px;color:#64748B;margin:6px 0 10px}
.score .m{font-size:13px;font-weight:700;color:#00875F}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #E2E8F0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:50}
.barin{max-width:680px;margin:0 auto;display:flex;gap:10px}
.barin button{flex:1;padding:13px 0;border:none;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer}
#submit{background:#00A884;color:#fff}
#reset{background:#fff;color:#00A884;border:1.5px solid #00A884}
#mus{position:fixed;right:14px;bottom:calc(88px + env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;border:none;background:#fff;color:#00A884;font-size:20px;line-height:1;box-shadow:0 2px 10px rgba(15,23,42,.18);z-index:60;display:flex;align-items:center;justify-content:center;cursor:pointer}
#mus.playing{background:#00A884;color:#fff}
#tutor{position:fixed;left:0;right:0;bottom:0;max-height:78vh;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(15,23,42,.25);z-index:90;display:none;flex-direction:column}
#tutor.open{display:flex}
.tuthead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #E2E8F0}
.tuthead b{font-size:14px;color:#0F172A}
.tuthead small{display:block;font-size:11px;color:#94A3B8;font-weight:600}
.tuthead button{background:#F1F5F9;border:none;color:#475569;font-size:12px;font-weight:800;padding:6px 12px;border-radius:9px;cursor:pointer}
.tutchat{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.tutmsg{max-width:85%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.55}
.tutmsg.t{background:#F0FDF9;color:#0F172A;border-bottom-left-radius:4px;align-self:flex-start}
.tutmsg.s{background:#00A884;color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.tutmsg.sys{background:#FEF3C7;color:#92400E;align-self:center;font-size:11.5px;text-align:center;max-width:95%}
.tutchips{display:flex;gap:8px;padding:0 16px 8px;flex-wrap:wrap}
.tutchips button{background:#F1F5F9;border:none;color:#0F172A;font-size:11.5px;font-weight:700;padding:7px 11px;border-radius:20px;cursor:pointer}
.tutin{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #E2E8F0;align-items:center}
#tutmic{width:46px;height:46px;border-radius:50%;border:none;background:#00A884;color:#fff;font-size:17px;cursor:pointer;flex:0 0 auto}
#tutmic.rec{background:#EF4444;animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}70%{box-shadow:0 0 0 14px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
#tuttxt{flex:1;border:1.5px solid #E2E8F0;border-radius:22px;padding:11px 14px;font-size:13.5px;outline:none;font-family:inherit}
#tutsend{width:46px;height:46px;border-radius:50%;border:none;background:#0F172A;color:#fff;font-size:15px;cursor:pointer;flex:0 0 auto}
.tutstatus{font-size:11px;color:#94A3B8;text-align:center;padding:0 0 6px}
</style></head><body>

<div id="hub">

<script>
var QUIZZES={
 chm102:{title:"CHM102 & General Principles",desc:" kinetics, mechanisms, stereochemistry, acids and bases, electrochemistry and more.",color:"#2563EB",icon:"&#128300;",data:[{"n": 1, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "For a reaction following pseudo-first-order kinetics, such as the acid-catalyzed hydrolysis of methyl ethanoate: CH3COOCH3 + H2O → CH3OH + CH3COOH. Which statement best explains why the reaction displays overall first-order behavior despite involving two reactants?", "opts": ["Water acts as a catalyst and is regenerated at the end of the step.", "Water is present in such large excess that its concentration remains virtually constant.", "The rate constant k is independent of temperature.", "The activation energy for water is zero."], "ans": "B", "exp": "In pseudo-first-order reactions (like ester hydrolysis in water), water is present in such large excess that its concentration remains virtually constant. Thus, k'[H2O] is combined into an effective single rate constant k, giving Rate = k[ester]."}, {"n": 2, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "A first-order reaction has a rate constant k. What fraction of the original reactant concentration [A]0 remains after a time equal to t = (ln 3) / k?", "opts": ["1/3", "2/3", "1/e3", "3/4"], "ans": "A", "exp": "For 1st order kinetics, ln([A]0 / [A]t) = kt. Substituting t = (ln 3) / k yields k · [(ln 3)/k] = ln 3. Thus, [A]0 / [A]t = 3, so [A]t = (1/3)[A]0."}, {"n": 3, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "If the plot of 1/[A] against time t yields a straight line with a positive slope k, what are the correct units for k assuming concentration is in mol·L-1 and time is in seconds?", "opts": ["s-1", "L·mol-1·s-1", "mol·L-1·s-1", "L2·mol-2·s-1"], "ans": "B", "exp": "The second-order integrated rate law is 1/[A]t - 1/[A]0 = kt. Units of 1/[A] are L/mol. Dividing by time (s) gives L·mol-1·s-1 (or M-1s-1)."}, {"n": 4, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "Consider a zero-order reaction A → Product. If the initial concentration [A]0 is doubled, how does the half-life t1/2 change?", "opts": ["It remains unchanged.", "It is halved.", "It doubles.", "It increases by a factor of four ."], "ans": "C", "exp": "For zero-order reactions, t1/2 = [A]0 / (2k). The half-life is directly proportional to initial concentration [A]0. Doubling [A]0 doubles t1/2."}, {"n": 5, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "Data from a sucrose hydrolysis experiment shows concentration decreasing over time: t=0 h, [S]=0.50 M; t=0.51 h, [S]=0.45 M; t=1.0 h, [S]=0.404 M; t=1.5 h, [S]=0.363 M. Which mathematical property confirms this process is first-order?", "opts": ["[A]t - [A]0 is constant over equal time intervals.", "The ratio [A]t / [A]0 decreases linearly with time.", "The natural log ratio ln([A]0 / [A]t) / t remains approximately constant.", "t1/2 is directly proportional to [A]0."], "ans": "C", "exp": "First-order kinetics require k = (1/t) ln([A]0 / [A]t) to remain constant. Calculating at t=0.51h gives k ≈ 0.207 h-1, and at t=1.0h gives k ≈ 0.213 h-1, demonstrating constant rate behavior ."}, {"n": 6, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "For a second-order reaction A → Product with rate law Rate = k[A]2, if [A]0 = 0.086 M and k = 7 × 109 M-1s-1, why is solving for [A] at t = 20 min physically indicative of an extremely fast reaction?", "opts": ["Because k is extremely small, making half-life days long.", "Because k gives a half-life on the order of nanoseconds at 0.086 M, meaning reactant is virtually depleted in seconds.", "Second-order reactions cannot occur in solution.", "The half-life of a second-order reaction is independent of initial concentration."], "ans": "B", "exp": "t1/2 = 1 / (k[A]0) = 1 / [(7 × 109)(0.086)] ≈ 1.66 × 10-9 s. With a half-life in nanoseconds, the reactant is virtually depleted in seconds, making a 20-minute timeframe physically trivial."}, {"n": 7, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "Radioactive decay follows first-order kinetics. If a sample of a radioisotope degrades to 25% of its original activity in 10 hours, what is its half-life?", "opts": ["2.5 hours", "5.0 hours", "7.5 hours", "10.0 hours"], "ans": "B", "exp": "Decay to 25% (1/4) corresponds to 2 half-lives (100% → 50% → 25%). 2 t1/2 = 10 hours ⇒ t1/2 = 5.0 hours."}, {"n": 8, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "For the elementary step aA + bB → Products, the overall reaction order is defined as:", "opts": ["a × b", "a - b", "a + b", "a / b"], "ans": "C", "exp": "For an elementary step, the overall order is the sum of the stoichiometric coefficients of reactants in the rate law: Order = a + b."}, {"n": 9, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "In a zero-order reaction, what is the slope of the plot of reactant concentration [A] versus time t?", "opts": ["k", "-k", "-k / 2.303", "1 / k"], "ans": "B", "exp": "The zero-order equation is [A]t = -kt + [A]0. A plot of [A]t vs t is a straight line with slope = -k."}, {"n": 10, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "What is the fundamental difference in concentration dependency between the half-life of a 1st order reaction and a 2nd order reaction (A → Products)?", "opts": ["1st order half-life depends on [A]0; 2nd order half-life is independent of [A]0.", "1st order half-life is independent of [A]0; 2nd order half-life is inversely proportional to [A]0.", "Both are inversely proportional to [A]0.", "Both are directly proportional to [A]0."], "ans": "B", "exp": "First-order half-life t1/2 = (ln 2)/k (independent of initial concentration). Second-order half-life t1/2 = 1/ (k[A]0) (inversely proportional to [A]0)."}, {"n": 11, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "Enzymatic decomposition of ethanol in the human liver via alcohol dehydrogenase displays what reaction order under saturated enzyme conditions?", "opts": ["First order", "Second order", "Zero order", "Third order"], "ans": "C", "exp": "Under saturated enzyme conditions, all active sites are occupied. The reaction rate reaches maximum velocity (Vmax) and becomes independent of substrate concentration (zero order)."}, {"n": 12, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "The integrated rate law for a first-order reaction can be expressed as:", "opts": ["[A]t - [A]0 = -kt", "ln[A]t - ln[A]0 = -kt", "1/[A]t - 1/[A]0 = kt", "[A]t 2 - [A]0 2 = -kt"], "ans": "B", "exp": "Integration of -d[A]/[A] = k dt gives ln[A]t - ln[A]0 = -kt."}, {"n": 13, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "For the reaction C4H8 → 2C2H4 (cyclobutane to ethylene), if the rate of disappearance of C4H8 is 1.5 × 10-3 M·s-1, what is the rate of formation of C2H4?", "opts": ["0.75 × 10-3 M·s-1", "1.5 × 10-3 M·s-1", "3.0 × 10-3 M·s-1", "6.0 × 10-3 M·s-1"], "ans": "C", "exp": "Stoichiometry dictates 1 mol cyclobutane yields 2 mol ethylene. Rate of formation of ethylene = 2 × (rate of disappearance) = 2 × (1.5 × 10-3) = 3.0 × 10-3 M·s-1."}, {"n": 14, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "A plot of ln[A]t versus t gives a straight line. The intercept on the y-axis corresponds to:", "opts": ["-k", "[A]0", "ln[A]0", "t1/2"], "ans": "C", "exp": "Linear form: ln[A]t = -kt + ln[A]0 (y = mx + c). The y-intercept c = ln[A]0."}, {"n": 15, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "If a reaction's rate triples when the concentration of a reactant is tripled, what is the order with respect to that reactant?", "opts": ["0", "1", "2", "3 SECTION 2: ORGANIC REACTION TYPES & MECHANISMS"], "ans": "B", "exp": "Rate ∝ [A]n. Tripling [A] triples Rate (31 = 3), confirming order n = 1."}, {"n": 16, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "In the reaction of asymmetric alkenes with hydrogen halides (e.g., CH3-CH=CH2 + HBr), according to Markovnikov's rule, where does the hydrogen atom attach?", "opts": ["To the carbon with fewer hydrogen atoms.", "To the carbon that already carries the greater number of hydrogen atoms.", "Equally to both carbon atoms.", "To the halogen atom."], "ans": "B", "exp": "Markovnikov's rule states that hydrogen adds to the double-bond carbon containing more hydrogen atoms to generate the more stable carbocation intermediate."}, {"n": 17, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "Identify the major product formed when 2-methylbut-2-ene reacts with HBr in the absence of peroxides:", "opts": ["2-bromo-3-methylbutane", "2-bromo-2-methylbutane", "1-bromo-2-methylbutane", "3-bromo-2-methylbutane"], "ans": "B", "exp": "Protonation of 2-methylbut-2-ene yields a tertiary carbocation at C-2 rather than a secondary one at C-3. Bromide attacks C-2 to give 2-bromo-2-methylbutane."}, {"n": 18, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "What classification describes the conversion of ethyl chloride (CH3CH2Cl) to ethanol (CH3CH2OH) using aqueous NaOH?", "opts": ["Electrophilic addition", "Nucleophilic substitution", "Free-radical elimination", "Rearrangement"], "ans": "B", "exp": "Nucleophilic substitution occurs as OH- replaces Cl- on the alkyl substrate."}, {"n": 19, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "Which reagent acts as a reducing agent to convert aldehydes, ketones, or carboxylic acid derivatives to alcohols?", "opts": ["CrO3 / H2SO4", "LiAlH4", "KMnO4", "Br2 / FeBr3"], "ans": "B", "exp": "Lithium aluminium hydride (LiAlH4) donates hydride ions (H-) to reduce carbonyl and carboxyl functional groups to alcohols."}, {"n": 20, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "The acid-catalyzed dehydration of ethanol (CH3CH2OH + H2SO4 → CH2=CH2 + H2O) is an example of what reaction type?", "opts": ["Addition", "Substitution", "Elimination", "Oxidation"], "ans": "C", "exp": "Dehydration removes H and OH from adjacent carbon atoms to create an alkene double bond (elimination)."}, {"n": 21, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "In an addition polymerization reaction (such as n CH2=CH2 → -[CH2-CH2]n-):", "opts": ["Water is eliminated as a byproduct.", "Monomers join without eliminating any small molecules.", "Carbon dioxide is evolved.", "The polymer has a lower molecular weight than the monomer ."], "ans": "B", "exp": "In addition polymerization, double bonds open to form single bonds linking units without loss of any small molecules or atoms."}, {"n": 22, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "How does condensation polymerization differ fundamentally from addition polymerization?", "opts": ["Addition polymerization produces a byproduct like H2O, while condensation does not.", "Condensation polymerization involves the elimination of a small molecule (such as H2O or HCl), whereas addition polymerization does not eliminate any atoms.", "Condensation polymerization only occurs with alkanes.", "Addition polymerization requires ionic catalysts exclusively."], "ans": "B", "exp": "Condensation polymerization links monomers with simultaneous loss of small molecules (like water or HCl), whereas addition polymerization loses no atoms."}, {"n": 23, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "The conversion of 1-butene to 2-butene in the presence of an acid catalyst is classified as a(n):", "opts": ["Addition reaction", "Substitution reaction", "Rearrangement reaction", "Condensation reaction"], "ans": "C", "exp": "Isomerization of 1-butene to 2-butene rearranges atomic bonds within the molecule without altering molecular formula or adding/removing atoms."}, {"n": 24, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "In nucleophilic substitution (R-L + Nu- → R-Nu + L-), what role does L- play?", "opts": ["Substrate", "Electrophile", "Leaving group", "Catalyst"], "ans": "C", "exp": "In R-L + Nu- → R-Nu + L-, L- leaves with the bonding pair and is the leaving group."}, {"n": 25, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "Oxidation of a primary alcohol (CH3CH2OH) with a strong oxidizing agent like acidified CrO3 yields:", "opts": ["A secondary alcohol", "A ketone", "A carboxylic acid (CH3COOH)", "An alkane"], "ans": "C", "exp": "Primary alcohols oxidize first to aldehydes, which further oxidize under strong conditions (CrO3) to carboxylic acids."}, {"n": 26, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "Reduction involves which of the following processes in organic chemistry?", "opts": ["Gain of oxygen atoms", "Loss of hydrogen atoms", "Gain of hydrogen atoms or gain of electrons", "Loss of electrons only"], "ans": "C", "exp": "Organic reduction involves gaining hydrogen atoms, losing oxygen atoms, or gaining electrons."}, {"n": 27, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "What is the major product formed from the dehydrohalogenation of 2-bromobutane with alcoholic KOH?", "opts": ["1-butene", "2-butene", "Cyclobutane", "Butan-2-ol"], "ans": "B", "exp": "According to Zaitsev's rule, elimination yields the more substituted and thermodynamically stable alkene (2-butene as major product)."}, {"n": 28, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "What characterization applies to an electrophile in an organic mechanism?", "opts": ["Electron-pair donor (Lewis base)", "Electron-pair acceptor (Lewis acid)", "Neutral species with a full octet that donates protons", "An anion seeking positive charge"], "ans": "B", "exp": "Electrophiles are electron-loving species that act as Lewis acids by accepting electron pairs from electron- rich sources."}, {"n": 29, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "Which of the following species is a strong nucleophile?", "opts": ["H+", "NO2 +", "OH-", "BF3"], "ans": "C", "exp": "The hydroxide ion (OH-) carries a negative charge and unshared electron pairs, acting as a powerful nucleophile."}, {"n": 30, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "Hydrogenation of an alkene (CH2=CH2 + H2 → CH3-CH3) represents which pair of reaction categories?", "opts": ["Elimination and Oxidation", "Addition and Reduction", "Substitution and Hydrolysis", "Rearrangement and Condensation SECTION 3: STEREOCHEMISTRY & ISOMERISM"], "ans": "B", "exp": "Hydrogenation adds H2 across a double bond (addition) while reducing the oxidation state of the carbons (reduction)."}, {"n": 31, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "Propanone (CH3COCH3) and Propanal (CH3CH2CHO) are examples of:", "opts": ["Enantiomers", "Constitutional (functional group) isomers", "Diastereomers", "Geometric isomers"], "ans": "B", "exp": "Propanone and propanal share formula C3H6O but have different functional groups (ketone vs aldehyde), making them constitutional isomers."}, {"n": 32, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "Ethanol (CH3CH2OH) and Dimethyl ether (CH3OCH3) share the same molecular formula C2H6O. They are:", "opts": ["Stereoisomers", "Constitutional isomers", "Conformers", "Anomers"], "ans": "B", "exp": "Ethanol and dimethyl ether have identical molecular formulas (C2H6O) but different atom connectivity (constitutional isomers)."}, {"n": 33, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "What condition must be met for a carbon atom to be designated as a chiral (stereogenic) center?", "opts": ["It must be sp2 hybridized.", "It must be bonded to four different atoms or groups.", "It must be part of a double bond.", "It must be bonded to at least two hydrogen atoms."], "ans": "B", "exp": "A chiral center is an sp3 hybridized carbon attached to four completely distinct substituents."}, {"n": 34, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "Enantiomers are stereoisomers that are:", "opts": ["Superimposable mirror images", "Non-superimposable mirror images", "Non-mirror image stereoisomers", "Structural isomers with different connectivity"], "ans": "B", "exp": "Enantiomers are chiral stereoisomers that are non-superimposable mirror images of each other ."}, {"n": 35, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "Which physical property differs between two pure enantiomers?", "opts": ["Boiling point", "Melting point", "Direction of rotation of plane-polarized light", "Density"], "ans": "C", "exp": "Enantiomers have identical physical properties (bp, mp, density) except for the direction in which they rotate plane-polarized light."}, {"n": 36, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "A 50:50 (equimolar) mixture of two enantiomers is optically inactive. This mixture is called a:", "opts": ["Meso compound", "Racemic mixture (racemate)", "Polymer", "Anomer"], "ans": "B", "exp": "An equimolar 50:50 mixture of two enantiomers cancels out optical rotations, forming an optically inactive racemic mixture."}, {"n": 37, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "Consider 1,4-dimethylcyclohexane. The isomer with both methyl groups pointing in the same direction (e.g., both wedged/going out) is the:", "opts": ["Trans-isomer", "Cis-isomer", "Erythro-isomer", "Threo-isomer"], "ans": "B", "exp": "When both substituents lie on the same face of the ring (both pointing out/wedged), the structure is the cis- isomer ."}, {"n": 38, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "What is the key stereochemical distinction between cis and trans isomers in ring structures or double bonds?", "opts": ["They have different atom connectivity.", "They are non-superimposable mirror images.", "They are configurational stereoisomers that cannot interconvert without breaking bonds.", "They interconvert rapidly at room temperature without breaking bonds."], "ans": "C", "exp": "Cis/trans isomers are configurational stereoisomers that cannot interconvert without breaking carbon- carbon double bonds or ring bonds."}, {"n": 39, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "For a compound with two distinct chiral centers, what is the maximum theoretical number of stereoisomers according to the 2n rule?", "opts": ["2", "4", "6", "8"], "ans": "B", "exp": "Maximum stereoisomers = 2n. For n = 2 distinct chiral centers, 22 = 4 stereoisomers."}, {"n": 40, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "Erythro and Threo configurations (e.g., 3-bromo-2-butanol) are types of:", "opts": ["Constitutional isomers", "Diastereomers", "Enantiomers", "Tautomers"], "ans": "B", "exp": "Erythro and threo configurations describe pairs of stereoisomers with two chiral centers that are non- mirror images (diastereomers)."}, {"n": 41, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "A compound containing multiple chiral centers that possesses a plane of symmetry and is optically inactive is called a:", "opts": ["Racemate", "Meso compound", "Enantiomer", "Conformational isomer"], "ans": "B", "exp": "Meso compounds possess multiple chiral centers but also an internal symmetry plane, making the overall molecule achiral and optically inactive."}, {"n": 42, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "Dextrorotatory compounds rotate plane-polarized light in which direction?", "opts": ["Counter-clockwise (anti-clockwise)", "Clockwise", "180 degrees downwards", "They do not rotate light"], "ans": "B", "exp": "Dextrorotatory (+ or d) compounds rotate plane-polarized light in a clockwise direction."}, {"n": 43, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "Which of the following molecules contains a chiral carbon atom?", "opts": ["1-chlorobutane", "2-chlorobutane", "Propan-2-ol", "Ethene"], "ans": "B", "exp": "C-2 of 2-chlorobutane is bonded to four different groups (-H, -Cl, -CH3, -CH2CH3), making it chiral."}, {"n": 44, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "Optical activity is measured using an instrument called a:", "opts": ["Spectrophotometer", "Mass spectrometer", "Polarimeter", "Chromatograph"], "ans": "C", "exp": "A polarimeter measures the degree and direction of optical rotation of plane-polarized light passing through a chiral solution."}, {"n": 45, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "Why do enantiomers display identical chemical reactivity toward achiral reagents?", "opts": ["Because they have the same empirical formula only.", "Because their intermolecular forces and internal bond energies with achiral environments are identical.", "Because they interconvert instantaneously.", "Because they lack functional groups. SECTION 4: VALUE CREATION & PERSONAL DEVELOPMENT PRINCIPLES"], "ans": "B", "exp": "Enantiomers have identical internal bond distances, electron densities, and thermodynamic stability in achiral environments, reacting identically with achiral reagents."}, {"n": 46, "section": "VALUE CREATION & PERSONAL DEVELOPMENT PRINCIPLES", "q": "According to Principle 7 (Money Matters), a person will be successful in proportion to:", "opts": ["The number of hours they spend at work.", "Finding out what other successful people are doing and doing the same things over and over again.", "How much initial capital they inherit.", "The academic degree they hold."], "ans": "B", "exp": "Principle 7 states success comes in proportion to discovering what successful people do and repeating those actions consistently."}, {"n": 47, "section": "VALUE CREATION & PERSONAL DEVELOPMENT PRINCIPLES", "q": "In the context of Value Creation, how can an individual increase their overall value?", "opts": ["By working slower to reduce mistakes.", "By learning from experts, increasing speed of execution, and delivering specific results that others want.", "By keeping their skills secret.", "By avoiding new tasks."], "ans": "B", "exp": "Value creation increases by learning from experts, improving execution speed, and delivering targeted results that fulfill human needs."}, {"n": 48, "section": "VALUE CREATION & PERSONAL DEVELOPMENT PRINCIPLES", "q": "Under the Laws of Wealth, what is defined as \"The Law of Awareness\"?", "opts": ["You receive wealth automatically by wishing for it.", "To be conscious of the presence of something; you can never get a desire for what you are not aware of.", "Money flows only to those with high mathematical capability.", "Awareness is inversely proportional to effort."], "ans": "B", "exp": "The Law of Awareness defines consciousness of something as a prerequisite to desiring or attaining it."}, {"n": 49, "section": "VALUE CREATION & PERSONAL DEVELOPMENT PRINCIPLES", "q": "What is the first key way cited to increase your personal value in a professional context?", "opts": ["To demand a promotion prior to delivery.", "To do things faster and increase the speed at which you deliver specific results that other people want.", "To reduce the scope of your responsibilities.", "To delegate all tasks to subordinates."], "ans": "B", "exp": "The notes highlight that the first primary way to increase personal value is to increase speed of delivery for desired results."}, {"n": 50, "section": "VALUE CREATION & PERSONAL DEVELOPMENT PRINCIPLES", "q": "\"Learn from the Experts\" is listed as a primary pathway to value creation because:", "opts": ["Experts give away wealth directly.", "It allows you to add more value by acquiring tested knowledge faster and repeating proven actions.", "It eliminates the need for personal effort.", "It guarantees instant zero-order success."], "ans": "B", "exp": "Learning from experts compresses time by letting you acquire proven strategies and avoid redundant mistakes, maximizing value output."}]},
 org50:{title:"Organic Chemistry Practice Exam",desc:"classification, hydrocarbons, alcohols, ethers, amines and isomerism from your textbook.",color:"#00A884",icon:"&#128218;",data:[{"n": 1, "section": "ALCOHOLS & DEHYDRATION", "q": "A student attempts to dehydrate an unknown alcohol using concentrated H<sub>2</sub>SO<sub>4</sub>. The reaction proceeds rapidly at room temperature without requiring significant heating to yield an alkene. Which structure represents the original alcohol?", "opts": ["CH<sub>3</sub>OH", "CH<sub>3</sub>CH<sub>2</sub>OH", "CH<sub>3</sub>CH(OH)CH<sub>3</sub>", "(CH<sub>3</sub>)<sub>3</sub>COH"], "ans": "D", "exp": "Tertiary carbocations formed during dehydration are most stable."}, {"n": 2, "section": "ALKYNES", "q": "Ethyne gas prepared by reacting calcium carbide (CaC<sub>2</sub>) with water contains acidic and reducing gaseous impurities such as PH<sub>3</sub> and H<sub>2</sub>S. Which specific reagent is utilized to purify the product, and why?", "opts": ["Concentrated H<sub>2</sub>SO<sub>4</sub> to absorb water vapor", "Dilute Acidified CuSO<sub>4</sub> solution to precipitate impurities", "Potassium permanganate (KMnO<sub>4</sub>) to oxidize the impurities", "Sodium metal in dry ether to react with acidic hydrogens"], "ans": "B", "exp": "Acidified CuSO<sub>4</sub> removes impurities like H<sub>2</sub>S and PH<sub>3</sub>."}, {"n": 3, "section": "ALKANES", "q": "Consider the complete combustion of one mole of a straight-chain alkane. If the reaction requires 11 moles of oxygen gas (O<sub>2</sub>), what is the molecular formula of the alkane?", "opts": ["C<sub>5</sub>H<sub>12</sub>", "C<sub>7</sub>H<sub>16</sub>", "C<sub>8</sub>H<sub>18</sub>", "C<sub>9</sub>H<sub>20</sub>"], "ans": "B", "exp": "Combustion equation: C<sub>7</sub>H<sub>16</sub> + 11O<sub>2</sub> → 7CO<sub>2</sub> + 8H<sub>2</sub>O."}, {"n": 4, "section": "CLASSIFICATION & ISOMERISM", "q": "An unknown organic compound X has a molecular formula isomeric with ethanol (C<sub>2</sub>H<sub>6</sub>O). Compound X is completely insoluble in water and fails to react with sodium metal or oxidizing agents like acidified K<sub>2</sub>Cr<sub>2</sub>O<sub>7</sub>. What is compound X?", "opts": ["Ethanal", "Dimethyl ether", "Methanol", "Ethanoic acid"], "ans": "B", "exp": "Dimethyl ether is an unreactive functional group isomer of ethanol."}, {"n": 5, "section": "REACTION MECHANISMS", "q": "When 2-bromopropane is treated with metallic sodium in the presence of dry ether (Wurtz Reaction), what is the major organic product formed?", "opts": ["n-Butane", "2,3-Dimethylbutane", "Propane", "n-Hexane"], "ans": "B", "exp": "Wurtz coupling of two isopropyl radicals forms 2,3-dimethylbutane."}, {"n": 6, "section": "ALCOHOLS & DEHYDRATION", "q": "Which statement correctly explains why tertiary alcohols undergo dehydration to alkenes at a faster rate compared to primary alcohols?", "opts": ["Primary alcohols form steric hindrance preventing elimination.", "Tertiary alcohols form a more stable tertiary carbocation intermediate.", "Primary alcohols have lower boiling points than tertiary alcohols.", "Tertiary alcohols possess stronger intermolecular hydrogen bonds."], "ans": "B", "exp": "Tertiary carbocation intermediates have the lowest activation energy."}, {"n": 7, "section": "ALKANES: PHYSICAL PROPERTIES", "q": "Equal masses of methane (CH<sub>4</sub>), ethane (C<sub>2</sub>H<sub>6</sub>), propane (C<sub>3</sub>H<sub>8</sub>), and butane (C<sub>4</sub>H<sub>10</sub>) are compared. Which compound has the lowest boiling point, and what is the primary structural factor responsible?", "opts": ["Butane, due to high molecular mass", "Methane, due to weak van der Waals forces and small surface area", "Ethane, due to symmetry", "Propane, due to non-polar bonds"], "ans": "B", "exp": "Methane has the smallest molecular weight and lowest van der Waals surface area."}, {"n": 8, "section": "ALKANES: HALOGENATION", "q": "Methane (CH<sub>4</sub>) reacts with chlorine (Cl<sub>2</sub>) in the presence of ultraviolet light. If an excess of chlorine gas is supplied, what will be the final predominant product of the substitution chain reaction?", "opts": ["Chloromethane (CH<sub>3</sub>Cl)", "Dichloromethane (CH<sub>2</sub>Cl<sub>2</sub>)", "Tetrachloromethane (CCl<sub>4</sub>)", "Chloroethane (C<sub>2</sub>H<sub>5</sub>Cl)"], "ans": "C", "exp": "Excess Cl<sub>2</sub> leads to complete substitution to form CCl<sub>4</sub>."}, {"n": 9, "section": "REACTION MECHANISMS", "q": "A reaction between ethylmagnesium chloride (CH<sub>3</sub>CH<sub>2</sub>MgCl) and methanal (HCHO) followed by acid hydrolysis yields which type of organic product?", "opts": ["Methanol", "Propan-1-ol (Primary alcohol)", "Propan-2-ol (Secondary alcohol)", "Ethanoic acid"], "ans": "B", "exp": "Grignard reagent + methanal yields a primary alcohol (Propan-1-ol)."}, {"n": 10, "section": "REACTION MECHANISMS", "q": "Ethanol (CH<sub>3</sub>CH<sub>2</sub>OH) is heated with concentrated H<sub>2</sub>SO<sub>4</sub>. How does altering the reaction temperature from 140°C to 180°C change the major organic product?", "opts": ["Shifts product from Diethyl ether to Ethene", "Shifts product from Ethene to Ethane", "Shifts product from Ethanal to Ethanoic acid", "Shifts product from Diethyl ether to Ethanal"], "ans": "A", "exp": "140°C gives ether (intermolecular); 180°C gives alkene (intramolecular)."}, {"n": 11, "section": "CLASSIFICATION", "q": "An organic compound is classified as an alicyclic hydrocarbon. Which structural feature must it possess?", "opts": ["A non-planar aromatic ring containing alternating double bonds", "A non-aromatic carbon ring system behaving like an aliphatic hydrocarbon", "A cyclic structure incorporating at least one heteroatom like nitrogen or oxygen", "An open straight-chain structure containing triple bonds"], "ans": "B", "exp": "Alicyclic compounds are non-aromatic carbon ring systems."}, {"n": 12, "section": "ALKANES: SOURCES", "q": "A sample of gas is composed of 80% methane (CH<sub>4</sub>) by volume. Based on general organic sources, which resource does this gas represent?", "opts": ["Coal gas", "Natural gas", "Liquefied petroleum gas (LPG)", "Producer gas"], "ans": "B", "exp": "Natural gas predominantly consists of methane."}, {"n": 13, "section": "CLASSIFICATION", "q": "Which of the following compounds is classified as a homocyclic aromatic hydrocarbon?", "opts": ["Cyclohexane", "Pyridine", "Benzene", "Tetrahydrofuran"], "ans": "C", "exp": "Benzene is a classic homocyclic aromatic hydrocarbon."}, {"n": 14, "section": "ISOMERISM", "q": "What type of isomerism is displayed by But-2-ene due to restricted rotation around its carbon-carbon double bond?", "opts": ["Optical isomerism", "Chain isomerism", "Geometric (cis-trans) isomerism", "Functional group isomerism"], "ans": "C", "exp": "Double bond restricted rotation produces geometric (<i>cis-trans</i>) isomers."}, {"n": 15, "section": "ISOMERISM", "q": "In coordination chemistry, the compound [Pt(NH<sub>3</sub>)<sub>2</sub>Cl<sub>2</sub>] exhibits cis-trans isomerism. Which geometric arrangement describes the <i>trans</i> isomer?", "opts": ["Identical ligands placed adjacent to each other at 90° angles", "Identical ligands placed opposite each other at 180° angles", "Ligands rotating freely around a single covalent bond", "A chiral arrangement rotating plane-polarized light"], "ans": "B", "exp": "<i>Trans</i> position places identical ligands opposite (180°)."}, {"n": 16, "section": "CLASSIFICATION", "q": "A hydrocarbon molecule contains two π (pi) bonds and one σ (sigma) bond between two adjacent carbon atoms. To which homologous series does this linkage belong?", "opts": ["Alkanes", "Alkenes", "Alkynes", "Cycloalkanes"], "ans": "C", "exp": "Triple bonds contain 1σ and 2π bonds."}, {"n": 17, "section": "ALKANES: PHYSICAL PROPERTIES", "q": "Liquid alkanes (such as pentane) float on top of water when mixed. What two physical properties explain this behavior?", "opts": ["Low boiling point and high polar solvent solubility", "Density lower than 1.0 g/cm<sup>3</sup> and insolubility in polar solvents", "High vapor pressure and strong hydrogen bonding capability", "High density and reactivity with water molecules"], "ans": "B", "exp": "Density &lt;1.0 g/cm<sup>3</sup> and non-polar nature cause floating."}, {"n": 18, "section": "ALKANES: PHYSICAL PROPERTIES", "q": "Pentane (C<sub>5</sub>H<sub>12</sub>) has a boiling point of 36°C, whereas 2,2-dimethylpropane (C<sub>5</sub>H<sub>12</sub>) boils at 9.5°C. What accounts for this difference?", "opts": ["2,2-Dimethylpropane has stronger intermolecular hydrogen bonds", "Increased branching reduces surface area, weakening van der Waals forces", "Pentane has a cyclic structure that stabilizes its liquid state", "2,2-Dimethylpropane contains polar carbon-carbon double bonds"], "ans": "B", "exp": "Branching reduces contact surface area, weakening dispersion forces."}, {"n": 19, "section": "ALKYNES", "q": "When ethyne (HC≡CH) undergoes catalytic hydrogenation using a Pd/Pt catalyst, what is the step-wise sequence of organic products formed?", "opts": ["Ethane followed by Ethene", "Ethene followed by Ethane", "Ethanol followed by Ethanal", "Methanal followed by Methane"], "ans": "B", "exp": "Sequential addition converts acetylene to ethene, then ethane."}, {"n": 20, "section": "ALKYNES", "q": "What product is obtained when ethyne reacts with hydrogen chloride (HCl) in a 1:1 molar ratio?", "opts": ["1,1-Dichloroethane", "Chloroethene (Vinyl chloride)", "1,2-Dichloroethane", "Chloroethane"], "ans": "B", "exp": "1:1 addition across the triple bond forms vinyl chloride."}, {"n": 21, "section": "REACTION MECHANISMS", "q": "What primary organic product is formed when ethylmagnesium iodide (CH<sub>3</sub>CH<sub>2</sub>MgI) is hydrolyzed with water/acid (H^+)?", "opts": ["Methane", "Ethane", "Propane", "Ethanol"], "ans": "B", "exp": "Grignard hydrolysis yields alkane (CH<sub>3</sub>CH<sub>3</sub>)."}, {"n": 22, "section": "AMINES", "q": "Ammonia (NH<sub>3</sub>) reacts with bromomethane (CH<sub>3</sub>Br). What type of organic amine is formed first in this reaction?", "opts": ["Primary amine (Methylamine)", "Secondary amine (Dimethylamine)", "Tertiary amine (Trimethylamine)", "Quaternary ammonium salt"], "ans": "A", "exp": "Initial nucleophilic substitution forms methylamine."}, {"n": 23, "section": "AMINES", "q": "An organic compound has the structural formula (CH<sub>3</sub>)<sub>3</sub>N. How should this compound be classified?", "opts": ["Primary amine", "Secondary amine", "Tertiary amine", "Amide"], "ans": "C", "exp": "Three carbon attachments on nitrogen define a tertiary amine."}, {"n": 24, "section": "ALCOHOLS: OXIDATION", "q": "Secondary alcohols are oxidized using acidified potassium dichromate (K<sub>2</sub>Cr<sub>2</sub>O<sub>7</sub>). What is the resulting organic product?", "opts": ["Alkanal (Aldehyde)", "Alkanone (Ketone)", "Carboxylic acid", "Ether"], "ans": "B", "exp": "Secondary alcohols oxidize to ketones."}, {"n": 25, "section": "ALCOHOLS: OXIDATION", "q": "Why do tertiary alcohols resist oxidation under standard conditions with acidified KMnO<sub>4</sub> or K<sub>2</sub>Cr<sub>2</sub>O<sub>7</sub>?", "opts": ["They lack a hydrogen atom bonded to the carbon atom bearing the hydroxyl group (α-carbon)", "They possess high steric hindrance around the oxygen atom", "They readily form stable carbocations that prevent oxidation", "Their boiling points are too low for oxidation reactions"], "ans": "A", "exp": "Tertiary alcohols lack α-hydrogens required for oxidation."}, {"n": 26, "section": "REACTION MECHANISMS", "q": "Ethanol reacts with ethanoic acid in the presence of concentrated H<sub>2</sub>SO<sub>4</sub>. What is the IUPAC name of the organic ester formed?", "opts": ["Methyl ethanoate", "Ethyl ethanoate", "Methoxy methane", "Ethoxy ethane"], "ans": "B", "exp": "Esterification forms ethyl ethanoate."}, {"n": 27, "section": "ALKANES: PHYSICAL PROPERTIES", "q": "Under room conditions, what physical states are occupied by the first four straight-chain alkanes (C<sub>1</sub> to C<sub>4</sub>)?", "opts": ["Liquids", "Gases", "Waxy solids", "Volatile oils"], "ans": "B", "exp": "C<sub>1</sub>–C<sub>4</sub> alkanes are gaseous at room temperature."}, {"n": 28, "section": "ETHERS", "q": "According to IUPAC nomenclature rules, how is the compound CH<sub>3</sub>-O-CH<sub>3</sub> systematically named?", "opts": ["Dimethyl ether", "Methoxymethane", "Ethoxymethane", "Propanone"], "ans": "B", "exp": "IUPAC alkoxyalkane naming yields methoxymethane."}, {"n": 29, "section": "ALKANES: PHYSICAL PROPERTIES", "q": "Which alkane member represents the threshold where waxy solid physical states begin to appear at room temperature?", "opts": ["C<sub>5</sub>H<sub>12</sub>", "C<sub>10</sub>H<sub>22</sub>", "C<sub>18</sub>H<sub>38</sub>", "C<sub>25</sub>H<sub>52</sub>"], "ans": "C", "exp": "C<sub>18</sub> and higher alkanes are waxy solids."}, {"n": 30, "section": "ALKANES: HALOGENATION", "q": "In halogenation of alkanes, why does fluorine (F<sub>2</sub>) react explosively with methane while iodine (I<sub>2</sub>) fails to react under direct sunlight?", "opts": ["Fluorine has lower electronegativity than iodine", "Fluorine reactions are extremely exothermic, while iodine reactions are endothermic/unfavorable", "Iodine undergoes substitution while fluorine undergoes elimination", "Iodine forms stable carbocations with methane"], "ans": "B", "exp": "Fluorination is highly exothermic; iodination is endothermic."}, {"n": 31, "section": "ALKENES", "q": "An alkene with the general formula C<sub>n</sub>H<sub>2n</sub> contains 6 carbon atoms. If it is a straight-chain isomer with a double bond at carbon-1, what is its expected physical state at room temperature?", "opts": ["Gas", "Liquid", "Solid", "Plasma"], "ans": "B", "exp": "Hex-1-ene is a liquid at room temperature."}, {"n": 32, "section": "ALCOHOLS: PHYSICAL PROPERTIES", "q": "Why do lower alcohols (such as methanol and ethanol) show high solubility in water, whereas hexan-1-ol shows limited water solubility?", "opts": ["The non-polar hydrocarbon chain length increases, overcoming hydroxyl group hydrogen bonding", "Methanol forms ionic bonds in water while hexanol forms covalent bonds", "Hexanol contains double bonds that prevent hydration", "Methanol has a higher density than water"], "ans": "A", "exp": "Larger alkyl groups mask polar -OH hydrogen bonding."}, {"n": 33, "section": "ALCOHOLS & DEHYDRATION", "q": "When methanol (CH<sub>3</sub>OH) is treated with concentrated H<sub>2</sub>SO<sub>4</sub> at 180°C, what is the primary organic product?", "opts": ["Methene (CH<sub>2</sub>)", "Methanal (HCHO)", "Dimethyl ether (CH<sub>3</sub>OCH<sub>3</sub>)", "No elimination reaction occurs to form an alkene"], "ans": "D", "exp": "Methanol lacks the 2-carbon chain minimum required to form an alkene."}, {"n": 34, "section": "ALCOHOLS: PHYSICAL PROPERTIES", "q": "How does the boiling point of primary, secondary, and tertiary isomeric alcohols vary?", "opts": ["Primary > Secondary > Tertiary", "Tertiary > Secondary > Primary", "Secondary > Primary > Tertiary", "Primary = Secondary = Tertiary"], "ans": "A", "exp": "Primary alcohols have unhindered hydrogen bonding."}, {"n": 35, "section": "ALKENES", "q": "Which reagent reacts with ethene (CH<sub>2</sub>=CH<sub>2</sub>) via an addition reaction to form 1,2-dichloroethane?", "opts": ["HCl gas", "Cl<sub>2</sub> gas", "NaCl solution", "CCl<sub>4</sub> solvent"], "ans": "B", "exp": "Direct addition of halogen gas (Cl<sub>2</sub>) yields 1,2-dichloroethane."}, {"n": 36, "section": "CLASSIFICATION", "q": "An aliphatic hydrocarbon contains only single C-C and C-H σ (sigma) bonds in an open chain. What general formula corresponds to this class of compounds?", "opts": ["C<sub>n</sub>H<sub>2n</sub>", "C<sub>n</sub>H<sub>2n+2</sub>", "C<sub>n</sub>H<sub>2n-2</sub>", "C<sub>n</sub>H<sub>n</sub>"], "ans": "B", "exp": "General alkane formula is C<sub>n</sub>H<sub>2n+2</sub>."}, {"n": 37, "section": "CLASSIFICATION", "q": "Which of the following solvents is classified as a non-polar solvent?", "opts": ["Water (H<sub>2</sub>O)", "Ethanol (CH<sub>3</sub>CH<sub>2</sub>OH)", "Benzene (C<sub>6</sub>H<sub>6</sub>)", "Methanol (CH<sub>3</sub>OH)"], "ans": "C", "exp": "Benzene is a non-polar solvent."}, {"n": 38, "section": "ALKENES", "q": "The hydration of ethene (CH<sub>2</sub>=CH<sub>2</sub> + H<sub>2</sub>O) to produce ethanol requires which catalyst and operational conditions?", "opts": ["H<sub>3</sub>PO<sub>4</sub> catalyst on SiO<sub>2</sub> at 300°C", "Concentrated H<sub>2</sub>SO<sub>4</sub> at 140°C", "Acidified KMnO<sub>4</sub> at room temperature", "Pd/Pt catalyst at high pressure"], "ans": "A", "exp": "Industrial hydration uses H<sub>3</sub>PO<sub>4</sub> at 300°C."}, {"n": 39, "section": "ALKENES", "q": "What type of reaction occurs when propene converts to propane using H<sub>2</sub> and a Nickel (Ni) catalyst?", "opts": ["Substitution reaction", "Addition / Reduction reaction", "Elimination reaction", "Condensation reaction"], "ans": "B", "exp": "Catalytic hydrogenation is an addition/reduction reaction."}, {"n": 40, "section": "CLASSIFICATION", "q": "What is the functional group present in an alkanone (ketone)?", "opts": ["-OH (Hydroxyl group)", "-CHO (Alkanal group)", ">C=O (Carbonyl group attached to two alkyl carbon groups)", "-COOH (Carboxyl group)"], "ans": "C", "exp": "Carbonyl attached to two carbon substituents forms a ketone."}, {"n": 41, "section": "ETHERS", "q": "Why are ethers (R-O-R) much less soluble in water compared to their isomeric alcohols (R-OH)?", "opts": ["Ethers lack a hydrogen atom directly bonded to oxygen, limiting hydrogen bond donation to water", "Ethers are completely non-polar molecules", "Ethers react with water to form insoluble alkanes", "Ethers have higher molecular masses than their isomeric alcohols"], "ans": "A", "exp": "Ethers lack hydrogen bond donor sites (-OH)."}, {"n": 42, "section": "CLASSIFICATION", "q": "What functional group is represented by the notation -C≡N?", "opts": ["Amine", "Nitrile", "Alkyl halide", "Alkanal"], "ans": "B", "exp": "Nitrile group is represented as -C≡N."}, {"n": 43, "section": "ETHERS", "q": "Which of the following is a key physical property of low molecular weight ethers?", "opts": ["Unreactive solids with high melting points", "Highly volatile and flammable liquids that ignite easily", "Strongly basic liquids that dissolve ionic salts", "Highly dense liquids that sink below water"], "ans": "B", "exp": "Low molecular weight ethers are volatile and flammable."}, {"n": 44, "section": "ALKENES", "q": "Which statement correctly compares the melting points (M.P.) and boiling points (B.P.) of branched alkenes against their corresponding straight-chain isomers?", "opts": ["Branched isomers have higher B.P. and higher M.P.", "Branched isomers have lower B.P. and higher M.P. compared to straight-chain isomers", "Branched isomers have lower B.P. and lower M.P.", "Branching has no effect on physical properties"], "ans": "B", "exp": "Branching lowers boiling point but symmetrical packing can raise melting point."}, {"n": 45, "section": "ALKYNES", "q": "In the preparation of alkynes from calcium carbide (CaC<sub>2</sub>), what secondary inorganic product is formed alongside ethyne (C<sub>2</sub>H<sub>2</sub>)?", "opts": ["CaO", "Ca(OH)<sub>2</sub>", "CaCO<sub>3</sub>", "CaCl<sub>2</sub>"], "ans": "B", "exp": "Calcium carbide hydrolysis yields Ca(OH)<sub>2</sub>."}, {"n": 46, "section": "ALCOHOLS: OXIDATION", "q": "Oxidation of ethanol (CH<sub>3</sub>CH<sub>2</sub>OH) with acidified KMnO<sub>4</sub> under reflux yields which final product?", "opts": ["Ethanal (CH<sub>3</sub>CHO)", "Ethanoic acid (CH<sub>3</sub>COOH)", "Methanoic acid (HCOOH)", "Diethyl ether (CH<sub>3</sub>CH<sub>2</sub>OCH<sub>2</sub>CH<sub>3</sub>)"], "ans": "B", "exp": "Strong oxidation of primary alcohols produces ethanoic acid."}, {"n": 47, "section": "CLASSIFICATION", "q": "What type of structural classification applies to Cyclopropane?", "opts": ["Open-chain aliphatic alkane", "Alicyclic / Homocyclic saturated hydrocarbon", "Heterocyclic aromatic hydrocarbon", "Unsaturated alkyne derivative"], "ans": "B", "exp": "Cyclopropane is a saturated alicyclic hydrocarbon."}, {"n": 48, "section": "AMINES", "q": "What is the structural formula of primary amine methylamine?", "opts": ["CH<sub>3</sub>NH<sub>2</sub>", "(CH<sub>3</sub>)<sub>2</sub>NH", "(CH<sub>3</sub>)<sub>3</sub>N", "CH<sub>3</sub>CN"], "ans": "A", "exp": "Methylamine formula is CH<sub>3</sub>NH<sub>2</sub>."}, {"n": 49, "section": "ISOMERISM", "q": "Which of the following compounds displays optical isomerism?", "opts": ["Propane", "Lactic acid (containing a chiral carbon atom with 4 distinct substituents)", "Ethene", "But-2-ene"], "ans": "B", "exp": "Lactic acid has a chiral carbon attached to four distinct groups."}, {"n": 50, "section": "CLASSIFICATION", "q": "According to the IUPAC systemic guidelines, what steps must be prioritized when naming branched hydrocarbons containing functional groups?", "opts": ["Select the longest carbon chain containing the functional group, then number from the end giving the functional group/substituents the lowest locant", "Always list substituents in order of decreasing molecular weight", "Number the parent chain from left to right regardless of branching", "Ignore functional groups and select the longest continuous carbon chain anywhere in the molecule"], "ans": "A", "exp": "Longest chain with functional group determines numbering priority."}]},
 org100:{title:"Organic Chemistry Challenge",desc:"100 difficult questions across the whole organic chapter. Your toughest set.",color:"#B45309",icon:"&#128293;",data:[{"n": 1, "section": "CLASSIFICATION & NOMENCLATURE", "q": "The correct IUPAC name of the compound (CH<sub>3</sub>)<sub>2</sub>C(CH<sub>2</sub>CH<sub>3</sub>)<sub>2</sub> is:", "opts": ["2,2-dimethylbutane", "3-ethylpentane", "3,3-dimethylpentane", "2,2-diethylpropane"], "ans": "C", "exp": "The longest continuous chain passes through the two ethyl groups: CH<sub>3</sub>CH<sub>2</sub>-C-CH<sub>2</sub>CH<sub>3</sub>, a pentane with the central carbon as C-3. The two methyl groups therefore carry locant 3, giving 3,3-dimethylpentane."}, {"n": 2, "section": "CLASSIFICATION & NOMENCLATURE", "q": "How many structural (chain) isomers does an open-chain alkane with molecular formula C<sub>5</sub>H<sub>12</sub> possess?", "opts": ["2", "3", "4", "5"], "ans": "B", "exp": "C<sub>5</sub>H<sub>12</sub> has three chain isomers: pentane, 2-methylbutane and 2,2-dimethylpropane."}, {"n": 3, "section": "CLASSIFICATION & NOMENCLATURE", "q": "How many alcohols (structural isomers) have the molecular formula C<sub>4</sub>H<sub>10</sub>O?", "opts": ["2", "3", "5", "4"], "ans": "D", "exp": "Four: butan-1-ol, butan-2-ol, 2-methylpropan-1-ol and 2-methylpropan-2-ol."}, {"n": 4, "section": "CLASSIFICATION & NOMENCLATURE", "q": "Which two classes of organic compounds share the same general formula C<sub>n</sub>H<sub>2n</sub>?", "opts": ["Alkanes and cycloalkanes", "Alkenes and cycloalkanes", "Alkynes and dienes", "Alkanes and alkenes"], "ans": "B", "exp": "Open-chain alkenes and cycloalkanes are both C<sub>n</sub>H<sub>2n</sub>, which is why e.g. propene and cyclopropane (both C<sub>3</sub>H<sub>6</sub>) are ring-chain isomers."}, {"n": 5, "section": "CLASSIFICATION & NOMENCLATURE", "q": "The molecular formula C<sub>3</sub>H<sub>6</sub> could represent an alkene and:", "opts": ["an alcohol", "a cycloalkane", "an alkyne", "an ether"], "ans": "B", "exp": "C<sub>3</sub>H<sub>6</sub> fits propene (C<sub>n</sub>H<sub>2n</sub>) and also cyclopropane, the smallest alicyclic ring."}, {"n": 6, "section": "CLASSIFICATION & NOMENCLATURE", "q": "Which of the following is a heterocyclic compound?", "opts": ["Benzene", "Cyclohexane", "Pyridine", "Methylbenzene"], "ans": "C", "exp": "Pyridine has a six-membered ring in which one carbon is replaced by a nitrogen atom, making the ring heterocyclic. Benzene, cyclohexane and methylbenzene contain carbon atoms only."}, {"n": 7, "section": "CLASSIFICATION & NOMENCLATURE", "q": "In IUPAC nomenclature, the suffix '-one' indicates the presence of:", "opts": ["an aldehyde group", "a ketone group", "an alcohol group", "a carboxyl group"], "ans": "B", "exp": "'-al' marks aldehydes, '-ol' alcohols, '-oic acid' carboxylic acids, and '-one' marks ketones (propanone, butan-2-one)."}, {"n": 8, "section": "CLASSIFICATION & NOMENCLATURE", "q": "A functional group is best defined as:", "opts": ["any atom other than carbon or hydrogen in a molecule", "the longest carbon chain in a molecule", "an atom or group of atoms that determines the characteristic chemical properties of a compound", "a group that only affects physical properties"], "ans": "C", "exp": "Functional groups like -OH, -COOH, C=C and -NH<sub>2</sub> govern how a compound reacts, regardless of chain length; members of different homologous series share one."}, {"n": 9, "section": "CLASSIFICATION & NOMENCLATURE", "q": "The compound CH<sub>3</sub>CH<sub>2</sub>COOCH<sub>3</sub> belongs to which homologous series?", "opts": ["Acids", "Ethers", "Ketones", "Esters"], "ans": "D", "exp": "The -COO- linkage between the carbonyl carbon and an oxygen shows it is the ester methyl propanoate (an acid would be -COOH)."}, {"n": 10, "section": "CLASSIFICATION & NOMENCLATURE", "q": "Which of the following is a saturated hydrocarbon?", "opts": ["C<sub>2</sub>H<sub>4</sub>", "C<sub>6</sub>H<sub>6</sub>", "C<sub>4</sub>H<sub>10</sub>", "C<sub>3</sub>H<sub>6</sub>"], "ans": "C", "exp": "Only C<sub>4</sub>H<sub>10</sub> (C<sub>n</sub>H<sub>2n+2</sub>) contains single bonds exclusively. C<sub>2</sub>H<sub>4</sub> and C<sub>3</sub>H<sub>6</sub> are unsaturated, and benzene is aromatic."}, {"n": 11, "section": "CLASSIFICATION & NOMENCLATURE", "q": "The general formula C<sub>n</sub>H<sub>2n+2</sub> applies to:", "opts": ["alkanes and cycloalkanes", "alkanes only", "alkenes only", "alkynes and alkenes"], "ans": "B", "exp": "Each ring closure or double bond removes two hydrogens, so only open-chain saturated alkanes obey C<sub>n</sub>H<sub>2n+2</sub>; cycloalkanes are C<sub>n</sub>H<sub>2n</sub>."}, {"n": 12, "section": "CLASSIFICATION & NOMENCLATURE", "q": "The key structural feature that distinguishes aromatic from alicyclic compounds is:", "opts": ["the presence of a carbon ring", "the presence of side chains", "a delocalized π-electron system giving extra stability", "the presence of at least one double bond"], "ans": "C", "exp": "Alicyclic compounds may contain a ring and even double bonds, but aromatics like benzene have a fully delocalized π system (resonance) that makes them unusually stable."}, {"n": 13, "section": "ISOMERISM", "q": "The total number of structural isomers of C<sub>4</sub>H<sub>9</sub>Cl is:", "opts": ["2", "3", "5", "4"], "ans": "D", "exp": "Four: 1-chlorobutane, 2-chlorobutane, 1-chloro-2-methylpropane and 2-chloro-2-methylpropane."}, {"n": 14, "section": "ISOMERISM", "q": "Which of the following alcohols is optically active?", "opts": ["Butan-2-ol", "Butan-1-ol", "Propan-2-ol", "2-methylpropan-2-ol"], "ans": "A", "exp": "In butan-2-ol, C-2 carries four different groups (H, OH, CH<sub>3</sub>, C<sub>2</sub>H<sub>5</sub>), so it is chiral. In the others, no carbon carries four different substituents."}, {"n": 15, "section": "ISOMERISM", "q": "But-1-ene and 2-methylpropene are examples of:", "opts": ["chain (skeletal) isomerism", "position isomerism", "geometric isomerism", "functional group isomerism"], "ans": "A", "exp": "Both are C<sub>4</sub>H<sub>8</sub> with the same functional group, but one has a straight chain and the other a branched skeleton."}, {"n": 16, "section": "ISOMERISM", "q": "Which pair are functional group isomers?", "opts": ["But-1-ene and but-2-ene", "Propanal and propanone", "Pentane and 2-methylbutane", "Butan-1-ol and butan-2-ol"], "ans": "B", "exp": "Propanal (an aldehyde) and propanone (a ketone) share the formula C<sub>3</sub>H<sub>6</sub>O but belong to different homologous series."}, {"n": 17, "section": "ISOMERISM", "q": "Which compound CANNOT exhibit cis-trans (geometric) isomerism?", "opts": ["But-1-ene", "But-2-ene", "Pent-2-ene", "Hex-3-ene"], "ans": "A", "exp": "For cis-trans isomerism each doubly-bonded carbon must carry two different groups. In but-1-ene the terminal carbon of the double bond carries two identical hydrogen atoms."}, {"n": 18, "section": "ISOMERISM", "q": "Between the cis and trans isomers of but-2-ene, which has the higher boiling point and why?", "opts": ["cis, because it has a net dipole moment making the molecule polar", "trans, because it is more symmetrical", "trans, because it packs better in the crystal", "they have identical boiling points"], "ans": "A", "exp": "In the cis isomer the two polar C-H dipoles do not cancel, giving a net molecular dipole, so cis-but-2-ene is slightly polar and has the higher boiling point. The trans isomer's better packing gives it the higher melting point instead."}, {"n": 19, "section": "ISOMERISM", "q": "CH<sub>3</sub>-O-C<sub>3</sub>H<sub>7</sub> and C<sub>2</sub>H<sub>5</sub>-O-C<sub>2</sub>H<sub>5</sub> (both C<sub>4</sub>H<sub>10</sub>O) are:", "opts": ["metamers", "chain isomers", "position isomers", "functional group isomers"], "ans": "A", "exp": "Metamerism arises when the same functional group (here the ether oxygen) divides the carbon skeleton unequally: methoxypropane versus ethoxyethane differ in the sizes of the groups on either side of the oxygen."}, {"n": 20, "section": "ISOMERISM", "q": "How many sigma (σ) and pi (π) bonds respectively are present in one molecule of propyne, CH<sub>3</sub>-C≡CH?", "opts": ["5 σ, 2 π", "6 σ, 2 π", "6 σ, 3 π", "7 σ, 2 π"], "ans": "B", "exp": "Count σ bonds: three C-H in CH<sub>3</sub>, one C-C single bond, one σ within the C≡C triple bond, one C-H on the end carbon = 6 σ. The triple bond contributes 2 π bonds."}, {"n": 21, "section": "ISOMERISM", "q": "Which pair illustrates position isomerism?", "opts": ["Propanal and propanone", "Ethanol and methoxymethane", "But-1-ene and but-2-ene", "Pentane and 2-methylbutane"], "ans": "C", "exp": "The double bond occupies different positions (C-1 versus C-2) on the same carbon skeleton."}, {"n": 22, "section": "ISOMERISM", "q": "2-chlorobutane exhibits optical isomerism because:", "opts": ["it contains a chlorine atom", "carbon-2 is bonded to four different groups", "it contains an asymmetric mass distribution", "its molecules are non-polar"], "ans": "B", "exp": "C-2 carries H, Cl, CH<sub>3</sub> and C<sub>2</sub>H<sub>5</sub>, making it a chiral (asymmetric) carbon, so the two mirror-image forms rotate plane-polarized light in opposite directions."}, {"n": 23, "section": "ALKANES", "q": "In the free-radical chlorination of methane under UV light, the initiation step is:", "opts": ["homolytic fission of the Cl-Cl bond into two chlorine radicals", "heterolytic fission of the Cl-Cl bond", "attack of a Cl<sup>+</sup> ion on methane", "combination of two methyl radicals"], "ans": "A", "exp": "UV light supplies the energy to split Cl<sub>2</sub> homolytically into two Cl• radicals, each keeping one electron of the shared pair."}, {"n": 24, "section": "ALKANES", "q": "In the propagation step of methane chlorination, the methyl radical reacts with chlorine to give:", "opts": ["CH<sub>3</sub>Cl + Cl•", "CH<sub>3</sub>Cl + HCl", "CH<sub>2</sub>Cl<sub>2</sub> + H•", "CH<sub>4</sub> + Cl<sub>2</sub>"], "ans": "A", "exp": "CH<sub>3</sub>• + Cl<sub>2</sub> → CH<sub>3</sub>Cl + Cl• regenerates the chlorine radical, so one photon can convert many molecules (a chain reaction)."}, {"n": 25, "section": "ALKANES", "q": "When propane is chlorinated with one mole of Cl<sub>2</sub> (UV light), the major product is:", "opts": ["2-chloropropane", "1-chloropropane", "equal amounts of both", "1,2-dichloropropane"], "ans": "A", "exp": "Abstraction of a secondary hydrogen gives the more stable secondary radical, so 2-chloropropane predominates over 1-chloropropane."}, {"n": 26, "section": "ALKANES", "q": "The reference hydrocarbon assigned an octane number of 100 is:", "opts": ["n-heptane", "2,2,4-trimethylpentane (iso-octane)", "n-octane", "methane"], "ans": "B", "exp": "Iso-octane burns with the smoothest combustion and defines the 100 point of the octane scale; n-heptane, which knocks badly, is 0."}, {"n": 27, "section": "ALKANES", "q": "Fuels rich in which hydrocarbons reduce knocking in petrol engines most effectively?", "opts": ["straight-chain alkanes", "cycloalkanes with large rings", "n-heptane", "branched-chain alkanes"], "ans": "D", "exp": "Branched alkanes burn more smoothly, which is why catalytic reforming and isomerization convert straight chains into branched isomers to raise the octane rating."}, {"n": 28, "section": "ALKANES", "q": "Cracking in petroleum refining is best described as:", "opts": ["oxidation of heavy oils with air", "separation of crude oil into fractions by boiling point", "thermal decomposition of large hydrocarbon molecules into smaller alkanes and alkenes", "removal of sulphur from petrol"], "ans": "C", "exp": "Large molecules are broken (often over a catalyst, with heat) into smaller, more useful alkanes and alkenes, e.g. C<sub>10</sub>H<sub>22</sub> → C<sub>8</sub>H<sub>18</sub> + C<sub>2</sub>H<sub>4</sub>. Separation by boiling point is fractional distillation, not cracking."}, {"n": 29, "section": "ALKANES", "q": "A Wurtz reaction is carried out using a 1:1 mixture of CH<sub>3</sub>I and C<sub>2</sub>H<sub>5</sub>I with excess sodium in dry ether. The organic products are:", "opts": ["ethane only", "butane only", "propane only", "ethane, propane and butane"], "ans": "D", "exp": "Each radical can couple with its own kind (ethane from 2 CH<sub>3</sub>•, butane from 2 C<sub>2</sub>H<sub>5</sub>•) and cross-coupling gives propane, so three alkanes form."}, {"n": 30, "section": "ALKANES", "q": "In Kolbe's electrolysis of a concentrated aqueous solution of sodium ethanoate, the product liberated at the anode is:", "opts": ["methane", "ethane", "ethene", "hydrogen"], "ans": "B", "exp": "2 CH<sub>3</sub>COO<sup>-</sup> - 2e<sup>-</sup> → C<sub>2</sub>H<sub>6</sub> + 2CO<sub>2</sub>. The ethanoate radicals dimerize at the anode to ethane; hydrogen forms at the cathode."}, {"n": 31, "section": "ALKANES", "q": "Alkanes are chemically unreactive (paraffins) mainly because:", "opts": ["their C-C and C-H bonds are strong and non-polar, offering no reactive site", "they are non-existent in ionic form", "they are insoluble in water", "they have low boiling points"], "ans": "A", "exp": "With only strong, essentially non-polar σ bonds and no functional group, alkanes undergo no attack by common acids, bases or oxidizing agents, reacting mainly by radical substitution under harsh conditions."}, {"n": 32, "section": "ALKENES", "q": "The major product when propene reacts with HBr in the ABSENCE of peroxides is:", "opts": ["1-bromopropane", "1,2-dibromopropane", "2-bromopropan-2-ol", "2-bromopropane"], "ans": "D", "exp": "Markovnikov addition: H adds to the CH<sub>2</sub> end (which has more hydrogens), forming the more stable secondary carbocation, which Br<sup>-</sup> then attacks at C-2."}, {"n": 33, "section": "ALKENES", "q": "When propene reacts with HBr IN THE PRESENCE of peroxides, the main product is:", "opts": ["2-bromopropane", "1,2-dibromopropane", "propane", "1-bromopropane"], "ans": "D", "exp": "The peroxide (Kharasch) effect reverses the orientation: a Br• radical adds first to the terminal carbon, generating the more stable secondary carbon radical, so bromine ends up on the end carbon of 1-bromopropane."}, {"n": 34, "section": "ALKENES", "q": "The peroxide effect is observed with HBr but NOT with HCl or HI. Why?", "opts": ["Cl<sub>2</sub> and I<sub>2</sub> are too unreactive", "peroxides react with HCl and HI and destroy them", "alkenes cannot add HCl or HI at all", "only with HBr are both chain-propagation steps exothermic; the key step is endothermic for HCl and for HI"], "ans": "D", "exp": "A radical chain propagates only when every step is exothermic. For HCl, abstraction of H by the alkyl radical is too endothermic; for HI, addition of the I• radical to the alkene is unfavourable. HBr alone satisfies both steps, so it alone shows the anti-Markovnikov peroxide effect."}, {"n": 35, "section": "ALKENES", "q": "Baeyer's reagent used to test for unsaturation is:", "opts": ["acidified potassium dichromate", "bromine in tetrachloromethane", "dilute alkaline potassium permanganate", "ammoniacal silver nitrate"], "ans": "C", "exp": "Dilute, cold KMnO<sub>4</sub> (alkaline) decolourizes from purple to brown MnO<sub>2</sub> when it adds across a double bond, forming a vicinal diol; ethene gives ethane-1,2-diol."}, {"n": 36, "section": "ALKENES", "q": "Ozonolysis of propene (CH<sub>3</sub>CH=CH<sub>2</sub>) produces:", "opts": ["ethanal and methanal", "ethanoic acid and methanoic acid", "propanal only", "ethanol and methanol"], "ans": "A", "exp": "The double bond is cleaved; each doubly-bonded carbon becomes a carbonyl: the CH<sub>3</sub>CH= end gives ethanal and the =CH<sub>2</sub> end gives methanal."}, {"n": 37, "section": "ALKENES", "q": "The rapid decolourization of bromine water by a hydrocarbon involves:", "opts": ["free-radical substitution in the dark", "oxidation of an alkane", "electrophilic addition across the C=C bond of an alkene", "dissolution with no reaction"], "ans": "C", "exp": "The electron-rich π bond polarizes Br<sub>2</sub> and accepts Br<sup>+</sup>, then Br<sup>-</sup> completes the addition. Alkanes do not decolourize bromine water in the dark, making this the classic unsaturation test."}, {"n": 38, "section": "ALKENES", "q": "Dehydration of butan-2-ol with concentrated H<sub>2</sub>SO<sub>4</sub> at 180°C gives mainly:", "opts": ["but-2-ene", "but-1-ene", "an equal mixture of both", "2-methylpropene"], "ans": "A", "exp": "Saytzeff's rule: elimination favors the more substituted (more stable) alkene, so the internal double bond of but-2-ene predominates."}, {"n": 39, "section": "ALKENES", "q": "Ethene for industry is obtained principally by:", "opts": ["fermentation of glucose", "cracking (and catalytic dehydrogenation) of petroleum fractions", "esterification", "the Wurtz reaction"], "ans": "B", "exp": "Thermal/catalytic cracking of naphtha or dehydrogenation of ethane supplies industrial ethene, the feedstock for polyethene and ethanol manufacture."}, {"n": 40, "section": "ALKENES", "q": "In the older industrial route, ethene is absorbed in cold concentrated H<sub>2</sub>SO<sub>4</sub> before hydrolysis to ethanol. The intermediate formed is:", "opts": ["ethyl hydrogen sulfate (C<sub>2</sub>H<sub>5</sub>OSO<sub>3</sub>H)", "ethyl ethanoate", "diethyl ether", "ethanal"], "ans": "A", "exp": "Electrophilic addition of H<sub>2</sub>SO<sub>4</sub> across the double bond gives ethyl hydrogen sulfate, which on warming with water hydrolyses to ethanol and regenerates the acid."}, {"n": 41, "section": "ALKENES", "q": "The formation of poly(ethene) from ethene is best described as:", "opts": ["addition polymerization with no by-product", "condensation polymerization with loss of water", "free-radical substitution", "esterification"], "ans": "A", "exp": "Thousands of ethene molecules add across their double bonds; every atom of the monomer is retained in the polymer, so no small molecule is eliminated."}, {"n": 42, "section": "ALKENES", "q": "Which reagent distinguishes ethyne from ethene?", "opts": ["Bromine water", "Dilute KMnO<sub>4</sub>", "Concentrated H<sub>2</sub>SO<sub>4</sub>", "Ammoniacal silver nitrate"], "ans": "D", "exp": "Ethyne's acidic terminal hydrogen forms a white precipitate of silver acetylide with ammoniacal AgNO<sub>3</sub>, while ethene gives no reaction. Bromine water and KMnO<sub>4</sub> are decolourized by both."}, {"n": 43, "section": "ALKENES", "q": "The direct catalytic hydration of ethene (H<sub>3</sub>PO<sub>4</sub> on SiO<sub>2</sub>, 300°C, high pressure) yields:", "opts": ["ethanal", "ethanoic acid", "diethyl ether", "ethanol"], "ans": "D", "exp": "Water adds across the double bond under the phosphoric(V) acid catalyst to give ethanol, the modern industrial alternative to fermentation."}, {"n": 44, "section": "ALKYNES", "q": "Ethyne reacts with hot water in the presence of HgSO<sub>4</sub>/H<sub>2</sub>SO<sub>4</sub> catalyst (Kucherov reaction). The product is:", "opts": ["ethanal", "ethanol", "ethanoic acid", "propanone"], "ans": "A", "exp": "Markovnikov hydration first gives the unstable vinyl alcohol (ethenol), which immediately tautomerizes to ethanal, CH<sub>3</sub>CHO."}, {"n": 45, "section": "ALKYNES", "q": "When ethyne reacts with EXCESS hydrogen chloride, the final product is:", "opts": ["1,2-dichloroethane", "chloroethene only", "1,1-dichloroethane", "2,2-dichloroethane"], "ans": "C", "exp": "The first HCl gives vinyl chloride (chloroethene). The second HCl adds Markovnikov to the remaining double bond, placing both chlorines on the same carbon: 1,1-dichloroethane (a gem-dichloride)."}, {"n": 46, "section": "ALKYNES", "q": "One mole of ethyne reacts with one mole of bromine. The organic product is:", "opts": ["1,2-dibromoethane", "1,1-dibromoethane", "1,2-dibromoethene", "tetrabromoethane"], "ans": "C", "exp": "One equivalent of Br<sub>2</sub> adds across the triple bond to give the dihaloalkene 1,2-dibromoethene; a second equivalent would give 1,1,2,2-tetrabromoethane."}, {"n": 47, "section": "ALKYNES", "q": "Passing ethyne through a red-hot iron tube (Berthelot reaction) produces:", "opts": ["polyethene", "benzene", "ethene", "cyclohexane"], "ans": "B", "exp": "Three ethyne molecules cyclize and rearrange on the hot metal surface to benzene, C<sub>6</sub>H<sub>6</sub> — the classic synthesis joining the aliphatic and aromatic worlds."}, {"n": 48, "section": "ALKYNES", "q": "Ethyne gives a white precipitate with ammoniacal silver nitrate. This is because:", "opts": ["the terminal hydrogen of ethyne is acidic enough to be replaced by the silver ion", "ethyne is strongly basic", "silver catalyzes its polymerization", "ethyne is oxidized to ethanal"], "ans": "A", "exp": "The sp-hybridized carbon holds the electron density tightly, so ≡C-H has acidic character. Ag<sup>+</sup> displaces the H<sup>+</sup> to form silver acetylide, AgC≡CAg, a white solid; ethene shows no such reaction."}, {"n": 49, "section": "ALKYNES", "q": "The oxy-acetylene flame is valued in metal welding because:", "opts": ["it is smokeless", "acetylene is cheap", "it produces a reducing atmosphere only", "it reaches about 3000°C, high enough to melt steel"], "ans": "D", "exp": "The combustion of ethyne is highly exothermic (its two π bonds store energy), and the flame temperature of roughly 3000°C can cut and weld high-melting metals."}, {"n": 50, "section": "ALKYNES", "q": "Ethyne reacts with sodium metal in liquid ammonia, liberating a gas. The organic product is:", "opts": ["ethane", "sodium ethoxide", "sodium acetylide", "ethenyl sodium"], "ans": "C", "exp": "The acidic terminal hydrogen is displaced: HC≡CH + Na → HC≡CNa + ½H<sub>2</sub>. The gas evolved is hydrogen and the salt is monosodium acetylide."}, {"n": 51, "section": "ALKYNES", "q": "What mass of ethyne can be prepared from 64 g of calcium carbide (M = 64), assuming complete hydrolysis?", "opts": ["13 g", "32 g", "52 g", "26 g"], "ans": "D", "exp": "CaC<sub>2</sub> + 2H<sub>2</sub>O → C<sub>2</sub>H<sub>2</sub> + Ca(OH)<sub>2</sub> is a 1:1 mole reaction. 64 g = 1 mol of CaC<sub>2</sub> gives 1 mol of ethyne, whose molar mass is 26 g."}, {"n": 52, "section": "ALCOHOLS & PHENOLS-TYPE REACTIONS", "q": "Lucas reagent, used to classify alcohols, consists of:", "opts": ["iodine in NaOH solution", "dilute KMnO<sub>4</sub>", "concentrated HCl with anhydrous ZnCl<sub>2</sub>", "bromine in CCl<sub>4</sub>"], "ans": "C", "exp": "The Lewis acid ZnCl<sub>2</sub> helps convert the -OH into a good leaving group; the rate of turbidity (alkyl chloride formation) reveals the alcohol class."}, {"n": 53, "section": "ALCOHOLS", "q": "Which alcohol gives immediate turbidity with Lucas reagent at room temperature?", "opts": ["Butan-1-ol", "Butan-2-ol", "2-methylpropan-2-ol", "propan-1-ol"], "ans": "C", "exp": "Tertiary alcohols form the stable tertiary carbocation fastest, so the chloride separates at once; secondary alcohols take minutes and primary ones only react on heating."}, {"n": 54, "section": "ALCOHOLS", "q": "Which of the following gives a yellow precipitate with iodine and aqueous NaOH?", "opts": ["Propan-1-ol", "Methanol", "2-methylpropan-2-ol", "Propan-2-ol"], "ans": "D", "exp": "The iodoform test needs a CH<sub>3</sub>CH(OH)- group (or CH<sub>3</sub>CO-). Only propan-2-ol among these fits, giving yellow CHI<sub>3</sub>. Ethanol is the only primary alcohol that also passes."}, {"n": 55, "section": "ALCOHOLS", "q": "When ethanol reacts with sodium metal, the gas evolved is:", "opts": ["hydrogen", "oxygen", "carbon dioxide", "ethene"], "ans": "A", "exp": "2C<sub>2</sub>H<sub>5</sub>OH + 2Na → 2C<sub>2</sub>H<sub>5</sub>ONa + H<sub>2</sub>. The acidic O-H hydrogen is displaced; the product, sodium ethoxide, is a strong base."}, {"n": 56, "section": "ALCOHOLS", "q": "Propan-1-ol is oxidized with acidified K<sub>2</sub>Cr<sub>2</sub>O<sub>7</sub> and the volatile product is DISTILLED OFF as it forms. The main product is:", "opts": ["propanone", "propanoic acid", "propanal", "propene"], "ans": "C", "exp": "Distilling as it forms removes the aldehyde before further oxidation: propan-1-ol → propanal. Under reflux (no distillation) the product continues to propanoic acid."}, {"n": 57, "section": "ALCOHOLS", "q": "Which alcohol is NOT oxidized by acidified KMnO<sub>4</sub> under normal laboratory conditions?", "opts": ["Propan-1-ol", "Butan-2-ol", "2-methylpropan-2-ol", "propan-2-ol"], "ans": "C", "exp": "Oxidation requires at least one hydrogen on the carbon bearing the OH group. The tertiary alcohol 2-methylpropan-2-ol has three alkyl groups and no α-hydrogen on that carbon, so no mild oxidant can attack it."}, {"n": 58, "section": "ALCOHOLS", "q": "The fermentation of glucose by yeast (zymase) produces:", "opts": ["ethanol and carbon dioxide", "ethanol and oxygen", "ethanal and hydrogen", "ethanoic acid only"], "ans": "A", "exp": "C<sub>6</sub>H<sub>12</sub>O<sub>6</sub> → 2C<sub>2</sub>H<sub>5</sub>OH + 2CO<sub>2</sub>. The process stops naturally near 15% ethanol when the yeast is inhibited."}, {"n": 59, "section": "ALCOHOLS", "q": "Why does ethanol boil at 78°C while its isomer methoxymethane boils at -24°C?", "opts": ["ethanol has a larger molar mass", "ethanol is ionic", "ethanol molecules hydrogen-bond strongly with each other; ethers cannot donate hydrogen bonds", "methoxymethane is aromatic"], "ans": "C", "exp": "Ethanol's O-H lets each molecule donate and accept hydrogen bonds, needing far more energy to vaporize. The ether has no O-H and only weak dipole-dipole attraction."}, {"n": 60, "section": "ALCOHOLS", "q": "Ethane-1,2-diol (ethylene glycol) is widely used as:", "opts": ["a fertiliser", "a food preservative", "an antifreeze in car radiators", "a fuel for engines"], "ans": "C", "exp": "Its high boiling point, miscibility with water and ability to lower water's freezing point make it the standard radiator antifreeze and coolant."}, {"n": 61, "section": "ALCOHOLS", "q": "Absolute alcohol is ethanol that is:", "op
