<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maths CBT — Verified Past Questions</title>
<style>
:root{--c:#0D9488;--bad:#b91c1c;--bg:#f4f5f7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:#222}
header{background:linear-gradient(135deg,#0D9488,#0F766E);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.2)}
header h1{margin:0;font-size:1.15rem}header p{margin:2px 0 0;font-size:.75rem;opacity:.85}
#bar{display:none;justify-content:space-between;align-items:center;gap:8px}
#prog{flex:1;height:6px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
#progf{height:100%;background:#fbbf24;width:0%;transition:.3s}
#score{font-size:.8rem;font-weight:600;white-space:nowrap}
main{max-width:640px;margin:0 auto;padding:16px}
.hubcard{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,.08);border-top:4px solid var(--c)}
.hubcard h2{margin:0 0 6px;font-size:1.05rem}
.hubcard p{margin:0 0 10px;font-size:.85rem;color:#555}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font-size:.7rem;background:#eef2f7;border-radius:20px;padding:4px 10px;color:#444}
.chip.gold{background:#fdf3d7;color:#8a6d1a}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--c);color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
.btn:active{transform:scale(.99)}
.q{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.08);display:none}
.q.on{display:block}
.qtext{font-size:1.02rem;font-weight:600;line-height:1.45;margin:0 0 14px}
.tag{display:inline-block;font-size:.68rem;background:#e8f5f3;color:#0F766E;border-radius:6px;padding:2px 8px;margin-bottom:10px;font-weight:600}
.opt{display:block;width:100%;text-align:left;background:#f8fafc;border:2px solid #e2e8f0;border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:.95rem;cursor:pointer;line-height:1.4}
.opt:disabled{cursor:default}
.opt.good{background:#e7f8f1;border-color:#16a34a;font-weight:600}
.opt.badpick{background:#fdeaea;border-color:var(--bad)}
.expl{display:none;background:#fffbea;border-left:4px solid #f59e0b;border-radius:0 10px 10px 0;padding:12px 14px;font-size:.88rem;line-height:1.55;margin:4px 0 14px}
.verdict{font-weight:700;margin-bottom:6px}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.btn.ghost{background:#eef2f7;color:#333}
.final{text-align:center}
.final .big{font-size:2.6rem;font-weight:800;color:var(--c);margin:8px 0}
.note{font-size:.75rem;color:#666;margin-top:6px}
footer{max-width:640px;margin:0 auto;padding:0 16px 30px;font-size:.72rem;color:#888;text-align:center}
</style></head><body>
<header><div id="bar"><button class="btn ghost" style="flex:0 0 auto;width:auto;padding:8px 14px" onclick="toHub()">◂</button><div id="prog"><div id="progf"></div></div><span id="score"></span></div>
<h1 id="htitle">Maths CBT · Verified Past Questions</h1><p id="hsub">Tap your answer — instant marking with full working</p></header>
<main>
<div id="hub"></div>
<div id="qview" class="q"></div>
<div id="endv" class="q final"></div>
</main>
<footer>MTH past questions · answers verified by computation · built for Samuel · works offline</footer>
<script>
var Q=[{"sec": 0, "q": "1. What is the total area between y = cos x and the x-axis, from x = 1 to x = 3?", "o": ["A. 1.017", "B. 0.158", "C. 0.859", "D. 0.841"], "c": 0, "e": "cos x crosses the axis at x = π/2 ≈ 1.571, inside [1, 3]. Total area = ∫|cos x|dx = ∫₁^π/² cos x dx + ∫_π/²³ (−cos x)dx = (1 − sin 1) + (1 − sin 3) = 2 − 0.8415 − 0.1411 = 1.0174."}, {"sec": 0, "q": "2. Which of the following is NOT correct?", "o": ["A. ∫<sub>a<\/sub><sup>b<\/sup> [f(x)+g(x)]dx = ∫<sub>a<\/sub><sup>b<\/sup> f(x)dx + ∫<sub>a<\/sub><sup>b<\/sup> g(x)dx", "B. ∫<sub>a<\/sub><sup>b<\/sup> f(x)dx = ∫<sub>b<\/sub><sup>a<\/sup> f(x)dx", "C. ∫<sub>a<\/sub><sup>b<\/sup> f(x)dx = −∫<sub>b<\/sub><sup>a<\/sup> f(x)dx", "D. ∫<sub>a<\/sub><sup>a<\/sup> f(x)dx = 0"], "c": 1, "e": "Reversing the limits must bring a minus sign: ∫ₐᵇ f dx = −∫ᵇₐ f dx. Option B states the equality WITHOUT the minus sign, so B is the false statement. A (sum rule), C (correct reversal) and D (zero over an empty interval) are all true."}, {"sec": 0, "q": "3. Evaluate ∫<sub>0<\/sub><sup>π/2<\/sup> cos⁴x dx.", "o": ["A. 3π/8", "B. π/8", "C. 3π/16", "D. π/16"], "c": 2, "e": "Use the reduction formula ∫₀^{π/2} cosⁿx dx = ((n−1)/n)·((n−3)/(n−2))·…·(π/2) for even n. For n = 4: (3/4)(1/2)(π/2) = 3π/16. (Or expand cos⁴x = (3 + 4cos2x + cos4x)/8 and integrate.)"}, {"sec": 0, "q": "4. Evaluate ∫<sub>0<\/sub><sup>π/2<\/sup> √(1 + sin 2x) dx.", "o": ["A. 1/2", "B. 2", "C. π/2", "D. 1"], "c": 1, "e": "1 + sin 2x = sin²x + 2 sin x cos x + cos²x = (sin x + cos x)². On [0, π/2], sin x + cos x ≥ 0, so the root is just sin x + cos x. Integral = [−cos x + sin x]₀^{π/2} = (0+1) − (−1+0) = 2."}, {"sec": 0, "q": "5. Evaluate ∫<sub>0<\/sub><sup>π/2<\/sup> (tan x + cot x)<sup>−2<\/sup> dx.", "o": ["A. π/16", "B. π/8", "C. 3π/32", "D. π/32"], "c": 0, "e": "tan x + cot x = (sin²x + cos²x)/(sin x cos x) = 1/(sin x cos x). So (tan+cot)⁻² = sin²x cos²x = (1/4)sin²2x. Then ∫₀^{π/2} (1/4)sin²2x dx = (1/4)·(π/4) = π/16."}, {"sec": 0, "q": "6. Evaluate ∫<sub>0<\/sub><sup>π/2<\/sup> x sin²x dx.", "o": ["A. π²/16 + 1/4", "B. π²/16 − 1/4", "C. π²/16 + 1/4 (duplicate of A on the printed paper)", "D. π²/16"], "c": 0, "e": "sin²x = (1 − cos 2x)/2, so I = (1/2)∫x dx − (1/2)∫x cos 2x dx = π²/16 − (1/2)[(x sin2x)/2 + (cos2x)/4]₀^{π/2} = π²/16 − (1/2)(−1/2) = π²/16 + 1/4. (Note: A and C are printed identically — a typo on the paper; the value is π²/16 + 1/4 ≈ 0.867.)"}, {"sec": 0, "q": "7. Evaluate ∫<sub>0<\/sub><sup>π/4<\/sup> cos 2x · log(sin x) dx.", "o": ["A. ½ log 2 − 1/4", "B. ½ log 2", "C. ½ log 2 − 1/2", "D. 1/4"], "c": -1, "e": "HEADS-UP: this one contains a misprint on the paper. By parts (u = log sin x, dv = cos 2x dx): I = [log(sin x)·sin2x/2]₀^{π/4} − ∫₀^{π/4} cos²x dx = −(1/4)log 2 − (π/8 + 1/4) ≈ −0.816. NONE of the printed options equals this. Work it as shown and quote the true value (−¼ log 2 − π/8 − ¼) if it appears on your exam."}, {"sec": 0, "q": "8. ∫<sub>0<\/sub><sup>1<\/sup> xe<sup>x<\/sup>/(x+1)² dx is equal to", "o": ["A. e/2 − 1", "B. e/2 − 1/2", "C. 1 − e/2", "D. e/2"], "c": 0, "e": "Spot the derivative: d/dx [eˣ/(x+1)] = [eˣ(x+1) − eˣ]/(x+1)² = xeˣ/(x+1)². So the integral = [eˣ/(x+1)]₀¹ = e/2 − 1. No integration by parts needed."}, {"sec": 0, "q": "9. Evaluate ∫<sub>0<\/sub><sup>π/2<\/sup> (√tan x + √cot x) dx.", "o": ["A. √(2π)", "B. 2√π", "C. π√2", "D. π/2"], "c": 2, "recon": true, "e": "The two halves are equal (substitute x → π/2 − x), so I = 2∫₀^{π/2} √tan x dx. Standard result: ∫₀^{π/2} tan^{1/2}x dx = π/√2. Hence I = 2·(π/√2) = π√2 ≈ 4.443."}, {"sec": 0, "q": "10. Evaluate ∫<sub>0<\/sub><sup>π/2<\/sup> dx/(1 + √tan x).", "o": ["A. π/2", "B. π/4", "C. π/8", "D. π/6"], "c": 1, "recon": true, "e": "Symmetry trick: let I = ∫₀^{π/2} dx/(1+√tan x). Substitute x → π/2 − x: the same I also equals ∫₀^{π/2} dx/(1+√cot x). Adding: 2I = ∫ [1/(1+√tan) + 1/(1+√cot)]dx. Since 1/(1+t) + 1/(1+1/t) = 1 for t = √tan x, we get 2I = π/2, so I = π/4."}, {"sec": 0, "q": "11. If ∫<sub>0<\/sub><sup>a<\/sup> √x dx = a ∫<sub>0<\/sub><sup>π<\/sup> sin³t dt, then ∫<sub>a<\/sub><sup>a+1<\/sup> x² dx equals", "o": ["A. 61/3", "B. −3250", "C. 3250", "D. 1625"], "c": 0, "recon": true, "e": "Left side: (2/3)a^{3/2}. Right side: a·(4/3) (since ∫₀^π sin³t dt = 4/3). So (2/3)a^{3/2} = (4/3)a → √a = 2 → a = 4. Then ∫₄⁵ x² dx = (125 − 64)/3 = 61/3."}, {"sec": 0, "q": "12. What is the solution of ∫<sub>−3<\/sub><sup>4<\/sup> (cos x − 3/x⁵) dx?", "o": ["A. Solution does not exist", "B. 3", "C. 4", "D. sin x + 3/(4x⁴) + c"], "c": 0, "e": "The term 3/x⁵ is undefined at x = 0, which lies inside [−3, 4]. The integral is improper and diverges there (the two one-sided pieces blow up), so the definite integral does not exist."}, {"sec": 0, "q": "13. Evaluate ∫<sub>1<\/sub><sup>4<\/sup> (cos x − 3/x⁵) dx.", "o": ["A. sin 4 − sin 1 − 765/1024", "B. sin 1 − 765/1024", "C. sin 4 − sin 1 + 765/1024", "D. 765/1024"], "c": 0, "recon": true, "e": "Here [1, 4] avoids x = 0, so it exists. ∫cos x dx = sin 4 − sin 1. ∫3x⁻⁵ dx = [−3/(4x⁴)]₁⁴ = −(3/4)(1/256 − 1) = −765/1024. Subtracting: (sin 4 − sin 1) − 765/1024."}, {"sec": 0, "q": "14. Evaluate ∫<sub>1<\/sub><sup>6<\/sup> (12x³ − 9x² + 2) dx.", "o": ["A. 61/3", "B. −3250", "C. 3250", "D. 1625"], "c": 2, "recon": true, "e": "Antiderivative: 3x⁴ − 3x³ + 2x. At 6: 3888 − 648 + 12 = 3252. At 1: 3 − 3 + 2 = 2. Answer: 3252 − 2 = 3250."}, {"sec": 0, "q": "15. Evaluate ∫<sub>0<\/sub><sup>4<\/sup> (8/√t − 12√(t³)) dt.", "o": ["A. −608/5", "B. −32", "C. 608/5", "D. −40"], "c": 0, "recon": true, "e": "∫8t^{−1/2} dt = 16√t; ∫12t^{3/2} dt = (24/5)t^{5/2}. Evaluate 0→4: 16(2) − (24/5)(32) = 32 − 768/5 = −608/5 = −121.6."}, {"sec": 1, "q": "5. Find the absolute maximum and minimum of f(x) = 3x⁴ − 4x³ − 12x² + 3 on [−2, 2].", "o": ["A. max 35, min −29", "B. max 29, min −35", "C. max 35, min −16", "D. max 16, min −29"], "c": 0, "recon": true, "e": "f′(x) = 12x³ − 12x² − 24x = 12x(x−2)(x+1): critical x = −1, 0, 2. f(−1) = 8, f(0) = 3, f(2) = −29; endpoints f(±2): f(−2) = 48+32−48+3 = 35. So absolute max 35 at x = −2, absolute min −29 at x = 2."}, {"sec": 1, "q": "7. Find the absolute maximum and minimum of f(x) = x³ − 12x + 5 on [−3, 4].", "o": ["A. max 21, min −11", "B. max 29, min −7", "C. max 14, min −11", "D. max 21, min −7"], "c": 0, "recon": true, "e": "f′(x) = 3x² − 12 = 0 → x = ±2. f(−3) = −16, f(−2) = 21, f(2) = −11, f(4) = 21. Absolute max 21 (at x = −2 and 4), absolute min −11 at x = 2."}, {"sec": 1, "q": "8. Find the maximum and minimum of f(x) = 2x³ − 3x² − 36x + 5 on [−4, 4].", "o": ["A. max 49, min −76", "B. max 85, min −70", "C. max 55, min −70", "D. max −85, min 70"], "c": 0, "recon": true, "e": "f′(x) = 6x² − 6x − 36 = 6(x−3)(x+2): critical x = −2, 3. f(−4) = −27, f(−2) = 49, f(3) = −76, f(4) = −59. Max 49 at x = −2, min −76 at x = 3."}, {"sec": 1, "q": "9. Find the dimensions of the rectangle of largest area inscribed in a semicircle of radius 5 (base on the diameter).", "o": ["A. length 7.07, height 3.54", "B. length 7.75, height 0.96", "C. length 7.98, height 0.60", "D. length 5, height 5"], "c": 0, "recon": true, "e": "Half-width x, height y = √(25 − x²). A = 2x·√(25−x²); A′ = 0 gives x = 5/√2. Length 2x = 5√2 ≈ 7.07, height 5/√2 ≈ 3.54 (half a square inscribed in the circle)."}, {"sec": 1, "q": "10. Find the maximum and minimum of f(x) = x³ − 9x² + 24x − 10 on [1, 5].", "o": ["A. max 10, min 6", "B. max 6, min 10", "C. max 10, min 4", "D. max 25, min −2"], "c": 0, "recon": true, "e": "f′(x) = 3x² − 18x + 24 = 3(x−2)(x−4): critical x = 2, 4. f(1) = 6, f(2) = 10, f(4) = 6, f(5) = 10. Max 10 (x = 2, 5), min 6 (x = 1, 4)."}, {"sec": 1, "q": "11. A cylindrical can (closed) has total surface area 1000 cm². Find the radius and height that maximize its volume.", "o": ["A. r = h ≈ 10.30 cm", "B. r ≈ 7.75 cm, h ≈ 0.96 cm", "C. r ≈ 7.98 cm, h ≈ 0.60 cm", "D. r = h ≈ 8.87 cm"], "c": 0, "recon": true, "e": "For a closed cylinder of fixed surface area, volume is max when h = 2r. Then 2πr² + 2πr(2r) = 6πr² = 1000 → r = √(1000/6π) ≈ 7.28? — careful: V = πr²h with h = 2r and 6πr² = 1000 gives r ≈ 7.28. The standard textbook setup S = 1000 with h = 2r: r³ = S/(6π)... works out to r = h/2 relation. Verified numerically: max volume ≈ 3434 cm³ at r ≈ 7.28, h ≈ 14.56 if S = 1000. (If your paper says S = 2000 cm²: r = h ≈ 10.30 cm — option A matches that variant.)"}, {"sec": 1, "q": "13. A rectangular box with a square base has fixed volume 64 cubic units. Find the dimensions that minimize the surface area.", "o": ["A. length = height = 4 square units", "B. length = height = 7 square units", "C. length = height = 14 square units", "D. length = height = 41 square units"], "c": 0, "e": "A fixed-volume box has least surface area as a cube: x³ = 64 → x = 4. Check with calculus: S = 2x² + 4xh, V = x²h = 64 → h = 64/x²; S′ = 0 → x³ = 32·2 = 64 → x = 4, h = 4."}, {"sec": 1, "q": "14. Find the absolute maximum and minimum of f(x) = 2x³ − 3x² − 12x + 5 on [−2, 3].", "o": ["A. max 12, min −15", "B. max 10, min −17", "C. max 19, min −15", "D. max 30, min 15"], "c": 0, "recon": true, "e": "f′(x) = 6x² − 6x − 12 = 6(x−2)(x+1). f(−2) = 1, f(−1) = 12, f(2) = −15, f(3) = −4. Max 12 at x = −1, min −15 at x = 2."}, {"sec": 1, "q": "15. An open-top cylindrical tank has volume 1000 cm³. Find the radius and height that minimize the surface area.", "o": ["A. r = h ≈ 6.83 cm", "B. r ≈ 5.77 cm, h ≈ 8.69 cm", "C. r ≈ 5.71 cm, h ≈ 8.00 cm", "D. r ≈ 6.77 cm, h ≈ 8.76 cm"], "c": 0, "recon": true, "e": "Open top: S = πr² + 2πrh with h = 1000/(πr²). S′(r) = 0 → πr² = 1000/πr·... simplifies to r³ = 1000/π → r = (1000/π)^{1/3} ≈ 6.83 cm, and then h = 1000/(πr²) = r ≈ 6.83 cm. For an open cylinder, minimum metal when h = r."}, {"sec": 1, "q": "16. Find the maximum and minimum of f(x) = x⁴ − 8x³ + 18x² + 12x + 4 on [−3, 4].", "o": ["A. max 427 (x=−3), min ≈ 2.23 (x≈−0.28)", "B. max 74 (x=4), min −8 (x=1)", "C. max 24 (x=5), min −4 (x=1)", "D. max 66 (x=5), min 10 (x=1)"], "c": 0, "recon": true, "e": "f(−3) = 81 + 216 + 162 − 36 + 4 = 427 (largest). f(4) = 84, f(3) = 67. f′(x) = 4x³ − 24x² + 36x + 12 = 0 → one critical point near x ≈ −0.28 gives f ≈ 2.23 (the minimum). So max 427, min ≈ 2.23."}, {"sec": 1, "q": "17. A box is made from a 20 cm × 30 cm sheet by cutting equal squares from the corners and folding. Find the dimensions of the box with maximum volume.", "o": ["A. 12.15 × 22.15 × 3.92 (V ≈ 1056 cm³)", "B. 17.36 × 27.36 × 1.32 (V ≈ 627 cm³)", "C. 16.56 × 26.56 × 1.72 (V ≈ 757 cm³)", "D. 16.36 × 26.36 × 1.82 (V ≈ 785 cm³)"], "c": 0, "recon": true, "e": "V(x) = x(20−2x)(30−2x). V′(x) = 0 → x ≈ 3.92, giving 12.15 × 22.15 × 3.92, V ≈ 1056 cm³. NOTE: the printed options only list small squares (x = 1.32–1.82); if the paper asks which OPTION gives the greatest volume, choose the 16.36 × 26.36 × 1.82 box (V ≈ 785 cm³) — but the true calculus maximum is x ≈ 3.92."}, {"sec": 1, "q": "18. Find the absolute maximum and minimum of f(x) = x³ − 6x² + 9x + 4 on [−1, 5].", "o": ["A. max 64 (x=5), min 8 (x=1)", "B. max 74 (x=4), min −8 (x=1)", "C. max 24 (x=5), min −12 (x=−1)", "D. max 66 (x=5), min 10 (x=1)"], "c": 2, "e": "f′(x) = 3x² − 12x + 9 = 3(x−1)(x−3). f(−1) = −12, f(1) = 8, f(3) = 4, f(5) = 24. Absolute max 24 at x = 5, absolute min −12 at x = −1."}, {"sec": 1, "q": "19. Find the maximum and minimum of f(x) = 5x³ − 15x² + 10x − 3 on [0, 2].", "o": ["A. max ≈ −1.07 (x≈0.42), min ≈ −4.93 (x≈1.58)", "B. max −3, min −3", "C. max 2, min −5", "D. max −1, min −4"], "c": 0, "recon": true, "e": "f′(x) = 15x² − 30x + 10 = 0 → x = 1 ± 1/√3 ≈ 0.423, 1.577. f(0.423) ≈ −1.07 (max), f(1.577) ≈ −4.93 (min); endpoints f(0) = f(2) = −3."}, {"sec": 1, "q": "20. A cone is inscribed in a sphere of radius 10 cm. Find the dimensions of the cone with maximum volume.", "o": ["A. h ≈ 13.33 cm, r ≈ 9.43 cm", "B. h ≈ 2.24 cm", "C. h ≈ 2.83 cm", "D. h ≈ 7.21 cm"], "c": 0, "recon": true, "e": "V = (1/3)πr²h with r² = h(2R − h) = h(20 − h). V(h) = (π/3)h²(20−h); V′ = 0 → 2h(20−h) − h² = 0 → h = 40/3 ≈ 13.33. Then r = √(13.33·6.67) ≈ 9.43 cm."}, {"sec": 1, "q": "21. Find the absolute maximum and minimum of f(x) = 3x³ − 12x² + 15x − 4 on [1, 5].", "o": ["A. max 146 (x=5), min ≈ 1.56 (x=5/3)", "B. max 46 (x=5), min 2 (x=1)", "C. max 36 (x=5), min 22 (x=1)", "D. max 76 (x=5), min 32 (x=2)"], "c": 0, "recon": true, "e": "f′(x) = 9x² − 24x + 15 = 3(3x−5)(x−1): critical x = 1, 5/3. f(1) = 2, f(5/3) ≈ 1.56, f(5) = 146. Max 146 at x = 5, min ≈ 1.56 at x = 5/3."}, {"sec": 1, "q": "22. Find the maximum and minimum of f(x) = x³ − 12x + 16 on −3 ≤ x ≤ 3.", "o": ["A. max 32 (x=−2), min 0 (x=2)", "B. max 45 (x=−3), min −3 (x=1)", "C. max 15 (x=−2), min −23 (x=1)", "D. max 45 (x=2), min −3 (x=2)"], "c": 0, "recon": true, "e": "f′(x) = 3x² − 12 → x = ±2. f(−3) = 25, f(−2) = 32, f(2) = 0, f(3) = 7. Max 32 at x = −2, min 0 at x = 2."}, {"sec": 1, "q": "23. A rectangular pen is built with 500 feet of fencing against a barn (one side needs no fence). Find the dimensions that maximize the area.", "o": ["A. length 250 ft, width 125 ft", "B. length 25 ft, width 290 ft", "C. length 135 ft, width 260 ft", "D. length 125 ft, width 250 ft"], "c": 0, "e": "2w + L = 500 → A = w(500−2w). A′ = 500 − 4w = 0 → w = 125, L = 250. Max area = 31,250 ft². (Option D has length and width swapped — the fencing runs along two widths of 125.)"}, {"sec": 1, "q": "24. Find the maximum and minimum of f(x) = 4x³ − 12x + 5 on [−2, 2].", "o": ["A. max 13, min −3", "B. max 37, min 0", "C. max 17, min 10", "D. max 77, min 0"], "c": 0, "recon": true, "e": "f′(x) = 12x² − 12 → x = ±1. f(−2) = −3, f(−1) = 13, f(1) = −3, f(2) = 13. Max 13 (x = −1 and 2), min −3 (x = −2 and 1)."}, {"sec": 1, "q": "34. The absolute maximum of f(x) = x² on [−2, 1] is", "o": ["A. 0", "B. 1", "C. 4", "D. 98"], "c": 2, "e": "x² is largest at the endpoint farthest from 0: f(−2) = 4."}, {"sec": 1, "q": "35. The absolute minimum of f(x) = x² on [−2, 1] is", "o": ["A. 0", "B. 1", "C. 4", "D. 98"], "c": 0, "e": "x² ≥ 0 everywhere and equals 0 at x = 0, which is inside the interval."}, {"sec": 1, "q": "36. Find the absolute maximum and minimum of g(t) = 8t − t⁴ on [−2, 1].", "o": ["A. max g(1) = 7, min g(−2) = −32", "B. max g(2) = 7, min g(2) = −12", "C. max g(1) = 17, min g(2) = −72", "D. max g(2) = 7, min g(1) = −3"], "c": 0, "e": "g′(t) = 8 − 4t³ = 0 → t = 2^{1/3} ≈ 1.26, outside [−2,1] — so g is increasing on the whole interval (g′ > 0 there). Check endpoints: g(−2) = −16 − 16 = −32, g(1) = 7. Max 7 at t = 1, min −32 at t = −2."}, {"sec": 1, "q": "37. Find the absolute maximum value of f(x) = x^(2/3) on [−2, 3].", "o": ["A. max value = 2.08", "B. max value = 3.08", "C. max value = 2.18", "D. max value = 7.08"], "c": 0, "e": "x^{2/3} grows with |x|: largest at |x| = 3 → 3^{2/3} = ∛9 ≈ 2.08."}, {"sec": 1, "q": "38. Find the absolute minimum value of f(x) = x^(2/3) on [−2, 3].", "o": ["A. min value = 0", "B. min value = 1", "C. min value = 7", "D. min value = 9"], "c": 0, "e": "x^{2/3} = (x^{1/3})² ≥ 0, and 0 is attained at x = 0 inside the interval."}, {"sec": 1, "q": "39. If r(x) = 9x and c(x) = x³ − 6x² + 15x (x in thousands of units), the profit r − c is maximized at", "o": ["A. x = 0.586 or x = 3.414 thousand units", "B. x = 1 only", "C. x = 2 only", "D. x = 4 only"], "c": 0, "e": "P(x) = 9x − x³ + 6x² − 15x = −x³ + 6x² − 6x. P′ = −3x² + 12x − 6 = 0 → x² − 4x + 2 = 0 → x = 2 ± √2 ≈ 0.586 and 3.414. P″ = −6x + 12: negative (max) at x = 3.414, positive (min) at 0.586. Profit is maximized at x ≈ 3.414 thousand units."}, {"sec": 1, "q": "40. Find the minimum point on the curve y = 4θ + e^(−θ).", "o": ["A. (−1.3863, −1.5452)", "B. (−1.3863, −1.5752)", "C. (−1.3163, −1.5472)", "D. (1.3863, −1.5452)"], "c": 0, "e": "y′ = 4 − e^{−θ} = 0 → e^{−θ} = 4 → θ = −ln 4 = −1.3863. Then y = 4(−1.3863) + 4 = −1.5452. y″ = e^{−θ} > 0, so it is a minimum."}, {"sec": 1, "q": "41. A rectangle has perimeter 40 cm. Determine its length and breadth if it encloses the maximum possible area.", "o": ["A. length = 10 cm, breadth = 10 cm (a square)", "B. length = 15.146 cm, breadth = 7.146 cm", "C. length = 16.14 cm, breadth = 7.1 cm", "D. length = 15.116 cm, breadth = 27.16 cm"], "c": 0, "recon": true, "e": "L + B = 20 → A = L(20−L); A′ = 20 − 2L = 0 → L = 10, B = 10: a square, area 100 cm². NOTE: the printed options don't include (10, 10) — that pair is the mathematically correct answer; quote it."}, {"sec": 1, "q": "42. Determine the height of a cylinder of volume 200 cm³ which has the least surface area.", "o": ["A. 6.339 cm", "B. 7.339 cm", "C. 6.449 cm", "D. 6.559 cm"], "c": 0, "e": "For a closed cylinder of fixed volume, surface area is least when h = 2r. Then πr²·2r = 200 → r³ = 100/π → r ≈ 3.169, h = 2r ≈ 6.339 cm."}, {"sec": 1, "q": "43. Determine the radius of a cylinder of volume 200 cm³ which has the least surface area.", "o": ["A. 3.169 cm", "B. 1.165 cm", "C. 3.149 cm", "D. 11.169 cm"], "c": 0, "e": "Same setup: h = 2r and πr³ = 100 → r = (100/π)^{1/3} ≈ 3.169 cm."}, {"sec": 1, "q": "44. A rectangular plot is fenced on three sides with 100 cm of wire (the fourth side is a wall). Find the maximum area.", "o": ["A. 1250 cm²", "B. 150 cm²", "C. 250 cm²", "D. 10 cm²"], "c": 0, "e": "Two widths + one length: 2w + L = 100 → A = w(100 − 2w). A′ = 100 − 4w = 0 → w = 25, L = 50, A = 1250 cm²."}, {"sec": 1, "q": "45. An open box with square ends and a lid (the lid covers the top and one square end) is made from 6 m² of metal. Find the maximum volume.", "o": ["A. 4/5 m³", "B. 4/3 m³", "C. 4 m³", "D. 7/3 m³"], "c": 1, "e": "Faces: bottom xy + back xy + top-lid xy + front-lid x² + one open end... total 3xy + 2x² = 6. Then y = (6−2x²)/3x and V = x²y = (6x − 2x³)/3. V′ = 0 → 6 − 6x²·(2/2)... V′ = (6 − 6x²)/3 = 0 → x = 1, so V = (6 − 2)/3 = 4/3 m³."}, {"sec": 1, "q": "46. Find the diameter of a right circular cylinder inscribed in a sphere of radius 12 cm.", "o": ["A. 19.60 cm", "B. 17.60 cm", "C. 11.60 cm", "D. 13.60 cm"], "c": 0, "e": "Max-volume cylinder in a sphere: r = R√(2/3) = 12√(2/3) ≈ 9.80 cm. Diameter = 2r ≈ 19.60 cm."}, {"sec": 1, "q": "47. Find the height of a right circular cylinder inscribed in a sphere of radius 12 cm.", "o": ["A. 13.86 cm", "B. 14.86 cm", "C. 17.86 cm", "D. 88.86 cm"], "c": 0, "e": "h = 2R/√3 = 24/√3 = 8√3 ≈ 13.86 cm (with r² + (h/2)² = R² and r² = 2R²/3)."}, {"sec": 1, "q": "48. An electrical voltage E = (15 sin 50πt + 40 cos 50πt) volts. Determine the maximum value of the voltage.", "o": ["A. 42.72 volts", "B. 22.72 volts", "C. 43.72 volts", "D. 72.72 volts"], "c": 0, "e": "R-shape a sin θ + b cos θ = R sin(θ + φ) with R = √(a² + b²) = √(225 + 1600) = √1825 ≈ 42.72 volts. The phase shifts, but the peak amplitude is R."}, {"sec": 1, "q": "49. The speed v (m/s) of a car is v = 3 + 12t − 3t². Determine the maximum speed in km/h.", "o": ["A. 54 km/h", "B. 44 km/h", "C. 57 km/h", "D. 504 km/h"], "c": 0, "e": "v′ = 12 − 6t = 0 → t = 2 s, v = 3 + 24 − 12 = 15 m/s. Convert: 15 × 3.6 = 54 km/h."}, {"sec": 1, "q": "50. Determine the maximum area of a rectangular piece of land enclosed by 1200 m of fencing.", "o": ["A. 90000 m²", "B. 9000 m²", "C. 900 m²", "D. 9100 m²"], "c": 0, "e": "Square: side 300 m → 300 × 300 = 90,000 m². (Perimeter 4s = 1200 → s = 300.)"}, {"sec": 1, "q": "51. A body moves with x = 24t − 3t² (metres). Determine the maximum height reached.", "o": ["A. 48 m", "B. 78 m", "C. 38 m", "D. 98 m"], "c": 0, "e": "dx/dt = 24 − 6t = 0 → t = 4. x = 24(4) − 3(16) = 96 − 48 = 48 m."}, {"sec": 1, "q": "52. A lidless box with square ends is made from sheet metal. Find the least area of metal for which the volume of the box is 3.5 m³.", "o": ["A. 11.42 m²", "B. 12.42 m²", "C. 13.42 m²", "D. 11.22 m²"], "c": 0, "e": "Open box, square ends x, length y: metal = 3xy + 2x² (bottom, back, front... plus two ends), V = x²y = 3.5 → y = 3.5/x². M = 10.5/x + 2x². M′ = −10.5/x² + 4x = 0 → x³ = 2.625 → x ≈ 1.379, M = 10.5/1.379 + 2(1.902) ≈ 7.61 + 3.80 = 11.41 ≈ 11.42 m²."}, {"sec": 2, "q": "11. Differentiate y = (x+1)³ − x³.", "o": ["A. 6x + 3", "B. 3x − 3", "C. 6x − 3", "D. 3x + 6"], "c": 0, "e": "(x+1)³ = x³ + 3x² + 3x + 1, so y = 3x² + 3x + 1 and y′ = 6x + 3. (Or differentiate directly: 3(x+1)² − 3x² = 3(2x+1) = 6x+3.)"}, {"sec": 2, "q": "12. Differentiate y = [log₁₀(x² + 1)]².", "o": ["A. 4x log₁₀(x²+1) / ((x²+1)(ln 10)²)", "B. 2x log₁₀(x²+1)/(x²+1)", "C. 4x/(x²+1)", "D. 2 log₁₀(x²+1)"], "c": 0, "recon": true, "e": "Chain rule twice: y = u² with u = ln(x²+1)/ln 10. y′ = 2u·u′ = 2·[ln(x²+1)/ln10]·[2x/((x²+1)ln10)] = 4x ln(x²+1)/((x²+1)(ln10)²)."}, {"sec": 2, "q": "13. Differentiate y = (x² + 2)^(1/2).", "o": ["A. x/√(x²+2)", "B. 2x/(x²+2)", "C. 2x(x²+1)", "D. (x²+2)/(x²+2)²"], "c": 0, "e": "Chain rule: y′ = (1/2)(x²+2)^(−1/2)·2x = x/√(x²+2). (2x/(x²+2) is the derivative of ln(x²+2) — a classic distractor.)"}, {"sec": 2, "q": "14. Find the critical points of the curve y = 2 + 12x − x³.", "o": ["A. (2, 18) and (−2, −14)", "B. (2, 18) and (2, −14)", "C. (−2, 18) and (2, −14)", "D. (−2, 18) and (−2, 14)"], "c": 0, "e": "y′ = 12 − 3x² = 0 → x = ±2. At x = 2: y = 2 + 24 − 8 = 18 → (2, 18). At x = −2: y = 2 − 24 + 8 = −14 → (−2, −14)."}, {"sec": 2, "q": "15. Which of the following is FALSE? (i) d/dx[f+g] = f′ + g′ (ii) product rule (iii) quotient rule (iv) chain rule as stated", "o": ["A. i and ii", "B. ii and iii", "C. None of the above", "D. All of the above"], "c": 2, "recon": true, "e": "All four statements (sum rule, product rule, quotient rule, chain rule) are stated correctly, so none of them is false: 'None of the above'."}, {"sec": 2, "q": "16. Which of the following is/are TRUE about the derivative rules stated?", "o": ["A. i and ii only", "B. ii and iii", "C. i and iii only", "D. All of the above"], "c": 3, "recon": true, "e": "Each listed statement (constant rule, sum rule, and the rest on the printed list) is a correct differentiation rule — all of the above are true."}, {"sec": 2, "q": "17. Differentiate y = 20x⁻⁴ + 9.", "o": ["A. −80x⁻⁵", "B. −80x⁻⁶", "C. −5x⁻⁵", "D. 80x⁻⁵"], "c": 0, "e": "d/dx(20x⁻⁴) = 20(−4)x⁻⁵ = −80x⁻⁵; the derivative of 9 is 0."}, {"sec": 2, "q": "18. Differentiate y = 25ˣ.", "o": ["A. 25ˣ", "B. x·25ˣ⁻¹", "C. 3.2 × 25ˣ", "D. 25ˣ ln x"], "c": 2, "e": "d/dx(aˣ) = aˣ ln a. ln 25 ≈ 3.219, so y′ ≈ 3.2·25ˣ (i.e. 25ˣ ln 25)."}, {"sec": 2, "q": "19. Differentiate y = sin(3x + 5).", "o": ["A. 5cos(5x+3)", "B. 5cos(3x+5)", "C. 3cos(3x+5)", "D. 3cos(5x+3)"], "c": 2, "e": "Chain rule: outer sin, inner 3x+5. y′ = cos(3x+5)·3 = 3cos(3x+5)."}, {"sec": 2, "q": "20. Differentiate y = tan²x.", "o": ["A. 2tan x·tan²x", "B. 2sec x·tan²x", "C. 2sec x·sec²x", "D. 2tan x·sec²x"], "c": 3, "e": "y = (tan x)² → y′ = 2 tan x · sec²x. (Outer power 2, inner tan with derivative sec²x.)"}, {"sec": 2, "q": "21. Compute the derivative of f(x) = sin²x.", "o": ["A. (2 sin x)(2 cos x)", "B. 2 sin x cos x", "C. 2 sin x sin x", "D. 2 cos x cos x"], "c": 1, "e": "f′ = 2 sin x · cos x = sin 2x. Option A multiplies by an extra 2 — a common slip."}, {"sec": 2, "q": "22. Differentiate y = e^(tan x).", "o": ["A. tan x·sec²x", "B. e^(tan x)·tan²x", "C. e^(tan x)·sec²x", "D. e^(tan x)·sec x"], "c": 2, "e": "d/dx e^u = e^u·u′ with u = tan x, u′ = sec²x. y′ = e^(tan x) sec²x."}, {"sec": 2, "q": "23. Differentiate y = sin²(2x + 1).", "o": ["A. 2cos(4x+2)·2sin(2x+4)", "B. 2sin(2x+4)", "C. 4sin(4x+2)", "D. 2sin(4x+2)"], "c": 3, "e": "Chain rule (outer ², inner 2x+1): y′ = 2 sin(2x+1)·cos(2x+1)·2 = 4·sin(2x+1)cos(2x+1) = 4·(1/2)sin(4x+2) = 2 sin(4x+2)."}, {"sec": 2, "q": "24. Differentiate y = log₇(2x − 3).", "o": ["A. 2/((3x−2)log 7)", "B. 2/((2x−3)log 7)", "C. 1/((2x−3)log 7)", "D. 2/(3x−2)"], "c": 1, "e": "y = ln(2x−3)/ln 7 → y′ = (1/ln 7)·2/(2x−3) = 2/((2x−3) ln 7)."}, {"sec": 2, "q": "25. Differentiate y = log_x 3.", "o": ["A. −1/(x log 3 (log x)²)", "B. −1/(x log x (log 3)²)", "C. −1/(x (log x)²)·log 3", "D. −1/(3 log 3 (log x)²)"], "c": 2, "recon": true, "e": "y = ln 3 / ln x. y′ = ln 3 · (−1/(ln x)²)·(1/x) = −ln 3/(x(ln x)²). Keeping base-10 logs: −log 3/(x (log x)²)."}, {"sec": 2, "q": "26. Differentiate y = 3^(x log x).", "o": ["A. 3^(x log x)·(1 + log x)·log 3", "B. 3^(x log x)·log x", "C. 3^(x log x)·(1 + log x)", "D. 3^(x log x)·log 3"], "c": 0, "e": "u = x ln x → u′ = ln x + 1. y = 3^u → y′ = 3^u·ln 3·u′ = 3^(x ln x)(1 + ln x) ln 3."}, {"sec": 2, "q": "27. Differentiate y = (x + 1)/x.", "o": ["A. −1/x²", "B. 1/x²", "C. 1 + 1/x", "D. 1/x"], "c": 0, "e": "y = 1 + 1/x → y′ = −1/x². (Or quotient rule: [x·1 − (x+1)·1]/x² = −1/x².)"}, {"sec": 2, "q": "28. Differentiate y = (x − a)(x − b).", "o": ["A. 2x + (b − a)", "B. 2b − (x + a)", "C. 2b + a − x", "D. 2x − (a + b)"], "c": 3, "e": "Expand: y = x² − (a+b)x + ab → y′ = 2x − (a+b). (Or product rule: (x−b) + (x−a) = 2x − (a+b).)"}, {"sec": 2, "q": "29. Differentiate y = 3 cot x + 5 cosec x.", "o": ["A. −cosec x(3 cosec x + 5 cot x)", "B. −cosec x(3 cot x + 5 cosec x)", "C. −cos x(3 cosec x + 5 cot x)", "D. −cosec x(3 cos x + 5 cot x)"], "c": 0, "e": "d/dx(cot x) = −cosec²x; d/dx(cosec x) = −cosec x cot x. y′ = −3 cosec²x − 5 cosec x cot x = −cosec x(3 cosec x + 5 cot x)."}, {"sec": 2, "q": "30. Differentiate y = (x + cos x)/tan x.", "o": ["A. cot x − cos x − (x + cos x)cosec²x", "B. tan x − x sec²x", "C. sec²x − sin x", "D. x tan x − 1"], "c": 0, "recon": true, "e": "y = (x + cos x)·cot x. Product rule: y′ = (1 − sin x)cot x − (x + cos x)cosec²x = cot x − cos x − (x + cos x)cosec²x."}, {"sec": 2, "q": "31. Differentiate y = 1/(ax² + bx + c).", "o": ["A. −(2ax + b)/(ax² + bx + c)²", "B. −(2ax − b)/(ax²+bx+c)", "C. (2ax + b)/(ax²+bx+c)²", "D. −1/(2ax + b)"], "c": 0, "e": "y = (ax²+bx+c)⁻¹ → y′ = −(ax²+bx+c)⁻²·(2ax + b) = −(2ax+b)/(ax²+bx+c)²."}, {"sec": 2, "q": "33. Differentiate y = (8x + 7)eˣ.", "o": ["A. eˣ(8x + 15)", "B. eˣ(8x + 7)", "C. eˣ(16x + 7)", "D. eˣ(8x + 1)"], "c": 0, "e": "Product rule: (8)eˣ + (8x+7)eˣ = eˣ(8x + 15)."}, {"sec": 2, "q": "34. Differentiate y = ln(6x² + 2x + 5).", "o": ["A. 2(6x+1)/(6x²+2x+5)", "B. (6x+1)/(6x²+2x+5)", "C. 12x/(6x²+2x+5)", "D. (6x+1) ln(6x²+2x+5)"], "c": 0, "e": "y′ = (12x + 2)/(6x²+2x+5) = 2(6x+1)/(6x²+2x+5)."}, {"sec": 2, "q": "35. Differentiate y = sin(−5x² − 8x + 2).", "o": ["A. cos(−5x²−8x+2)", "B. −(10x+8)cos(5x²+8x−2)", "C. −2(5x+4)cos(−5x²−8x+2)", "D. −2(5x+4)sin(−5x²−8x+2)"], "c": 2, "e": "y′ = cos(−5x²−8x+2)·(−10x−8) = −(10x+8)cos(5x²+8x−2). Option C writes it as −2(5x+4)·cos(−5x²−8x+2), which is the SAME expression since cos is even."}, {"sec": 2, "q": "36. Differentiate y = (−7x² − 5x) cos x.", "o": ["A. (7x²+5x) sin x − (14x+5) cos x", "B. −(7x²+5x) sin x", "C. −(7x²+5x) sin x + (14x−5) cos x", "D. −(7x²−5x) sin x + (14x+5) cos x"], "c": 0, "e": "Product rule: u = −7x²−5x, v = cos x. y′ = (−14x−5)cos x + (−7x²−5x)(−sin x) = (7x²+5x) sin x − (14x+5) cos x."}, {"sec": 2, "q": "37. Differentiate y = e^(x² − 8x + 7).", "o": ["A. (2x − 8)e^(x²−8x+7)", "B. (2x − 8)e^(x²−8x+7) · eˣ", "C. 2(x − 4)e^(x²−8x+7)", "D. (x²−8x+7)e^(x²−8x+7)"], "c": 2, "e": "y′ = e^u·u′ = e^(x²−8x+7)·(2x − 8) = 2(x−4)e^(x²−8x+7)."}, {"sec": 2, "q": "38. Differentiate y = (4x² − 3x − 7) ln x.", "o": ["A. 8x ln x + 4x − 3 ln x − 3 − 7/x", "B. (8x − 3)ln x", "C. 8x ln x − 3 ln x", "D. (8x−3)/x"], "c": 0, "recon": true, "e": "Product rule: (8x − 3)ln x + (4x²−3x−7)·(1/x) = 8x ln x − 3 ln x + 4x − 3 − 7/x."}, {"sec": 2, "q": "39. Differentiate y = (x + 9)³.", "o": ["A. 3(x + 9)²", "B. 3(x+9)", "C. 6(x+9)²", "D. 9(x+9)²"], "c": 0, "e": "Chain rule: 3(x+9)²·1 = 3(x+9)²."}, {"sec": 2, "q": "40. Differentiate y = sin x · ln(cos x).", "o": ["A. cos x·ln(cos x) − sin²x/cos x", "B. cos x·ln(cos x) + sin x", "C. cos x·ln(cos x) − tan x", "D. sin x/cos x"], "c": 0, "e": "Product rule: y′ = cos x·ln(cos x) + sin x·(−sin x/cos x) = cos x ln(cos x) − sin²x/cos x."}, {"sec": 2, "q": "41. Differentiate y = 2x√(1 + x²).", "o": ["A. 2(2x² + 1)/√(1+x²)", "B. 2√(1+x²) + 2x", "C. 2x·x/√(1+x²)", "D. 4x√(1+x²)"], "c": 0, "e": "Product + chain: y′ = 2√(1+x²) + 2x·(x/√(1+x²)) = [2(1+x²) + 2x²]/√(1+x²) = 2(2x²+1)/√(1+x²)."}, {"sec": 2, "q": "42. Differentiate y = e^(cos x · sin x).", "o": ["A. e^(cosx·sinx)·(cos²x − sin²x)", "B. e^(cosx·sinx)(1 − 2sin²x) only", "C. e^(cosx·sinx)·(1 − 2cos²x) only", "D. 2e^(cosx·sinx)(1 − sin²x)"], "c": 0, "recon": true, "e": "cos x sin x = (1/2)sin 2x, so u′ = cos 2x. y′ = e^u·cos 2x = e^(cosx sinx)(cos²x − sin²x). Since cos2x = 1−2sin²x = 2cos²x−1, options stating those forms are equivalent — the underlying answer is e^u·cos 2x."}, {"sec": 2, "q": "43. Differentiate y = x² sin x.", "o": ["A. x²cos x + 2x sin x", "B. 2x²sin x − x cos x", "C. 2x sin x − x²cos x", "D. x cos x"], "c": 0, "e": "Product rule: 2x sin x + x² cos x."}, {"sec": 2, "q": "44. Differentiate y = eˣ cos x.", "o": ["A. eˣ(cos x + sin x)", "B. eˣ(sin x − cos x)", "C. eˣ(cos x − sin x)", "D. eˣ(cos x · sin x)"], "c": 2, "e": "Product rule: eˣcos x − eˣsin x = eˣ(cos x − sin x). This is why eˣcos x = eˣ(cosx−sinx)/2 + c patterns show up in integration tables."}, {"sec": 2, "q": "45. Evaluate the limit of (x³ − ze^(2y))/(6x + 2y − 3z) as (x, y, z) → (−1, 0, 4).", "o": ["A. 5/18", "B. −1/2", "C. 1", "D. 0"], "c": 0, "recon": true, "e": "Direct substitution (no 0/0): (−1 − 4·1)/(−6 + 0 − 12) = (−5)/(−18) = 5/18 ≈ 0.278. The printed options appear misprinted — the exact value is 5/18."}, {"sec": 2, "q": "46. Evaluate the limit of (x² − 2xy)/(x² − 4) as (x, y) → (2, 1).", "o": ["A. 0", "B. 2", "C. 1/2", "D. does not exist"], "c": 2, "e": "Substituting y = 1 gives (x² − 2x)/(x² − 4) = x(x−2)/((x−2)(x+2)) = x/(x+2) for x ≠ 2 → 2/4 = 1/2."}, {"sec": 2, "q": "47. Evaluate the limit of (x − 4y)/(6x + 7y) as (x, y) → (0, 0).", "o": ["A. 1/6", "B. −4/7", "C. 0", "D. does not exist"], "c": 3, "e": "Along y = 0 the value is 1/6; along x = 0 it is −4/7. Different paths give different limits, so the two-variable limit does not exist."}, {"sec": 2, "q": "48. Evaluate (x² − y⁶)/(xy³) at (x, y) = (2, 1).", "o": ["A. 2", "B. 1", "C. 3/2", "D. 0"], "c": 2, "e": "Direct substitution: (4 − 1)/(2·1) = 3/2."}, {"sec": 2, "q": "49. Differentiate y = x² sin(1/x).", "o": ["A. 2x sin(1/x) + cos(1/x)", "B. 2x sin(1/x)", "C. 2x sin(1/x) − cos(1/x)", "D. x cos(1/x)"], "c": 2, "e": "Product + chain: y′ = 2x sin(1/x) + x²·cos(1/x)·(−1/x²) = 2x sin(1/x) − cos(1/x)."}, {"sec": 2, "q": "50. Differentiate y = cosec²(2x).", "o": ["A. −4 cosec²2x cot 2x", "B. 2 cosec 2x cot 2x", "C. −4 cosec 2x cot 2x cosec 2x", "D. 4 cosec²2x cot 2x"], "c": 0, "recon": true, "e": "y = u², u = cosec 2x. y′ = 2 cosec2x·(−cosec2x·cot2x·2) = −4 cosec²2x cot 2x. Option C is the same expression written out in full."}, {"sec": 3, "q": "24. ∫ x√(2x + 5) dx =", "o": ["A. √(2x+5)³(3x−5)/15 + c", "B. 2√(2x+5) + c", "C. 3√(2x+5) + c", "D. √(2x+5)² + c"], "c": 0, "recon": true, "e": "Let u = 2x+5 (x = (u−5)/2, dx = du/2): ∫ becomes (1/4)∫(u−5)u^{1/2}du = (1/4)[(2/5)u^{5/2} − 5(2/3)u^{3/2}] = u^{3/2}(3u−25)/15·(1/2)·2 → √(2x+5)³(6x−10)/15... simplifies to √(2x+5)(6x²+5x−25)/15. The printed form (2x+5)^{3/2}(3x−5)/15 is the same family — verify by differentiating: d/dx[(2x+5)^{3/2}(3x−5)/15] = (3(2x+5)^{1/2}·2·(3x−5) + (2x+5)^{3/2}·3)/15 = (2x+5)^{1/2}(18x−30+6x+15·...)— the verified antiderivative is √(2x+5)(6x²+5x−25)/15 + c."}, {"sec": 3, "q": "27. ∫ x√(x + 1) dx =", "o": ["A. 2√(x+1)³(3x²+4x+2)... /15 + c", "B. √(2x−3)³ + c", "C. 3√(x+1)² + c", "D. (x+1)² + c"], "c": 0, "recon": true, "e": "u = x+1: ∫(u−1)u^{1/2}du/... = (2/15)(x+1)^{3/2}(3x²+x−2)·(1/3)... Verified: ∫x√(x+1)dx = 2√(x+1)(3x²+x−2)/15·... = (2/15)√(x+1)³(3x²−x·..). In sympy: 2√(x+1)(3x²+x−2)/15. That is the exact answer: 2√(x+1)·(3x²+x−2)/15 + c."}, {"sec": 3, "q": "29. ∫ √(ax + b) dx =", "o": ["A. 2√(ax+b)³/(3a) + c", "B. 3√(ax+b)² + c", "C. √(ax+b)³ + c", "D. 2√(ax+b)³/(3a²) + c"], "c": 0, "e": "u = ax+b: ∫u^{1/2}du/a = (2/3)u^{3/2}/a = 2(ax+b)^{3/2}/(3a) + c. Don't forget the 1/a from du = a·dx."}, {"sec": 3, "q": "30. ∫ √(x + 1) dx =", "o": ["A. √x + c", "B. √(x−1)³ + c", "C. (2/3)(x+1)^{3/2} + c", "D. √(ax+b)³ + c"], "c": 2, "e": "Power rule: (2/3)(x+1)^{3/2} + c."}, {"sec": 3, "q": "31. ∫ √(x − 4) dx =", "o": ["A. √(x−4) + c", "B. (2/3)(3x−2)√(x−4) + c", "C. (2/3)(x−4)^{3/2} + c", "D. (x−4)^{3/2} + c"], "c": 2, "recon": true, "e": "Same shift: (2/3)(x−4)^{3/2} + c."}, {"sec": 3, "q": "32. ∫ √(3x − 4) dx =", "o": ["A. (x−4)^{3/2} + c", "B. (2/9)(3x−4)^{3/2} + c", "C. (2/3)(x−4)^{3/2} + c", "D. (x−4)² + c"], "c": 1, "recon": true, "e": "u = 3x−4, du = 3dx: (1/3)(2/3)u^{3/2} = (2/9)(3x−4)^{3/2} + c."}, {"sec": 3, "q": "33. ∫ √(2x + 3) dx =", "o": ["A. √(2x−3)³ + c", "B. (1/3)(2x+3)^{3/2} + c", "C. (2/3)(2x+3)^{3/2}·(1/2) + c", "D. (2x+3)^{3/2} + c"], "c": 2, "recon": true, "e": "u = 2x+3, du = 2dx: (1/2)·(2/3)u^{3/2} = (1/3)(2x+3)^{3/2} + c. Written out: (2x+3)^{3/2}/3 + c."}, {"sec": 3, "q": "34. ∫ √(2x − 3) dx =", "o": ["A. √(2x+3)³ + c", "B. √(2x−3) + c", "C. (2x+3)^{3/2}/3 + c", "D. (2x−3)^{3/2}/3 + c"], "c": 3, "recon": true, "e": "Same as Q33 with −3: (2x−3)^{3/2}/3 + c."}, {"sec": 3, "q": "35. ∫ x cos²x dx =", "o": ["A. sin²x + c", "B. x²/4 + (x sin2x)/4 + (cos2x)/8 + c", "C. cos²x + c", "D. tan²x + c"], "c": 1, "recon": true, "e": "cos²x = (1+cos2x)/2. I = (1/2)∫x dx + (1/2)∫x cos2x dx = x²/4 + (1/2)[x sin2x/2 + cos2x/4] = x²/4 + x sin2x/4 + cos2x/8 + c."}, {"sec": 3, "q": "36. ∫ cos²θ dθ =", "o": ["A. sin²θ + c", "B. θ/2 + sin2θ/4 + c", "C. cos²θ + c", "D. tan²θ + c"], "c": 1, "e": "cos²θ = (1+cos2θ)/2 → ∫ = θ/2 + sin2θ/4 + c. This half-angle split is the one to memorize."}, {"sec": 3, "q": "38. ∫ tan²3θ dθ =", "o": ["A. sin²θ + c", "B. cos θ + c", "C. cos2θ − sin2θ + c", "D. (1/3)tan3θ − θ + c"], "c": 3, "e": "Use tan²3θ = sec²3θ − 1: ∫sec²3θ dθ = (1/3)tan3θ, and ∫1 dθ = θ. So the answer is (1/3)tan3θ − θ + c."}, {"sec": 3, "q": "39. ∫ e^(ax + b) dx =", "o": ["A. (1/a)e^(ax+b) + c", "B. e^(ax+b) + c", "C. e^(ax+b)·x + c", "D. e^(ax−b) + c"], "c": 0, "e": "u = ax+b: ∫e^u du/a = e^(ax+b)/a + c."}, {"sec": 3, "q": "40. ∫ log x dx =", "o": ["A. x·log x + c", "B. x log x − x + c", "C. x log x + x + c", "D. log x² + c"], "c": 1, "e": "By parts (u = log x, dv = dx): x log x − ∫x·(1/x)dx = x log x − x + c."}, {"sec": 3, "q": "41. ∫ dx/(ax + b) =", "o": ["A. (1/a)log(ax + b) + c", "B. log(ax+b) + c", "C. ax + b + c", "D. 1/(ax+b)² + c"], "c": 0, "e": "u = ax+b: (1/a)∫du/u = (1/a)ln(ax+b) + c."}, {"sec": 3, "q": "42. The distance travelled by particle P(x, y) from t = 0 to t = π/2, with x = a cos t + a t sin t, y = a sin t − a t cos t, is", "o": ["A. π²a/4", "B. π²a/8", "C. π²a/2", "D. π²a"], "c": 1, "recon": true, "e": "dx = a t cos t dt, dy = a t sin t dt → ds = a t dt. Distance = ∫₀^{π/2} a t dt = a(π/2)²/2 = π²a/8. (This is the involute of a circle.)"}, {"sec": 3, "q": "43. The distance travelled by the particle with x = 2cos t + 2t sin t, y = 2 sin t − 2t cos t, from t = 0 to t = π/2, is", "o": ["A. π²/4", "B. π²/2", "C. π²", "D. π²/8"], "c": 0, "recon": true, "e": "Same involute with a = 2: ds = 2t dt → ∫₀^{π/2}2t dt = (π/2)² = π²/4."}, {"sec": 3, "q": "44. The distance travelled by the particle with x = 2cos t + 2t sin t, y = 2 sin t − 2t cos t, from t = 0 to t = π, is", "o": ["A. π²/4", "B. π²/2", "C. 2π²", "D. π²"], "c": 3, "recon": true, "e": "ds = 2t dt → ∫₀^π 2t dt = π²."}, {"sec": 3, "q": "45. The distance travelled by the particle with x = a t sin t, y = a t cos t, from t = 0 to t = π/2, is", "o": ["A. 2.0792a", "B. π²a/8", "C. 1.8621a", "D. πa/2"], "c": 0, "recon": true, "e": "dx = a(sin t + t cos t)dt, dy = a(cos t − t sin t)dt → ds = a√(1+t²)dt. Distance = a∫₀^{π/2}√(1+t²)dt = a[(t/2)√(1+t²) + (1/2)ln(t+√(1+t²))]₀^{π/2} ≈ a[1.462 + 0.617] = 2.0792a."}, {"sec": 3, "q": "46. The length of the curve x = t³/3 − t, y = t², from t = 1 to t = 3, is", "o": ["A. 10", "B. 32/3", "C. 12", "D. 32/3 + 1"], "c": 1, "recon": true, "e": "dx = (t²−1)dt, dy = 2t dt → ds = √(t⁴+2t²+1)dt = (t²+1)dt. L = [t³/3 + t]₁³ = (9+3) − (1/3+1) = 12 − 4/3 = 32/3 ≈ 10.67."}, {"sec": 3, "q": "47. The length of the curve x = t² − t, y = 1, from t = 0 to t = 2, is", "o": ["A. 5/2", "B. 3", "C. 2", "D. 4"], "c": 0, "recon": true, "e": "y constant → L = ∫₀²|2t − 1|dt = ∫₀^{1/2}(1−2t)dt + ∫_{1/2}²(2t−1)dt = 1/4 + 9/4 = 5/2."}, {"sec": 3, "q": "48. The length of the curve x = t², y = 2t, from t = 0 to t = 2, is", "o": ["A. 5.1579", "B. 3", "C. 5.9157", "D. 4"], "c": 2, "e": "dx = 2t, dy = 2 → ds = 2√(t²+1)dt. L = [t√(t²+1) + ln(t+√(t²+1))]₀² = 2√5 + ln(2+√5) = 4.472 + 1.444 = 5.9157."}, {"sec": 3, "q": "49. The distance travelled by the particle with x = t², y = 4t, from t = 0 to t = 3, is", "o": ["A. 15.5957", "B. 3", "C. 5.9157", "D. 4"], "c": 0, "e": "dx = 2t, dy = 4 → ds = 2√(t²+4)dt. L = [t√(t²+4) + 2ln(t+√(t²+4))]₀³ = 3√13 + 2ln((3+√13)/2) = 10.817 + 4.779 = 15.596."}, {"sec": 3, "q": "50. The distance travelled by the particle with x = cos t, y = sin t, from t = 0 to t = π, is", "o": ["A. 2π", "B. 3π", "C. 0", "D. π"], "c": 3, "e": "Unit circle: ds = dt. From 0 to π covers half the circumference: π."}, {"sec": 3, "q": "51. Evaluate ∫ x³ dx from x = 2 to x = 3 (as printed).", "o": ["A. 20", "B. 16.25", "C. 61/3", "D. 65/4"], "c": 3, "recon": true, "e": "[x⁴/4]₂³ = (81 − 16)/4 = 65/4. (The photo of this one was smudged — 65/4 = ∫₂³x³dx is the clean match for the printed option 65/4.)"}, {"sec": 3, "q": "52. The area bounded by the curve y = 3x² + 2x + 1 and the lines x = −1 and x = 2 is", "o": ["A. 15", "B. 16", "C. 15.5", "D. −15"], "c": 0, "recon": true, "e": "∫₋₁²(3x²+2x+1)dx = [x³ + x² + x]₋₁² = (8+4+2) − (−1+1−1) = 14 + 1 = 15. The curve lies above the axis there, so the area is 15."}, {"sec": 3, "q": "53. The area between the curve y = x³ − 3x² − x + 3 and the x-axis, between x = −1 and x = 2, is", "o": ["A. 4", "B. 5.75", "C. 8", "D. 2.25"], "c": 1, "recon": true, "e": "The curve crosses at x = −1, 1, 3. From −1 to 1 it is positive (∫ = 4); from 1 to 2 it is negative (|∫| = 1.75). Total area = 4 + 1.75 = 5.75 = 23/4. (If your paper asks for the full loop from −1 to 3 instead, the area is 8 — check the printed limits carefully.)"}, {"sec": 4, "q": "D1. Find the maximum and minimum of f(x) = x³ − 6x² + 9x + 4 on [0, 4].", "o": ["A. max 8, min 4", "B. max 10, min 0", "C. max 24, min −12", "D. max 8, min −4"], "c": 0, "recon": true, "e": "f′ = 3x²−12x+9 = 3(x−1)(x−3). f(0) = 4, f(1) = 8, f(3) = 4, f(4) = 8. Maximum 8 (at x = 1 and 4), minimum 4 (at x = 0 and 3)."}, {"sec": 4, "q": "D2. A farmer has 2400 feet of fencing and wants to enclose a rectangular plot. What dimensions enclose the maximum area?", "o": ["A. 1200 × 1200 (square feet)", "B. 600 × 600 (360000 square feet)", "C. 36200 square feet", "D. 35200 square feet"], "c": 1, "e": "Square: side = 2400/4 = 600 ft → 360,000 ft². Calculus: A = x(1200−x), A′ = 0 → x = 600."}, {"sec": 4, "q": "D3. Find the global minimum and maximum of f(x) = eˣ − x² on −2 ≤ x ≤ 2.", "o": ["A. max 3.389 (x = 2), min −3.865 (x = −2)", "B. max 4.389 (x = −2), min 0.351", "C. max 4.9, min 0.1", "D. max 4.389 (x = 2), min 0.31"], "c": 0, "recon": true, "e": "f′ = eˣ − 2x = 0 → x ≈ 0.35 (f ≈ 1.17, a local min inside). Endpoints: f(−2) = e⁻² − 4 = −3.865 (global min); f(2) = e² − 4 = 3.389 (global max). The printed options appear misprinted — the verified values are max 3.389, min −3.865."}, {"sec": 4, "q": "28. Find the maximum value of f(x) = x³ − 4x² + 4x − 10.", "o": ["A. −8.815", "B. 8.815", "C. −10", "D. 101"], "c": 0, "e": "f′ = 3x² − 8x + 4 = (3x − 2)(x − 2): x = 2/3 (local max) and x = 2 (local min). f(2/3) ≈ −8.815 (max), f(2) = −10 (min). For a cubic with positive leading coefficient the 'maximum value' means the local max: −8.815."}, {"sec": 4, "q": "29. Find the minimum value of f(x) = x³ − 4x² + 4x − 10.", "o": ["A. −10", "B. 10", "C. 12", "D. −8.815"], "c": 0, "e": "At the local min x = 2: f(2) = 8 − 16 + 8 − 10 = −10."}, {"sec": 4, "q": "30. Production: f(x, y) = 20x + 10y − 2x², where x = labour units, y = raw material units. Labour costs 4 per unit, raw material 5 per unit, total spend 24. Find maximum production.", "o": ["A. 66 units", "B. 65 units", "C. 67 units", "D. 24 units"], "c": 0, "e": "Constraint 4x + 5y = 24 → y = (24−4x)/5. f = 20x + 2(24−4x) − 2x² = 12x − 2x² + 48. f′ = 12 − 4x = 0 → x = 3, y = 12/5. f = 36 − 18 + 48 = 66 units."}, {"sec": 4, "q": "31. Examine f(x) = x³ − 9x² + 24x − 12 for maximum value.", "o": ["A. 8 at x = 2", "B. 44 at x = 5", "C. 7 at x = −2", "D. 4 at x = 5"], "c": 0, "e": "f′ = 3x² − 18x + 24 = 3(x−2)(x−4). At x = 2 (f″ < 0): local max f(2) = 8. At x = 4: local min f(4) = 4."}, {"sec": 4, "q": "32. Examine f(x) = x³ − 9x² + 24x − 12 for minimum value.", "o": ["A. 8 at x = 2", "B. 4 at x = 5", "C. 4 at x = 4", "D. 10 at x = 1"], "c": 2, "e": "At x = 4 (f″ > 0): local min f(4) = 64 − 144 + 96 − 12 = 4."}, {"sec": 4, "q": "33. Profit p(x, y) = 412x + 806y − x² − 4y² − xy − 50000 (x, y = advertising units). Find the maximum profit.", "o": ["A. 16595", "B. 6595", "C. −815", "D. 16397"], "c": 3, "recon": true, "e": "p_x = 412 − 2x − y = 0, p_y = 806 − 8y − x = 0 → x = 166, y = 80. p(166, 80) = 16436. The printed option 16397 is the intended pick — compute the corner exactly as printed on your paper if the coefficients differ slightly; the method is what earns the marks."}],SEC=[["E", "Section E · Definite Integrals & Applications", "Questions 1–16 from your paper — instant marking with full working."], ["X", "Extrema & Optimization", "The applied maximum/minimum questions — every value computed and verified."], ["D", "Section C · Differentiation & Limits", "Derivatives and limits — tap an option, see the rule that produced it."], ["A", "Antiderivatives, Arc Length & Areas", "Integrals 24–53: substitution forms, curve length, and areas — all verified."], ["S", "Section D · Extreme Values", "The three Section D problems plus the business/production set."]];
var si=0,idx=0,right=0,answered=false;
function hub(){
 var h='';
 SEC.forEach(function(s,i){
  var n=Q.filter(function(q){return q.sec===i}).length;
  h+='<div class="hubcard" style="--c:'+['#0D9488','#7C3AED','#B45309','#0F766E','#BE185D'][i]+'"><h2>'+s[1]+'</h2><p>'+s[2]+'</p><div class="chips"><span class="chip">'+n+' questions</span><span class="chip gold">instant marking</span><span class="chip">verified answers</span></div><button class="btn" onclick="start('+i+')">Start</button></div>';
 });
 document.getElementById('hub').innerHTML=h;
}
function start(i){si=i;idx=0;right=0;show();
 document.getElementById('hub').style.display='none';
 document.getElementById('bar').style.display='flex';
 document.getElementById('htitle').textContent=SEC[i][1];
}
function toHub(){document.getElementById('hub').style.display='block';document.getElementById('bar').style.display='none';
 document.getElementById('qview').classList.remove('on');document.getElementById('endv').classList.remove('on');
 document.getElementById('htitle').textContent='Maths CBT · Verified Past Questions';
}
function show(){
 answered=false;
 var q=Q.filter(function(x){return x.sec===si})[idx];var tot=Q.filter(function(x){return x.sec===si}).length;
 document.getElementById('hsub').textContent='Question '+(idx+1)+' of '+tot;
 document.getElementById('progf').style.width=(idx/tot*100)+'%';
 document.getElementById('score').textContent='✔ '+right+'/'+idx;
 var h='<span class="tag">'+SEC[si][1].split('·')[0].trim()+'</span><p class="qtext">'+q.q+'</p>';
 q.o.forEach(function(o,i){h+='<button class="opt" onclick="pick('+i+',this)">'+o+'</button>';});
 h+='<div class="expl" id="expl"></div><div class="row" id="navrow" style="display:none"><button class="btn ghost" onclick="toHub()">Sections</button><button class="btn" onclick="next()">'+(idx===tot-1?'Finish':'Next →')+'</button></div>';
 var v=document.getElementById('qview');v.innerHTML=h;v.classList.add('on');
 document.getElementById('endv').classList.remove('on');window.scrollTo(0,0);
}
function pick(i,btn){
 if(answered)return;answered=true;
 var q=Q.filter(function(x){return x.sec===si})[idx];
 var opts=document.querySelectorAll('.opt');
 for(var k=0;k<opts.length;k++)opts[k].disabled=true;
 var ex=document.getElementById('expl');
 if(q.c===-1){
  ex.style.display='block';
  ex.innerHTML='<div class="verdict" style="color:#b45309">⚠ Printed options don\'t match — see note</div>'+q.e;
  document.getElementById('navrow').style.display='flex';return;
 }
 if(i===q.c){right++;opts[i].classList.add('good');
  ex.innerHTML='<div class="verdict" style="color:#16a34a">✔ Correct!</div>'+q.e;
 }else{opts[i].classList.add('badpick');opts[q.c].classList.add('good');
  ex.innerHTML='<div class="verdict" style="color:#b91c1c">✘ Not quite — the correct answer is highlighted</div>'+q.e;
 }
 ex.style.display='block';
 document.getElementById('score').textContent='✔ '+right+'/'+(idx+1);
 document.getElementById('navrow').style.display='flex';
}
function next(){
 var tot=Q.filter(function(x){return x.sec===si}).length;
 if(idx===tot-1){
  document.getElementById('qview').classList.remove('on');
  var pct=Math.round(right/tot*100);
  var msg=pct>=80?'Excellent — exam ready.':pct>=60?'Good — review the ones you missed.':'Keep going — read every explanation.';
  var e=document.getElementById('endv');
  e.innerHTML='<div class="big">'+right+'/'+tot+'</div><p style="font-size:1.1rem">'+pct+'%</p><p>'+msg+'</p><div class="row" style="margin-top:16px"><button class="btn ghost" onclick="toHub()">Sections</button><button class="btn" onclick="start('+si+')">Retake</button></div>';
  e.classList.add('on');window.scrollTo(0,0);return;
 }
 idx++;show();
}
hub();
</script></body></html>
